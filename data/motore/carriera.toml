[motivazioni.usn]
conferisce_it = { alta = "Il Presidente degli Stati Uniti ha il piacere di conferire", media = "Il Segretario della Marina ha il piacere di conferire", bassa = "Il Comandante della Flotta ha il piacere di conferire" }
conferisce_en = { alta = "The President of the United States takes pleasure in presenting", media = "The Secretary of the Navy takes pleasure in presenting", bassa = "The Commander in Chief of the Fleet takes pleasure in presenting" }
formula_it = { valore = "per lo straordinario eroismo dimostrato", merito = "per la condotta eccezionalmente meritoria", servizio = "per il servizio meritorio prestato", soccorso = "per l'eroismo dimostrato nel soccorso di uomini in mare" }
formula_en = { valore = "for extraordinary heroism", merito = "for exceptionally meritorious conduct", servizio = "for meritorious service", soccorso = "for heroism in the rescue of men at sea" }
apertura_it = "{da} la {decorazione} al {grado} {nome}, Marina degli Stati Uniti,"
apertura_en = "{da} the {decorazione} to {grado} {nome}, United States Navy,"
incarico_it = "{formula} come {incarico} dell'USS {battello} durante operazioni nel {teatro}, {periodo}."
incarico_en = "{formula} as {incarico} of USS {battello} during operations in the {teatro}, {periodo}."
chiusura_it = "Il suo coraggio, il suo giudizio e la sua dedizione al dovere furono all'altezza delle più alte tradizioni della Marina degli Stati Uniti."
chiusura_en = "The courage, judgment and devotion to duty displayed were in keeping with the highest traditions of the United States Naval Service."
reparto_it = "{da} la {decorazione} all'equipaggio dell'USS {battello} {formula} durante operazioni nel {teatro}, {periodo}."
reparto_en = "{da} the {decorazione} to the crew of USS {battello} {formula} during operations in the {teatro}, {periodo}."
postuma_it = "alla memoria"
postuma_en = "posthumously"
segreto_it = "I particolari dell'operazione restano coperti dal segreto."
segreto_en = "The details of the operation remain classified."

[motivazioni.vmf]
intestazione_it = "Decreto del Presidium del Soviet Supremo dell'URSS."
intestazione_en = "Decree of the Presidium of the Supreme Soviet of the USSR."
formula_it = { valore = "Per il coraggio e l'eroismo dimostrati nell'adempimento del dovere militare", speciale = "Per il coraggio e l'audacia dimostrati nell'esecuzione di un incarico speciale del comando", merito = "Per i successi nell'addestramento al combattimento e politico", servizio = "Per il servizio esemplare", soccorso = "Per il coraggio e l'abnegazione dimostrati nel salvataggio di vite umane in mare" }
formula_en = { valore = "For courage and heroism displayed in the performance of military duty", speciale = "For courage and daring displayed in carrying out a special assignment of the command", merito = "For success in combat and political training", servizio = "For exemplary service", soccorso = "For courage and selflessness displayed in saving human lives at sea" }
dispositivo_it = "{formula}, decorare con {decorazione} il {grado} {nome}, {incarico} del {battello}."
dispositivo_en = "{formula}, to award the {decorazione} to {grado} {nome}, {incarico} of {battello}."
eroe_it = "{formula}, conferire il titolo di Eroe dell'Unione Sovietica con la consegna dell'Ordine di Lenin e della medaglia Stella d'oro al {grado} {nome}, {incarico} del {battello}."
eroe_en = "{formula}, to confer the title of Hero of the Soviet Union, with the Order of Lenin and the Gold Star medal, on {grado} {nome}, {incarico} of {battello}."
reparto_it = "{formula}, decorare con {decorazione} il sottomarino {battello}."
reparto_en = "{formula}, to award the {decorazione} to the submarine {battello}."
postuma_it = "alla memoria"
postuma_en = "posthumously"
chiusura_it = "Mosca, Cremlino, {data}."
chiusura_en = "Moscow, the Kremlin, {data}."
segreto_it = "Non per la stampa."
segreto_en = "Not for publication."

