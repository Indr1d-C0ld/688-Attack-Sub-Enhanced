# Missioni rapide procedurali (roadmap punto 10): tabelle del generatore (engine/missioni/src/missione_rapida.cpp).
#
# Il generatore e' deterministico: lo stesso codice missione deve dare lo stesso file. Una modifica a queste tabelle
# che cambia le missioni generate va con un nuovo numero di `versione` (e con la versione nel codice: i codici delle
# versioni precedenti vengono rifiutati, le missioni gia' generate restano giocabili perche' sono file salvati).
versione = 1

# --- teatri -----------------------------------------------------------------------------------------------------------
# pesi: probabilita' relative dei tipi quando il tipo e' «a caso», per parte (usa = 688, urss = Alfa); 0 = mai.
# luoghi: nome italiano e inglese (en), lat e lon veri (anche fuori dalla carta per le basi degli aerei); il generatore li sposta nell'acqua utile
# piu' vicina. tipo: base (navale), aeroporto, porto, stretto, mare; parte: nato, urss, neutrale.
# forze: le classi per ruolo e per parte avversaria del giocatore (o amica, nella scorta), solo quelle di classi.toml.

