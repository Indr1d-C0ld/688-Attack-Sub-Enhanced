# Il video d'apertura (docs/29_video_apertura.md): la regia che il motore recita all'avvio, sulle scene di data/motore/apertura.
# Battute a 72 alla semiminima (3,33 s). `compressione`: s di missione per secondo di film (0: la scena aspetta).
# `ritaglio`: x, y, l, a sulla tela: resta solo lo strumento, nel nero, senza le scritte d'aiuto delle stazioni; `scala` lo ingrandisce.
# `cuffia`: il volume del mare in cuffia, che fa la crescita fra i quattro tempi. `tramonto`: il sole basso nella palette del film.
# Le navi lontane entrano a 112 s, quelle dei periscopi a 162 s; il 688 lancia a 243,6 s e l'Alfa a 247 s: gli stessi istanti di scene_interazioni --apertura.
bpm = 72.0
preriscaldo_s = 30.0
seme = 3   # nessuna sorgente ambientale sopra il rumore nel silenzio (col seme 1, un peschereccio a 6,9 km faceva una banda a 160 gradi); la riga della nave resta uguale
brano = "apertura"
anno = 1989
mese = 6
giorno = 12
ora_utc = 21.55
latitudine = 60.9
longitudine = -7.0

# --- il silenzio ---
[[inquadratura]]   # 01: nero; un ping lontanissimo e il suo eco
ping = true
[[inquadratura]]   # 02: la cascata del 688, rumore di mare
battello = "688"
stazione = 8
cifre = [8]
compressione = 4.0
ritaglio = [5, 40, 315, 238]
scala = 2.0
cuffia = 0.25
entra_s = 1.0
[[inquadratura]]   # 03: lo strumento dell'Alfa, rumore di mare
battello = "alfa"
stazione = 8
cifre = [8]
compressione = 4.0
ritaglio = [8, 2, 304, 284]
scala = 1.65
cuffia = 0.09
entra_s = 1.0
[[inquadratura]]   # 04: la carta del 688 vuota
battello = "688"
stazione = 6
compressione = 4.0
ritaglio = [0, 18, 640, 332]
luce = 0.55
entra_s = 1.0

