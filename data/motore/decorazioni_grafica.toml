# Parte grafica delle decorazioni (M4, engine/grafica/decorazioni.hpp), scritta a mano: forma della medaglia, metallo,
# classe, ordini a vite. Gli id, i nomi, la precedenza e i colori dei nastrini vengono da carriera.toml (M3,
# tools/pipeline/carriera.py), l'unica fonte: qui ci sono gli stessi id, e una prova controlla che coincidano.
#
# forma: nessuna (solo nastrino), distintivo (si disegna sull'uniforme), attestato (citazione incorniciata),
#        croce_patente, stella_capovolta, medaglione, stella_con_corona, stella, legione, ottagono, cuore,
#        stella_raggiata, esagono, quadrato, tondo, stella_oro, ordine_lenin, bandiera_rossa, stella_rossa,
#        servizio_patria, stella_otto, ordine_usakov
# metallo: oro, argento, bronzo.  lettera: dispositivo fisso sul nastrino ("E" del Navy «E» Ribbon)

