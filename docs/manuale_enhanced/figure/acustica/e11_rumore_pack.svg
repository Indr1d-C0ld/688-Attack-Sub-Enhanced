<text x='222.9' y='402' font-size='11' fill='#898781' text-anchor='middle'>100</text>
<line x1='373.7' y1='64' x2='373.7' y2='384' stroke='#e1e0d9'/>
<text x='373.7' y='402' font-size='11' fill='#898781' text-anchor='middle'>1 k</text>
<line x1='524.6' y1='64' x2='524.6' y2='384' stroke='#e1e0d9'/>
<text x='524.6' y='402' font-size='11' fill='#898781' text-anchor='middle'>10 k</text>
<line x1='72' y1='384.0' x2='570' y2='384.0' stroke='#e1e0d9'/>
<text x='64' y='388.0' font-size='11' fill='#898781' text-anchor='end'>20</text>
