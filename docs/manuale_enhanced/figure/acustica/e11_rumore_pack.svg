<line x1='72' y1='88.6' x2='570' y2='88.6' stroke='#e1e0d9'/>
<text x='64' y='92.6' font-size='11' fill='#898781' text-anchor='end'>80</text>
<rect x='72' y='64' width='498' height='320' fill='none' stroke='#c3c2b7'/>
<text x='321' y='426' font-size='12' fill='#52514e' text-anchor='middle'>frequenza (Hz)</text>
<text x='18' y='224' font-size='12' fill='#52514e' text-anchor='middle' transform='rotate(-90 18 224)'>livello spettrale (dB re 1 µPa²/Hz)</text>
<path d='M72.0,97.5 L117.4,113.7 L177.4,127.0 L222.9,148.7 L268.3,167.4 L328.3,173.3 L373.7,182.2 L419.1,198.9 L479.2,228.9 L524.6,255.5 L570.0,283.6' fill='none' stroke='#2a78d6' stroke-width='2' stroke-linejoin='round'/>
