<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img' aria-label='Rumore ambiente sotto il pack, col freddo e senza, contro il mare aperto col vento a 5 m/s'>
<title>Rumore ambiente sotto il pack, col freddo e senza, contro il mare aperto col vento a 5 m/s</title>
<rect width='760' height='440' fill='#fcfcfb'/>
<text x='72' y='26' font-size='16' font-weight='bold' fill='#0b0b0b'>Il rumore ambiente sotto il pack e in mare aperto</text>
<text x='72' y='46' font-size='12' fill='#52514e'>Livello spettrale, traffico 0,5. Pack a copertura piena con le creste a 0,6.</text>
<line x1='72.0' y1='64' x2='72.0' y2='384' stroke='#e1e0d9'/>
<text x='72.0' y='402' font-size='11' fill='#898781' text-anchor='middle'>10</text>
