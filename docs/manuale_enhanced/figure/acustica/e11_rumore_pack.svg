<line x1='584' y1='104' x2='608' y2='104' stroke='#eb6834' stroke-width='2' stroke-dasharray='7 4'/>
<text x='614' y='108' font-size='11' fill='#0b0b0b'>pack, aria −30 °C</text>
<text x='614' y='121' font-size='11' fill='#0b0b0b'>(fessure termiche)</text>
<line x1='584' y1='138' x2='608' y2='138' stroke='#1baf7a' stroke-width='2' stroke-dasharray='2 3'/>
<text x='614' y='142' font-size='11' fill='#0b0b0b'>pack, aria sopra</text>
<text x='614' y='155' font-size='11' fill='#0b0b0b'>−10 °C (niente fessure)</text>
</svg>
