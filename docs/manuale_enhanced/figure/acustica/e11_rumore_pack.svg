<text x='64' y='289.5' font-size='11' fill='#898781' text-anchor='end'>40</text>
<line x1='72' y1='236.3' x2='570' y2='236.3' stroke='#e1e0d9'/>
<text x='64' y='240.3' font-size='11' fill='#898781' text-anchor='end'>50</text>
<line x1='72' y1='187.1' x2='570' y2='187.1' stroke='#e1e0d9'/>
<text x='64' y='191.1' font-size='11' fill='#898781' text-anchor='end'>60</text>
<line x1='72' y1='137.8' x2='570' y2='137.8' stroke='#e1e0d9'/>
