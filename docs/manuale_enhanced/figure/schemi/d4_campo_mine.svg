<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img' aria-label='Il settore del BQS-15 su un campo di mine ormeggiate e sul fondo, con le mine viste e quelle no'>
<title>Il settore del BQS-15 su un campo di mine ormeggiate e sul fondo, con le mine viste e quelle no</title>
<rect width='760' height='440' fill='#fcfcfb'/>
<text x='36.0' y='26.0' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Il BQS-15 su un campo di mine</text>
<text x='36.0' y='46.0' font-size='12' fill='#52514e' text-anchor='start'>Settore di ±60° dalla rotta, una spazzata ogni 8 s. A 5 nodi: 1.100 m per le mine ormeggiate, 450 per quelle sul fondo.</text>
