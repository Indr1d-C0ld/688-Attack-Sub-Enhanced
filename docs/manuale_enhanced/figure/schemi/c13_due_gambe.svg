<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img' aria-label='La TMA a due gambe: il battello accosta e i rilevamenti fissano la soluzione'>
<title>La TMA a due gambe: il battello accosta e i rilevamenti fissano la soluzione</title>
<rect width='760' height='440' fill='#fcfcfb'/>
<text x='36.0' y='26.0' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>La TMA a due gambe</text>
<text x='36.0' y='46.0' font-size='12' fill='#52514e' text-anchor='start'>Con una sola gamba i rilevamenti vanno bene per infinite soluzioni; con due, una sola le spiega tutte.</text>
