<path d='M600.0,110.0 L569.1,110.0 L538.3,110.0 L507.4,110.0 L476.5,110.0 L445.7,110.0 L414.8,110.0 L384.0,110.0 L353.1,110.0 L322.2,110.0 L291.4,110.0 L260.5,110.0 L229.6,110.0' fill='none' stroke='#eb6834' stroke-width='3' stroke-linejoin='round'/>
<text x='120.0' y='398.0' font-size='11' fill='#0b0b0b' text-anchor='start'>gamba 1: rotta 090</text>
<text x='280.1' y='384.0' font-size='11' fill='#0b0b0b' text-anchor='start'>accostata</text>
<text x='350.2' y='251.7' font-size='11' fill='#0b0b0b' text-anchor='start'>gamba 2: rotta 030</text>
<text x='600.0' y='100.0' font-size='11' fill='#0b0b0b' text-anchor='end'>il bersaglio, rotta 270, 10 nodi</text>
<text x='470.0' y='380.0' font-size='11' fill='#52514e' text-anchor='start'>In grigio i rilevamenti ogni 3 minuti e mezzo.</text>
<text x='470.0' y='396.0' font-size='11' fill='#52514e' text-anchor='start'>Il rateo cambia con l&#39;accostata: dalla differenza dei</text>
<text x='470.0' y='412.0' font-size='11' fill='#52514e' text-anchor='start'>ratei sulle due gambe viene la distanza (Ekelund).</text>
</svg>
