<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img' aria-label='Il regolo di Ekelund: una striscia con una tacca per linea di rilevamento lungo la rotta stimata del bersaglio'>
<title>Il regolo di Ekelund: una striscia con una tacca per linea di rilevamento lungo la rotta stimata del bersaglio</title>
<rect width='760' height='440' fill='#fcfcfb'/>
<text x='36.0' y='26.0' font-size='16' fill='#0b0b0b' text-anchor='start' font-weight='bold'>Il regolo di Ekelund</text>
<text x='36.0' y='46.0' font-size='12' fill='#52514e' text-anchor='start'>La striscia graduata alla velocità stimata, posata sull&#39;ultima linea e ruotata finché le tacche cadono sulle linee.</text>
