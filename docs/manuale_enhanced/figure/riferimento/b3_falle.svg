<text x='64' y='148.0' font-size='11' fill='#898781' text-anchor='end'>1000</text>
<line x1='72' y1='64.0' x2='570' y2='64.0' stroke='#e1e0d9'/>
<text x='64' y='68.0' font-size='11' fill='#898781' text-anchor='end'>10000</text>
