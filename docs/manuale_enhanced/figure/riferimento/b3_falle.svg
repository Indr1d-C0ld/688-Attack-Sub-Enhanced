<svg xmlns='http://www.w3.org/2000/svg' width='760' height='440' viewBox='0 0 760 440' font-family='DejaVu Sans, Helvetica, Arial, sans-serif' role='img' aria-label='La portata di una falla con la quota per quattro aree, da una tenuta a un metro quadrato'>
<title>La portata di una falla con la quota per quattro aree, da una tenuta a un metro quadrato</title>
<rect width='760' height='440' fill='#fcfcfb'/>
<text x='72' y='26' font-size='16' font-weight='bold' fill='#0b0b0b'>Quanto entra da una falla</text>
<text x='72' y='46' font-size='12' fill='#52514e'>Portata a compartimento asciutto, Q = 0,62 · A · √(2 Δp / ρ), in m³ al minuto.</text>
