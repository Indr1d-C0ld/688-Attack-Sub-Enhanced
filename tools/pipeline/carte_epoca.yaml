# Parametri delle carte d'epoca (tools/pipeline/carta_epoca.py, docs/08 §5, dossier 06 §3.3 e §7.4).
# Tutti i valori sono STIME DI GIOCO (confidenza bassa), dalla tabella del dossier 06 §3.3; per la parte
# sovietica la tabella si inverte nelle acque di casa (Barents, Okhotsk, Baltico orientale) e peggiora un po'
# nelle acque NATO, dove pero' l'URSS aveva rilevato molto con le sue navi idrografiche.
#
# Per teatro: `zone`, nell'ordine (vince la prima che contiene la cella; l'ultima senza `poligono` e' il resto).
# Per zona e per parte (nato, urss):
#   spaziatura_km: [sulle soglie e in piattaforma, nei bacini] fra le linee di rilievo; fra le due si passa
#                  con la profondita' (`profondita_soglia_m` del teatro: fitta sopra, rada oltre il doppio)
#   spostamento_nm: [min, max] dello spostamento orizzontale di una campagna (blocchi di 20-50 nm)
#   copertura: frazione delle campagne rilevate davvero (le altre restano «non rilevate»: solo sondaggi sparsi)
#   fascia_negata_km: entro questa distanza dalla terra la parte non ha rilevato (acque territoriali avversarie)
#   anni: [primo, ultimo] anno delle campagne
#   ente: chi ha rilevato (per il cartiglio della carta)
#   annotazioni: probabilita' che un rilievo sparito dalla carta compaia come nota (ED, PA, profondita' minore)
# poligono: [lon, lat] in gradi decimali.
predefiniti:
  sondaggi_sparsi_km: 8        # un sondaggio sparso ogni tanti km di lato, ovunque (carte vecchie, passaggi isolati)
  cono_gradi: 15               # semiapertura dell'ecoscandaglio (minimo della quota nell'impronta)
  sigma_velocita_suono: [0.01, 0.03]   # scarto per campagna, in frazione (segno a caso)
  rumore_profondita: 0.005
  blocco_nm: [20, 50]
  edizione: {nato: 1988, urss: 1987}
  massimo_annotazioni: 60

