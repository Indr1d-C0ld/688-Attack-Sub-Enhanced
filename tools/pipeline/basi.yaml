# Catalogo delle basi dell'enciclopedia (docs/00_ROADMAP.md, requisito 14): basi navali, basi sottomarini, basi aeree e
# porti legati ai 7 teatri (tools/pipeline/teatri.yaml) nel 1985-1990. Letto da tools/pipeline/enciclopedia.py
# (categoria «base»); i testi stanno in enciclopedia_testi/basi_sistemi.yaml (voci «base.<id>").
# Solo basi citate nei dossier di docs/ricerca (soprattutto 03, Parte A, «Significato operativo»); nessun fatto dal web.
# Campi:
#   teatro: id di teatri.yaml a cui la base serve (anche se cade fuori dal riquadro della carta);
#   tipo: base navale | base sottomarini | base aerea | porto;
#   nazione: lo schieramento, non la bandiera: usa, uk, nato (alleati NATO, Francia compresa), urss (Unione Sovietica e
#            marine del Patto di Varsavia: RDT, Polonia), jp (Giappone, schierato con gli USA), neutrale (fuori dai
#            blocchi: Jugoslavia, Albania);
#   lat, lon: gradi decimali (lon negative = Ovest). Quasi nessuna coordinata e' nei dossier: il dato «posizione» di
#            ogni base dice da dove viene e, se stimata, ha conf STIMA;
#   dati: righe della scheda (campo, nome_it, nome_en, testo_it, testo_en, fonte, conf);
#   fonte, conf: la fonte principale della base e la confidenza sul suo ruolo nel periodo.
# Lacune: Faslane e Holy Loch, Plymouth/Devonport, Swinoujscie, Yuzhno-Kurilsk e Nemuro non compaiono nei dossier come
# basi; Karlskrona compare solo per l'incidente dell'U 137 (03 §A7), non come base. Delle basi giapponesi ci sono solo
# quelle che il dossier 03 §A5 cita per la sorveglianza dello stretto di Soya (Wakkanai, Hachinohe, Misawa): niente su
# Hakodate e Ominato.

# --- Faroe - Mar di Norvegia ---

