# Testi dell'enciclopedia per le basi (tools/pipeline/basi.yaml, voci «base.<id>») e i sistemi di bordo
# (tools/pipeline/sistemi_bordo.yaml, voci «sistema.<id>»). Scritti a mano, in parafrasi dai dossier di docs/ricerca e
# dal progetto dei danni (docs/10_danni_affondamento_esplosioni.md), con le fonti. Stesso formato di campioni.yaml:
# it, en (2-5 frasi, storia e funzione); uso_it, uso_en (basi: il significato pratico in una frase; sistemi: che cosa
# succede in gioco quando il sistema e' danneggiato e come gestirlo); fonti (elenco).

# ============================== BASI ==============================

base.keflavik:
  it: >-
    La stazione aeronavale americana in Islanda era il perno della sorveglianza del varco GIUK. Dal 1966 vi lavorava
    una stazione d'ascolto del SOSUS, e uno squadrone di P-3 vi ruotava da Brunswick, nel Maine. Dai suoi aerei il
    varco fra Islanda e Faroe dista 250-400 miglia, abbastanza vicino da restarci 6-7 ore per sortita.
  en: >-
    The US naval air station in Iceland was the hub of GIUK gap surveillance. From 1966 it hosted a SOSUS listening
    station, and a P-3 squadron rotated there from Brunswick, Maine. The Iceland-Faroe gap lies 250-400 miles from its
    aircraft, close enough for 6-7 hours on station per sortie.
  uso_it: >-
    Quando il SOSUS ti scopre nel varco, il P-3 che arriva sul datum di solito e' decollato da qui.
  uso_en: >-
    When SOSUS detects you in the gap, the P-3 that reaches the datum has usually taken off from here.
  fonti: ['dossier 03 §A1', 'dossier 17 §5.1 [WPVP11] [HOLLER] [CALC]', 'dossier 08 §2.1']

base.kinloss:
  it: >-
    Base della RAF, sede dei pattugliatori Nimrod. Era uno degli anelli della catena con cui
    la NATO teneva d'occhio i sottomarini sovietici diretti in Atlantico, insieme al SOSUS, ai P-3 di Keflavík e alle
    barriere di sottomarini alleati. I suoi aerei coprivano anche gli approcci occidentali.
  en: >-
    RAF base, home of the Nimrod patrol aircraft. It was one link in the chain NATO used to
    watch Soviet submarines heading into the Atlantic, together with SOSUS, the Keflavík P-3s and allied submarine
    barriers. Its aircraft also covered the Western Approaches.
  uso_it: >-
    Fra le Faroe un aereo britannico puo' comparire sopra di te anche senza P-3 americani in zona.
  uso_en: >-
    Around the Faroes a British aircraft may appear overhead even with no US P-3 in the area.
  fonti: ['dossier 03 §A1 (Cote, The Third Battle)', 'dossier 03 §A6']

base.severomorsk:
  it: >-
    Sede del comando della Flotta del Nord, sulla sponda orientale della baia di Kola. Dall'aeroporto di Severomorsk-1
    volavano gli Il-38 antisommergibile, e vicino a Severomorsk-3 sorgeva ZEVS, il trasmettitore a 82 Hz che raggiungeva
    i sottomarini in profondità. Nella missione 3 del gioco è il porto che l'Alfa deve mettere in sicurezza prima di
    rientrare.
  en: >-
    Headquarters of the Northern Fleet, on the eastern shore of the Kola Gulf. Il-38 anti-submarine aircraft flew from
    the Severomorsk-1 airfield, and near Severomorsk-3 stood ZEVS, the 82 Hz transmitter that reached submarines at
    depth. In the game's mission 3 it is the port the Alfa must secure before returning.
  uso_it: >-
    Negli approcci di Kola il traffico militare è fitto e gli aerei antisommergibile decollano dalla stessa baia.
  uso_en: >-
    In the Kola approaches military traffic is dense and anti-submarine aircraft take off from the same gulf.
  fonti: ['dossier 03 §0, §A2 (Polmar & Moore 2004)', 'dossier 17 §3.4 [RW-Il38]', 'dossier 08 §6.1 [WPZEVS] [RUCOM]']

base.polyarny:
  it: >-
    Base navale sulla sponda occidentale della baia di Kola, verso l'imboccatura. Insieme a Severomorsk e Gadžievo
    alimenta il traffico militare sovietico che rende rumorosi gli approcci di Kola. Nella missione 3 l'Alfa del
    giocatore pattuglia proprio la sua costa a caccia di intrusi.
  en: >-
    Naval base on the western shore of the Kola Gulf, towards its entrance. Together with Severomorsk and Gadzhiyevo it
    feeds the Soviet military traffic that makes the Kola approaches noisy. In mission 3 the player's Alfa patrols its
    coast hunting for intruders.
  uso_it: >-
    Vicino a Poljarnyj il rumore del traffico copre l'intruso, ma copre anche te.
  uso_en: >-
    Near Polyarny traffic noise masks the intruder, but it masks you as well.
  fonti: ['dossier 03 §A2', 'dossier 10 radio §5.4', 'data/missioni/SCENE3B.lua (briefing)']

base.gadzhievo:
  it: >-
    Base dei sottomarini lanciamissili balistici della Flotta del Nord, in una baia accanto all'imboccatura di Kola. I
    suoi SSBN pattugliavano il Barents, che l'intelligence occidentale chiamava «bastione»: un mare difeso da aerei,
    navi e sottomarini d'attacco, dove i missili non dovevano più superare le barriere alleate.
  en: >-
    Ballistic missile submarine base of the Northern Fleet, in a bay beside the Kola entrance. Its SSBNs patrolled the
    Barents, which Western intelligence called the «bastion»: a sea defended by aircraft, ships and attack submarines,
    from which the missiles no longer had to cross the allied barriers.
  uso_it: >-
    Un SSBN uscito da qui è il bersaglio più prezioso del Barents, e il più protetto.
  uso_en: >-
    An SSBN sailing from here is the most valuable target in the Barents, and the best protected.
  fonti: ['dossier 03 §A2 (Polmar & Moore 2004; CIA 2017)', 'dossier 17 §5.6']

base.zapadnaya_litsa:
  it: >-
    Base sottomarini in un fiordo a ovest della baia di Kola, sede degli Alfa del Progetto 705 e dei Victor. Da qui
    uscivano i battelli più veloci della Guerra Fredda. Nel 1989 però quasi tutti gli Alfa erano in riserva o fermi, e
    cinque furono radiati l'anno dopo.
  en: >-
    Submarine base in a fjord west of the Kola Gulf, home of the Project 705 Alfas and the Victors. The fastest boats
    of the Cold War sailed from here. By 1989, however, almost all Alfas were in reserve or laid up, and five were
    struck off the following year.
  uso_it: >-
    È la casa dell'Alfa del giocatore sovietico.
  uso_en: >-
    It is the home port of the Soviet player's Alfa.
  fonti: ['dossier 03 §A2 (Polmar & Moore 2004)', 'dossier 01 §2.4 [DS705]']

base.gremikha:
  it: >-
    Base di SSBN della Flotta del Nord sulla costa orientale della penisola di Kola, più a est degli altri porti. Insieme
    a Gadžievo ospitava i sottomarini lanciamissili del bastione del Barents.
  en: >-
    Northern Fleet SSBN base on the eastern coast of the Kola Peninsula, east of the other ports. Together with
    Gadzhiyevo it hosted the missile submarines of the Barents bastion.
  uso_it: >-
    Sta fuori dalla carta del teatro: è una delle basi del bastione, non un luogo dove si combatte.
  uso_en: >-
    It lies off the theatre chart: it is one of the bastion's bases, not a place where fighting happens.
  fonti: ['dossier 03 §A2 (Polmar & Moore 2004)']

base.murmansk:
  it: >-
    Il grande porto in fondo alla baia di Kola, sede delle flottiglie da pesca e dei rompighiaccio. Grazie alla Corrente
    di Capo Nord e a quella costiera del Murman non gela mai, come tutta la costa di Kola. D'inverno c'è la notte polare, circa dal 2 dicembre all'11 gennaio; d'estate il sole di mezzanotte e
    frequenti nebbie.
  en: >-
    The large port at the head of the Kola Gulf, home of the fishing flotillas and the icebreakers. Thanks to the North
    Cape Current and the Murman coastal current it never freezes, like the whole Kola coast. In winter there is the polar night, roughly 2 December to 11 January; in summer the midnight sun and frequent
    fog.
  uso_it: >-
    Pescherecci e rompighiaccio riempiono il sonar di contatti che non sono navi da guerra.
  uso_en: >-
    Trawlers and icebreakers fill the sonar with contacts that are not warships.
  fonti: ['dossier 03 §A2', 'dossier 09 (rumore per teatro)', 'dossier 21 §3']

base.gibilterra:
  it: >-
    La rocca britannica sul lato nord dello stretto ospitava il comando NATO GIBMED, che sorvegliava il passaggio fra
    Atlantico e Mediterraneo. Lo stretto è uno dei tratti di mare più trafficati del mondo, con circa 300 transiti al
    giorno e i traghetti per Tangeri.
  en: >-
    The British rock on the north side of the strait hosted the NATO GIBMED command, which watched the passage between
    the Atlantic and the Mediterranean. The strait is one of the busiest stretches of sea in the world, with about 300
    transits a day and the ferries to Tangier.
  uso_it: >-
    Nello stretto il rumore dei mercantili è il tuo miglior nascondiglio, per te e per l'avversario.
  uso_en: >-
    In the strait merchant noise is your best hiding place, for you and for your opponent.
  fonti: ['dossier 03 §A3']

base.rota:
  it: >-
    Base navale americana nel Golfo di Cadice, a ovest dello stretto. Fino al 1979 vi stazionavano SSBN americani. Ospitava anche uno dei Fleet Weather Central che preparavano rotte e
    previsioni per le navi in mare.
  en: >-
    US naval base in the Gulf of Cadiz, west of the strait. Until 1979 it hosted US SSBNs. It also housed one of the Fleet Weather Centrals that prepared routes and forecasts for ships
    at sea.
  uso_it: >-
    Nelle missioni di Gibilterra è la base americana del teatro.
  uso_en: >-
    In the Gibraltar missions it is the theatre's US base.
  fonti: ['dossier 03 §A3', 'dossier 21 §5.2']

base.alboran:
  it: >-
    Presso l'isola di Alborán, appena a est della carta, la 5ª Eskadra sovietica del Mediterraneo teneva un ancoraggio.
    Non era una base a terra ma un punto di fonda. La notizia viene da una fonte
    amatoriale e va verificata.
  en: >-
    Near Alborán island, just east of the chart, the Soviet 5th Eskadra in the Mediterranean kept an anchorage. It was
    not a shore base but an anchoring spot. The report comes from an amateur source and
    needs checking.
  uso_it: >-
    Navi sovietiche alla fonda a est dello stretto sono plausibili, non un'invenzione del gioco.
  uso_en: >-
    Soviet ships at anchor east of the strait are plausible, not a game invention.
  fonti: ['dossier 03 §A3 (fonte amatoriale; FAS, 5ª Eskadra)']

base.taranto:
  it: >-
    Base della Marina Militare italiana, sul bordo occidentale della carta del Canale d'Otranto. Con Brindisi
    chiude il lato occidentale dell'imboccatura dell'Adriatico.
  en: >-
    Italian Navy base, on the western edge of the Strait of Otranto chart. Together with Brindisi it closes the
    western side of the Adriatic entrance.
  uso_it: >-
    Navi italiane della NATO possono comparire nel canale anche in una missione americana.
  uso_en: >-
    Italian NATO ships may show up in the channel even in a US mission.
  fonti: ['dossier 03 §A4']

base.brindisi:
  it: >-
    Base della Marina Militare italiana sulla costa pugliese. Dal suo porto e da Bari partivano i traghetti per la
    Grecia, che negli anni '80 davano al canale un traffico medio-alto, mentre l'Albania restava chiusa.
  en: >-
    Italian Navy base on the Apulian coast. Ferries to Greece sailed from its port and from Bari, giving the channel
    medium-high traffic in the 1980s, while Albania stayed closed.
  uso_it: >-
    Il traffico dei traghetti corre lungo il lato italiano: il lato albanese è più silenzioso.
  uso_en: >-
    Ferry traffic runs along the Italian side: the Albanian side is quieter.
  fonti: ['dossier 03 §A4']

base.tivat:
  it: >-
    Base della marina jugoslava nelle Bocche di Cattaro: la Jugoslavia era un paese non allineato. Nella missione 6
    «Goulash» il 688 scorta sei mercantili fin qui; il manuale scrive «Trivat». Il blocco sovietico della missione è
    finzione del 1989.
  en: >-
    Yugoslav navy base in the Bay of Kotor: Yugoslavia was a non-aligned country. In mission 6 «Goulash» the 688
    escorts six merchantmen here; the manual spells it «Trivat». The mission's Soviet blockade is 1989 fiction.
  uso_it: >-
    È la meta del convoglio: la missione si vince portandoci i mercantili.
  uso_en: >-
    It is the convoy's destination: the mission is won by bringing the merchantmen here.
  fonti: ['dossier 03 §0, §A4']

base.pasha_liman:
  it: >-
    Base nella baia di Valona, dietro l'isola di Saseno. Dal 1958 al 1961 ospitò sottomarini sovietici Whiskey. Quando Mosca e Tirana ruppero, l'Albania si tenne quattro battelli.
  en: >-
    Base in the Bay of Vlorë, behind Sazan island. From 1958 to 1961 it hosted Soviet Whiskey submarines. When Moscow and Tirana split, Albania kept four boats.
  uso_it: >-
    Nel 1989 l'Albania è chiusa e fuori dai blocchi: il suo lato del canale non aiuta nessuno.
  uso_en: >-
    In 1989 Albania is closed and outside both blocs: its side of the channel helps nobody.
  fonti: ['dossier 03 §A4']

base.vladivostok:
  it: >-
    Il grande porto sovietico sul Mar del Giappone, lontano dalla carta delle Curili. Nella missione 7 «Cat Walk» l'SSBN
    al centro della partita è partito da qui. Il manuale sbaglia la geografia: gli stretti di Kunashir non collegano il
    Mar del Giappone al Pacifico ma il Mare di Okhotsk.
  en: >-
    The great Soviet port on the Sea of Japan, far from the Kurils chart. In mission 7 «Cat Walk» the SSBN at the
    centre of play has sailed from here. The manual gets the geography wrong: the Kunashir straits do not link the Sea
    of Japan to the Pacific but the Sea of Okhotsk.
  uso_it: >-
    Spiega da dove viene l'SSBN della missione 7, non dove si combatte.
  uso_en: >-
    It explains where the mission 7 SSBN comes from, not where the fight takes place.
  fonti: ['dossier 03 §0 (manuale, cap. 3; errori, punto 1)']

base.rybachiy:
  it: >-
    Base sottomarini in Kamčatka. Da qui e dalla Primorye uscivano i Delta della Flotta del
    Pacifico che pattugliavano il Mare di Okhotsk, il bastione degli SSBN in Estremo Oriente.
  en: >-
    Submarine base in Kamchatka. From here and from Primorye the Pacific Fleet Deltas sailed to patrol the
    Sea of Okhotsk, the SSBN bastion of the Far East.
  uso_it: >-
    Gli stretti di Kunashir sono una delle porte di quel bastione: chi li passa è sorvegliato.
  uso_en: >-
    The Kunashir straits are one of the doors to that bastion: whoever passes them is watched.
  fonti: ['dossier 03 §A5 (CIA 2017)']

base.ile_longue:
  it: >-
    Base degli SSBN francesi nella rada di Brest. I sottomarini sovietici ne sorvegliavano le uscite verso l'Atlantico,
    dentro o vicino alla carta della piattaforma celtica.
  en: >-
    Base of the French SSBNs in the Brest roadstead. Soviet submarines watched their sorties into the Atlantic, in or
    near the Celtic shelf chart.
  uso_it: >-
    Un SSN sovietico in questo teatro può essere lì per pedinare un battello francese, non per te.
  uso_en: >-
    A Soviet SSN in this theatre may be there to trail a French boat, not you.
  fonti: ['dossier 03 §A6']

base.brawdy:
  it: >-
    Stazione NAVFAC del SOSUS nel Galles, attiva circa dal 1974 al 1995. Era il punto d'ascolto per gli approcci
    occidentali, dove passavano i convogli REFORGER fra America ed Europa.
  en: >-
    SOSUS NAVFAC station in Wales, active roughly from 1974 to 1995. It was the listening post for the Western
    Approaches, where the REFORGER convoys passed between America and Europe.
  uso_it: >-
    Un Alfa che punta un convoglio qui rischia di essere scoperto da terra prima ancora del contatto.
  uso_en: >-
    An Alfa going for a convoy here risks being detected from shore before it even makes contact.
  fonti: ['dossier 03 §A6 (globalsecurity)']

base.st_mawgan:
  it: >-
    Base della RAF da cui i Nimrod pattugliavano gli approcci occidentali. Con Kinloss copriva le rotte
    dei rinforzi americani verso l'Europa.
  en: >-
    RAF base from which Nimrods patrolled the Western Approaches. Together with Kinloss it covered the
    routes of US reinforcements to Europe.
  uso_it: >-
    Sulla piattaforma celtica l'Alfa deve aspettarsi aerei britannici sopra i convogli.
  uso_en: >-
    On the Celtic shelf the Alfa should expect British aircraft over the convoys.
  fonti: ['dossier 03 §A6']

base.lann_bihoue:
  it: >-
    Base aeronavale francese, sede dei pattugliatori Atlantic. Sul margine della piattaforma celtica i suoi aerei
    affiancavano i Nimrod britannici.
  en: >-
    French naval air base, home of the Atlantic patrol aircraft. Over the edge of the Celtic shelf its aircraft
    worked alongside the British Nimrods.
  uso_it: >-
    Nella missione del convoglio diretto in Francia gli aerei amici possono essere francesi.
  uso_en: >-
    In the mission with the convoy bound for France, friendly aircraft may be French.
  fonti: ['dossier 03 §0, §A6']

base.baltijsk:
  it: >-
    Base principale della Flotta del Baltico sovietica. Sta a est della carta del teatro, lontano dagli stretti
    danesi.
  en: >-
    Main base of the Soviet Baltic Fleet. It lies east of the theatre chart, far from the Danish straits.
  uso_it: >-
    Nel Baltico le basi del Patto di Varsavia sono a est e a sud: la via d'uscita del 688 è verso ovest.
  uso_en: >-
    In the Baltic the Warsaw Pact bases lie east and south: the 688's way out is westwards.
  fonti: ['dossier 03 §A7']

base.peenemunde:
  it: >-
    Base della Volksmarine, la marina della Repubblica Democratica Tedesca. Insieme a Warnemünde
    e Sassnitz schierava la RDT sulla costa più vicina agli stretti danesi.
  en: >-
    Base of the Volksmarine, the East German navy. Together with Warnemünde and Sassnitz it
    placed the GDR on the coast closest to the Danish straits.
  uso_it: >-
    Lungo la costa della RDT ogni porto può mandare unità di superficie contro di te.
  uso_en: >-
    Along the GDR coast every port can send surface units after you.
  fonti: ['dossier 03 §A7']

base.warnemunde:
  it: >-
    Base della Volksmarine a Rostock. Davanti al porto incrociano i traghetti veloci per
    Gedser, su rotte e orari fissi.
  en: >-
    Volksmarine base at Rostock. The fast ferries to Gedser cross in front of the port, on
    fixed routes and timetables.
  uso_it: >-
    I traghetti hanno rotte fisse: impara a riconoscerli per non sprecare tempo sui falsi contatti.
  uso_en: >-
    The ferries keep fixed routes: learn to recognise them so you do not waste time on false contacts.
  fonti: ['dossier 03 §A7', 'dossier 09 (sorgenti di rumore)']

base.sassnitz:
  it: >-
    Base della Volksmarine a Rügen, e capolinea dei traghetti per Trelleborg in Svezia. Sta sulla costa della RDT, al
    largo della quale il 688 lancia i Tomahawk nella missione 10.
  en: >-
    Volksmarine base on Rügen, and terminal of the ferries to Trelleborg in Sweden. It lies on the GDR coast, off which
    the 688 fires its Tomahawks in mission 10.
  uso_it: >-
    Nell'acqua bassa di Arkona il rumore dei traghetti è uno dei pochi ripari.
  uso_en: >-
    In the shallow Arkona water ferry noise is one of the few covers.
  fonti: ['dossier 03 §0, §A7']

base.gdynia:
  it: >-
    Base della marina polacca, terza marina del Patto di Varsavia nel Baltico dopo quella sovietica
    e la Volksmarine. Sta fuori dalla carta del teatro, a est.
  en: >-
    Polish navy base, the third Warsaw Pact navy in the Baltic after the Soviet one and the
    Volksmarine. It lies off the theatre chart, to the east.
  uso_it: >-
    Per il 688 anche le navi polacche sono del Patto di Varsavia, come quelle sovietiche e della RDT.
  uso_en: >-
    For the 688 Polish ships too belong to the Warsaw Pact, like the Soviet and East German ones.
  fonti: ['dossier 03 §A7']

base.kiel:
  it: >-
    Base della marina della Germania Occidentale, sotto il comando NATO BALTAP insieme alla marina danese. In caso di
    guerra la NATO contava di minare gli stretti danesi, dove la soglia di Drogden ha solo 7-9 metri d'acqua.
  en: >-
    West German navy base, under the NATO BALTAP command together with the Danish navy. In wartime NATO planned to mine
    the Danish straits, where the Drogden sill has only 7-9 metres of water.
  uso_it: >-
    La salvezza del 688 nel Baltico è verso ovest, ma gli stretti si passano solo in superficie o quasi.
  uso_en: >-
    The 688's safety in the Baltic lies west, but the straits can only be passed surfaced or nearly so.
  fonti: ['dossier 03 §0 (errori, punto 2), §A7']

base.eckernforde:
  it: >-
    Base degli U-Boot della Germania Occidentale, i Type 205 e 206. Erano i sottomarini NATO del
    Baltico, perché gli SSN americani di fatto lì non operavano.
  en: >-
    Base of the West German U-boats, the Type 205 and 206. They were NATO's Baltic submarines,
    since US SSNs did not in practice operate there.
  uso_it: >-
    Un contatto diesel amico nel Baltico è più probabile di un altro SSN americano.
  uso_en: >-
    A friendly diesel contact in the Baltic is more likely than another US SSN.
  fonti: ['dossier 03 §A7']

# ============================== SISTEMI DI BORDO ==============================

sistema.calcolatore_sonar:
  it: >-
    È la parte che trasforma i segnali degli idrofoni in cascate e tracce. Sul 688 del 1989 era il calcolatore UYK-7 del
    BQQ-5, con tre o quattro consolle a schermi monocromatici; i colori arrivarono solo con il 688I. Sull'Alfa lo stesso
    lavoro lo faceva il complesso automatizzato Okean, senza nemmeno un registratore per fissare i bersagli.
  en: >-
    It is the part that turns the hydrophone signals into waterfalls and traces. On the 1989 688 it was the BQQ-5's
    UYK-7 computer, with three or four monochrome consoles; colour came only with the 688I. On the Alfa the same work
    was done by the automated Okean suite, without even a recorder to log targets.
  uso_it: >-
    Sotto il 30% di efficienza il sonar si spegne, anche se la sfera è intatta. Sta nel compartimento prodiero: se
    devi combattere, sposta la sua riparazione in cima alla lista, altrimenti la squadra lo affronta dopo moto e
    governo.
  uso_en: >-
    Below 30% efficiency the sonar goes dead, even with the sphere intact. It sits in the forward compartment: if you
    must fight, move its repair to the top of the list, otherwise the crew reaches it after propulsion and steering.
  fonti: ['dossier 19 §2.3 [FI-BQQ5], §3.3 [TTX] [BOG]', 'docs/10_danni_affondamento_esplosioni.md §10.3, §10.7']

sistema.schiera:
  it: >-
    La schiera rimorchiata TB-16 è un tubo di idrofoni lungo circa 73 metri, trainato a circa 730 metri dietro il 688
    per ascoltare lontano dal rumore del battello. Era un sottosistema passivo del BQQ-5, montato su tutti i 688; la
    più sottile TB-23 arrivò solo a fine anni '80. L'Alfa non ne aveva: la schiera che gli dava il gioco originale era
    un errore.
  en: >-
    The TB-16 towed array is a hydrophone tube about 73 metres long, towed some 730 metres behind the 688 to listen far
    from the boat's own noise. It was a passive subsystem of the BQQ-5, fitted to every 688; the thinner TB-23 came only
    in the late 1980s. The Alfa had none: the array the original game gave it was a mistake.
  uso_it: >-
    Il danno conta solo quando è totale: finché resta qualcosa la schiera funziona, a zero è persa. È il sistema più a
    poppa, quindi soffre gli incendi e le esplosioni in sala macchine.
  uso_en: >-
    Damage only matters when total: as long as something remains the array works, at zero it is lost. It is the
    aftmost system, so it suffers from fires and explosions in the engine room.
  fonti: ['dossier 04 [FAS-TB16] [WP-Alfa] [Legion-705]', 'dossier 01 §2.1', 'docs/10_danni_affondamento_esplosioni.md §10.7, §10.13']

sistema.periscopio:
  it: >-
    Il 688 ne ha due sulla pedana della centrale: il Type 2 d'attacco, sottile e solo diurno, e il Type 18 di ricerca,
    stabilizzato, con luce bassa, telecamera e un'antenna ESM, che riceve anche la radio. L'Alfa aveva un solo
    periscopio universale, il «Signal», più una telecamera nella vela. Ci guardavano solo comandante, secondo e
    ufficiale di guardia; se si guastava restava il solo sonar.
  en: >-
    The 688 has two on the control room platform: the slim, day-only Type 2 attack periscope and the stabilised Type 18
    search periscope, with low light, a camera and an ESM antenna, which also receives radio. The Alfa had a single
    universal periscope, the «Signal», plus a camera in the sail. Only the captain, the executive officer and the
    officer of the watch looked through it; if it failed, only the sonar was left.
  uso_it: >-
    Sotto il 50% il periscopio non si alza più. Alzarlo a velocità troppo alta lo danneggia: rallenta prima di salire
    a quota periscopica.
  uso_en: >-
    Below 50% the periscope can no longer be raised. Raising it at too high a speed damages it: slow down before
    coming to periscope depth.
  fonti: ['dossier 19 §2.1 [NOVA-C] [SR-2002], §3.1, §3.2 [MET] [KOL]', 'dossier 08 §3.3 [SCMP]', 'docs/10_danni_affondamento_esplosioni.md §10.7', 'engine/missioni/src/missione_periscopi.cpp (periscopio piegato dalla velocità)']

sistema.sonar_tiro:
  it: >-
    Nel gioco del 1989 il «targeting sonar» era uno dei sei sistemi che un colpo poteva guastare. I dossier non gli
    assegnano un apparato preciso: i sonar attivi più vicini sono il BQS-15 del 688, ad alta frequenza e a corto raggio
    per ostacoli, ghiaccio e mine, e i modi attivi dell'Okean dell'Alfa con la stazione antimine «Luch».
  en: >-
    In the 1989 game the «targeting sonar» was one of the six systems a hit could break. The dossiers assign it no exact
    set: the nearest active sonars are the 688's BQS-15, high-frequency and short-range for obstacles, ice and mines,
    and the active modes of the Alfa's Okean with the «Luch» mine-avoidance set.
  uso_it: >-
    Come nell'originale, il guasto viene segnalato nella stazione Stato senza togliere altre funzioni. Sta a prua e la
    squadra lo ripara dopo moto, governo e sonar principale.
  uso_en: >-
    As in the original, the failure is reported on the Status station without removing other functions. It sits
    forward and the crew repairs it after propulsion, steering and the main sonar.
  fonti: ['dossier 01 §2.1 [FAS688]', 'dossier 19 §3.3 [TTX] [BAR]', 'docs/10_danni_affondamento_esplosioni.md §10.1, §10.7']

sistema.motori:
  it: >-
    Sul 688 due turbine muovono un solo asse con 30.000-35.000 cavalli, e c'è anche un motore ausiliario retrattile
    da 325 cavalli. Il battello supera i 30 nodi, ma è silenzioso solo fino a circa 5-8.
    L'Alfa ha una sola turbina da circa 40.000 cavalli e tocca i 41 nodi, ma ad alta velocità è molto rumoroso.
  en: >-
    On the 688 two turbines drive a single shaft with 30,000-35,000 shp, and there is also a 325 hp retractable
    auxiliary motor. The boat exceeds 30 knots but is quiet only up to about 5-8. The Alfa has a
    single turbine of about 40,000 shp and reaches 41 knots, but is very noisy at speed.
  uso_it: >-
    La velocità massima scende con l'efficienza: con i motori al 75% hai 3/4 della velocità di prima, e il telegrafo
    rifiuta gli ordini oltre il limite. I motori sono fra i primi nella lista delle riparazioni.
  uso_en: >-
    Top speed drops with efficiency: with the engines at 75% you get 3/4 of the previous speed, and the telegraph
    refuses orders beyond the limit. The engines are near the top of the repair list.
  fonti: ['dossier 01 §2.1 [FAS688] [WP688], §2.4 [DS705] [WPAlfa] [GS705]', 'docs/10_danni_affondamento_esplosioni.md §10.3, §10.8']

sistema.antenna:
  it: >-
    Il 688 ha due alberi multifunzione BRA-34 per HF e UHF in due sensi e per la ricezione VLF e LF; a bordo ci sono il
    satellitare WSC-3, gli apparati HF e la telescrivente. Per trasmettere deve salire a quota periscopica, circa 18
    metri di chiglia, con l'albero alzato. L'Alfa concentrava radio e intercettazione su un solo pulto del posto
    centrale.
  en: >-
    The 688 has two BRA-34 multifunction masts for two-way HF and UHF and VLF and LF reception; aboard are the WSC-3
    satcom, the HF sets and the teleprinter. To transmit it must come to periscope depth, about 18 metres keel depth,
    with the mast raised. The Alfa put radio and intercept on a single console in the central post.
  uso_it: >-
    Sotto il 50% l'antenna non si alza più: niente trasmissioni e niente ricezione dall'albero. Fa
    parte delle comunicazioni, ultime nell'ordine delle riparazioni: anticipala se aspetti un messaggio importante.
  uso_en: >-
    Below 50% the antenna can no longer be raised: no transmitting and no reception through the mast. It
    belongs to communications, last in the repair order: bring it forward if you are waiting for an important message.
  fonti: ['dossier 08 §3.3 [SCMP], §3.4 [FASBRT6]', 'dossier 19 §2.5 [FAS-SCMP], §3.2 [SOB]', 'docs/10_danni_affondamento_esplosioni.md §10.7', 'dossier 02 §9.2']

sistema.idroplani:
  it: >-
    I timoni orizzontali governano la quota. Il 688 Flight I li ha sulla vela e a poppa, senza timoni di prora, e per
    questo non può emergere rompendo il ghiaccio. Il pianista li muove con una colonna a cloche: avanti per scendere,
    indietro per salire. Sull'Alfa rotta e quota le teneva il sistema automatico «Boksit», con «Tan» per l'assetto.
  en: >-
    The diving planes control depth. The 688 Flight I has them on the sail and at the stern, with no bow planes, which
    is why it cannot surface through ice. The planesman moves them with an aircraft-type column: forward to dive, back
    to rise. On the Alfa course and depth were held by the automatic «Boksit» system, with «Tan» for trim.
  uso_it: >-
    Sotto il 30% i piani si bloccano all'angolo che avevano: se erano in discesa, il battello continua a scendere.
    Contro un allagamento i piani valgono più della zavorra: avanti tutta e barra in salita prima di esaurire.
  uso_en: >-
    Below 30% the planes jam at their last angle: if they were set to dive, the boat keeps going down. Against flooding
    the planes are worth more than ballast: ahead full and rise on the planes before blowing.
  fonti: ['dossier 19 §2.2 [NSTM-561], §3.1 [SOB] [PRJ]', 'dossier 01 §2.1 [WP688]', 'dossier 02 §9.2', 'docs/10_danni_affondamento_esplosioni.md §10.3, §10.7']

sistema.timone:
  it: >-
    Il timone verticale governa la rotta. Sul 688 il timoniere usa un volante: 3,5 gradi di volante per un grado di
    timone, con un quadrante che si legge ogni 5 gradi e una barra d'emergenza. Sull'Alfa
    rotta e quota si tenevano per lo più dal pulto del moto «Boksit», anche in automatico.
  en: >-
    The rudder controls course. On the 688 the helmsman uses a wheel: 3.5 degrees of wheel per degree of rudder, with a
    dial read every 5 degrees and an emergency bar. On the Alfa course and depth were
    mostly held from the «Boksit» motion console, automatic mode included.
  uso_it: >-
    Sotto il 30% il timone resta bloccato e il battello gira sempre dalla stessa parte o va dritto. Il governo viene
    subito dopo la propulsione nella lista delle riparazioni.
  uso_en: >-
    Below 30% the rudder jams and the boat keeps turning the same way or holds straight. Steering comes right after
    propulsion on the repair list.
  fonti: ['dossier 19 §2.2 [NSTM-561], §3.2 [FLOT]', 'dossier 02 §9.2', 'docs/10_danni_affondamento_esplosioni.md §10.7']

sistema.propulsione:
  it: >-
    È la catena che va dal reattore all'elica. Sul 688 il reattore S6G alimenta due turbine su un asse; sull'Alfa un
    reattore a piombo-bismuto alimenta una sola turbina. L'Alfa affidava reattore, rete elettrica e impianti al sistema
    automatico «Ritm», con centinaia di sensori sorvegliati dal posto centrale.
  en: >-
    It is the chain running from the reactor to the propeller. On the 688 the S6G reactor feeds two turbines on one
    shaft; on the Alfa a lead-bismuth reactor feeds a single turbine. The Alfa entrusted reactor, power grid and plant
    to the automatic «Ritm» system, with hundreds of sensors watched from the central post.
  uso_it: >-
    La velocità massima segue il peggiore fra motori e propulsione. È la prima cosa che l'equipaggio ripara, come vuole
    la dottrina: senza moto non si risale.
  uso_en: >-
    Top speed follows the worse of engines and propulsion. It is the first thing the crew repairs, as doctrine
    requires: without way on, the boat cannot climb.
  fonti: ['dossier 01 §2.1 [FAS688], §2.4 [DS705]', 'dossier 19 §3.1 [SOB]', 'dossier 02 §9.2', 'docs/10_danni_affondamento_esplosioni.md §10.7']

sistema.aria:
  it: >-
    Le bombole d'aria ad alta pressione servono a svuotare le casse e a riportare il battello in superficie. Sul 688
    l'esaurimento d'emergenza si comanda da un interruttore del Ballast Control Panel, che usa solo il capo della
    guardia; l'Alfa aveva invece una stazione a pulsanti. In profondità l'aria rende poco, perché la pressione la
    comprime: a 300 metri svuota circa un trentesimo di quanto svuoterebbe in superficie. Nel Thresher, nel 1963, il
    ghiaccio nelle valvole ridusse anche quel poco.
  en: >-
    The high-pressure air bottles empty the tanks and bring the boat back to the surface. On the 688 the emergency blow
    is a switch on the Ballast Control Panel used only by the Chief of the Watch; the Alfa had a push-button station
    instead. At depth air yields little, because pressure compresses it: at 300 metres it empties about a thirtieth of
    what it would at the surface. On Thresher, in 1963, ice in the valves cut even that.
  uso_it: >-
    L'aria serve all'esaurimento d'emergenza (Ctrl+E): prima riduci la quota con i piani, poi esaurisci, perché più sali
    più l'aria rende. In un incendio una tubolatura dell'aria rotta alimenta le fiamme e consuma le bombole.
  uso_en: >-
    Air feeds the emergency blow (Ctrl+E): first cut depth with the planes, then blow, because the higher you are the
    more the air yields. In a fire a broken air line feeds the flames and drains the bottles.
  fonti: ['dossier 19 §2.2 [SI-637], §3.2 [SUT]', 'dossier 02 §9.1 [USNI21] [USNI23], §9.2', 'docs/10_danni_affondamento_esplosioni.md §10.3, §10.6, §10.13']

sistema.pompe:
  it: >-
    Le pompe di sentina e d'assetto tolgono l'acqua imbarcata e spostano peso fra le casse di compenso per tenere il
    battello in assetto. Sul 688 le comanda il capo della guardia dal Ballast Control Panel. In profondità rendono
    pochissimo: al Thresher, alla quota di collaudo, non poterono quasi nulla, e la dottrina le mette all'ultimo posto
    nella risposta a un allagamento.
  en: >-
    The drain and trim pumps remove flooding water and shift weight between the trim tanks to keep the boat level. On
    the 688 the Chief of the Watch runs them from the Ballast Control Panel. At depth they achieve very little: on
    Thresher, at test depth, they could do almost nothing, and doctrine puts them last in the flooding drill.
  uso_it: >-
    La portata cala con l'efficienza e con la quota, e a 200 metri si annulla: per pompare fuori l'acqua bisogna prima
    risalire. Servono anche per alleggerirsi dopo essersi posati sul fondo.
  uso_en: >-
    Capacity falls with efficiency and with depth, and reaches zero at 200 metres: to pump water out you must first
    climb. They are also needed to lighten the boat after settling on the bottom.
  fonti: ['dossier 02 §9.1 [USNI21], §9.2', 'dossier 19 §2.2 [NOVA-C]', 'docs/10_danni_affondamento_esplosioni.md §10.7, §10.10']

sistema.sonar_prua:
  it: >-
    Il sonar principale sta nella prua. Sul 688 è la sfera BQS-13 del BQQ-5, con oltre mille idrofoni, affiancata da
    una schiera conforme sullo scafo. Sull'Alfa era la stazione passiva «Enisej» del complesso Okean, potente sulla
    carta ma limitata dal rumore del battello: Victor III e Los Angeles scoprivano più lontano.
  en: >-
    The main sonar sits in the bow. On the 688 it is the BQQ-5's BQS-13 sphere, with over a thousand hydrophones,
    flanked by a conformal hull array. On the Alfa it was the «Yenisei» passive set of the Okean suite, powerful on
    paper but limited by the boat's own noise: the Victor III and the Los Angeles detected farther.
  uso_it: >-
    Sotto il 30% il sonar si spegne, come per il calcolatore. Un incendio a prua lo danneggia, quindi un colpo a prua
    può lasciarti cieco proprio mentre combatti.
  uso_en: >-
    Below 30% the sonar goes dead, as with the computer. A fire forward damages it, so a hit in the bow can leave you
    blind right in the middle of a fight.
  fonti: ['dossier 01 §2.1 [FAS688] [WP688]', 'dossier 19 §3.3 [TTX] [KOL]', 'docs/10_danni_affondamento_esplosioni.md §10.7, §10.13']

sistema.reattore:
  it: >-
    Il 688 ha un reattore S6G da circa 150-165 megawatt termici; l'Alfa un reattore a metallo liquido piombo-bismuto,
    l'OK-550 e poi il BM-40A. Un urto violento può farlo spegnere d'emergenza (SCRAM): il battello va avanti a batteria
    col motore d'emergenza, lentamente, finché il reattore non torna critico, in circa 5-20 minuti.
  en: >-
    The 688 has an S6G reactor of about 150-165 megawatts thermal; the Alfa a lead-bismuth liquid-metal reactor, the
    OK-550 and later the BM-40A. A violent shock can trip it (SCRAM): the boat runs slowly on battery with the emergency
    motor until the reactor is critical again, in about 5-20 minutes.
  uso_it: >-
    Non è un sistema da riparare ma uno stato: durante lo SCRAM hai al massimo il 15% della velocità, poi la potenza
    torna da sola. In quei minuti non puoi né fuggire né reggere un allagamento con i piani, quindi tieni la quota bassa.
  uso_en: >-
    It is not a system to repair but a state: during SCRAM you have at most 15% of top speed, then power returns by
    itself. In those minutes you can neither run nor hold flooding with the planes, so keep your depth shallow.
  fonti: ['dossier 01 §2.1 [FAS688], §2.4 [DS705] [WPAlfa]', 'dossier 02 §9.2, §9.4', 'docs/10_danni_affondamento_esplosioni.md §10.7']

sistema.direzione_tiro:
  it: >-
    Sul 688 la direzione del tiro Mk 117, la prima tutta digitale, arrivò col Dallas e sostituì il Mk 113 su molti
    battelli più vecchi negli anni '80. Gli operatori delle consolle Mk 81 giravano manopole per costruire la soluzione
    di tiro e preparare le armi; il pulsante rosso stava sul Weapons Control Panel. Sull'Alfa «Akkord» calcolava il
    moto di tre bersagli e «Sargan» comandava i tubi, ma i dati passavano solo per via elettrica.
  en: >-
    On the 688 the Mk 117 fire control, the first all-digital one, came with Dallas and replaced the Mk 113 on many
    older boats in the 1980s. The Mk 81 console operators turned knobs to build the firing solution and preset the
    weapons; the red button sat on the Weapons Control Panel. On the Alfa «Akkord» computed the motion of three targets
    and «Sargan» ran the tubes, but data passed only electrically.
  uso_it: >-
    Non è fra i sistemi danneggiabili del modello. Nel progetto della stazione Armi dell'Alfa un guasto di Akkord
    blocca tutte le armi, come avveniva davvero: senza Akkord non si lancia nulla.
  uso_en: >-
    It is not among the damage model's systems. In the design of the Alfa's Weapons station an Akkord failure locks
    out every weapon, as it really did: without Akkord nothing can be fired.
  fonti: ['dossier 19 §2.1 [NOVA-C], §2.4 [SR-1993] [WIKI-688] [SR-1984], §3.1, §3.4 [SOB] [KOL] [BAR], §6.5', 'dossier 01 §2.1']

sistema.filo_galleggiante:
  it: >-
    L'antenna a filo galleggiante OE-315 permette al 688 di ricevere VLF e LF restando in profondità. Il cavo, lungo
    oltre 300 metri, porta l'antenna in superficie, da cui sporge al massimo pochi centimetri. Solo ricezione e niente
    UHF, e soprattutto il battello deve andare piano e dritto. Sulle antenne dell'Alfa non c'è nessuna fonte aperta.
  en: >-
    The OE-315 floating wire antenna lets the 688 receive VLF and LF while staying deep. The cable, over 300 metres
    long, carries the antenna to the surface, where it shows at most a few centimetres. Receive only and no UHF, and
    above all the boat must go slowly and straight. There is no open source on the Alfa's antennas.
  uso_it: >-
    Si riceve fino a circa 120 metri di chiglia e 8 nodi; fra 8 e 12 nodi metà dei messaggi si perde, e una virata
    larga lascia il filo senza segnale per un paio di minuti. Sopra i 20 nodi il filo può rompersi e resta perso fino
    a fine missione.
  uso_en: >-
    Reception works down to about 120 metres keel depth and 8 knots; between 8 and 12 knots half the messages are lost,
    and a wide turn leaves the wire without signal for a couple of minutes. Above 20 knots the wire can break and stays
    lost until the end of the mission.
  fonti: ['dossier 08 §3.3 [SCMP], §3.4 [APL99] [NSL99] [ALT], §6.3, §9.1', 'dossier 10 radio §1.1']

sistema.boa_radio:
  it: >-
    Una boa a perdere permette di trasmettere senza alzare un'antenna. La SLOT registra un messaggio fino a 5 minuti,
    sale in superficie e lo trasmette in VHF agli aerei vicini dopo un ritardo; nel 1982 costava poche centinaia di
    dollari. La boa satellitare BRT-6 arrivò sui 688 dopo alcuni 637, e per il 1989 non è verificata. Il 688 Flight I non
    aveva boe rimorchiate.
  en: >-
    An expendable buoy lets the boat transmit without raising an antenna. The SLOT records a message of up to 5
    minutes, rises to the surface and sends it on VHF to nearby aircraft after a delay; in 1982 it cost a few hundred
    dollars. The BRT-6 satellite buoy reached the 688s after a few 637s and is unverified for 1989. The 688 Flight I had no
    towed buoy.
  uso_it: >-
    La boa chiede aiuto senza esporre il battello: il messaggio parte quando sei già lontano, ma va solo a un aereo
    amico in portata e non porta risposte. Se un ESM nemico è vicino, è meglio dell'albero.
  uso_en: >-
    The buoy calls for help without exposing the boat: the message goes out when you are already away, but only to a
    friendly aircraft in range, and brings no reply. With an enemy ESM nearby it beats the mast.
  fonti: ['dossier 08 §3.3 [FASBRT6] [SCMP] [TWZBRR6], §4.1', 'dossier 10 radio §1.5 [NSL4604] [WPSLOT], §4.4']

sistema.centrale:
  it: >-
    La centrale del 688 sta nel ponte superiore del compartimento prodiero e fa anche da centro d'attacco: al centro la
    pedana dei periscopi, a sinistra il governo con quattro uomini, a destra la fila delle consolle di tiro. Di notte
    la sala si oscura o passa alla luce rossa. L'Alfa aveva invece un posto centrale a ferro di cavallo nel
    compartimento rifugio, senza sale separate per radio, sonar o carteggio, con 8 uomini di guardia.
  en: >-
    The 688's control room sits on the upper deck of the forward compartment and doubles as the attack centre: the
    periscope platform in the middle, ship control with four men to port, the fire control consoles to starboard. At
    night the room goes dark or switches to red light. The Alfa instead had a horseshoe-shaped central post in the
    refuge compartment, with no separate radio, sonar or chart rooms, and 8 men on watch.
  uso_it: >-
    Non è un sistema danneggiabile, ma ci stanno periscopio, antenna, timone e idroplani: un allagamento o un incendio
    nel compartimento li minaccia tutti insieme, e un colpo al centro può toglierti vista e governo.
  uso_en: >-
    It is not a damageable system, but periscope, antenna, rudder and planes are housed there: flooding or fire in the
    compartment threatens them all at once, and a hit amidships can take away both sight and control.
  fonti: ['dossier 19 §2.1 [FAS-688] [NOVA-C] [NOVA-S], §2.2, §3.1, §3.2 [SOB] [PRJ] [BOG]', 'dossier 02 §9.3', 'docs/10_danni_affondamento_esplosioni.md §10.13']

base.wakkanai:
  it: >-
    Sulla punta settentrionale dell'Hokkaido il Giappone teneva un radar che sorvegliava lo stretto di Sōya, uno dei
    passaggi fra l'Okhotsk e il Mar del Giappone. Insieme ai pattugliatori P-3 di Hachinohe e Misawa completava la
    guardia alleata a sud del bastione sovietico.
  en: >-
    On the northern tip of Hokkaido Japan kept a radar watching the Sōya Strait, one of the passages between the
    Okhotsk and the Sea of Japan. Together with the P-3 patrol aircraft from Hachinohe and Misawa it completed the
    allied watch south of the Soviet bastion.
  uso_it: >-
    Nel teatro di Kunashir il sud è sorvegliato dagli alleati: un battello sovietico che esce verso il Giappone va
    tenuto d'occhio.
  uso_en: >-
    In the Kunashir theatre the south is watched by the allies: a Soviet boat heading out towards Japan should be
    tracked.
  fonti: ['dossier 03 §A5']

base.hachinohe:
  it: >-
    Base aerea nel nord dello Honshu da cui decollavano i pattugliatori marittimi P-3 giapponesi. Con quelli di Misawa
    sorvegliavano lo stretto di Sōya, l'uscita dell'Okhotsk verso il Mar del Giappone.
  en: >-
    Air base in northern Honshu from which Japanese P-3 maritime patrol aircraft took off. With those from Misawa
    they watched the Sōya Strait, the Okhotsk's exit towards the Sea of Japan.
  uso_it: >-
    Gli aerei di pattuglia alleati arrivano da sud: nel teatro di Kunashir il cielo non è solo sovietico.
  uso_en: >-
    Allied patrol aircraft come from the south: in the Kunashir theatre the sky is not only Soviet.
  fonti: ['dossier 03 §A5']

base.misawa:
  it: >-
    Base aerea nel nord dello Honshu, l'altra sede dei P-3 che sorvegliavano lo stretto di Sōya. Insieme al radar di
    Wakkanai e agli aerei di Hachinohe teneva d'occhio i passaggi dell'Okhotsk verso sud.
  en: >-
    Air base in northern Honshu, the other home of the P-3s watching the Sōya Strait. Together with the Wakkanai
    radar and the Hachinohe aircraft it kept an eye on the Okhotsk's southern passages.
  uso_it: >-
    Come Hachinohe: gli aerei di pattuglia alleati arrivano da sud.
  uso_en: >-
    Like Hachinohe: allied patrol aircraft come from the south.
  fonti: ['dossier 03 §A5']
