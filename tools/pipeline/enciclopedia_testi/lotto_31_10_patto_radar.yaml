esm.dr2000:
  it: >-
    Il DR-2000U è il ricevitore ESM della Thomson-CSF dei sottomarini Type 206A della Bundesmarine, montato insieme al
    SARIE. Le sue prestazioni non sono pubbliche: il gioco le stima a metà fra il WLR-8 americano e il Bukhta
    sovietico. Copre da 2 a 18 GHz, con una probabilità d'intercetto di 0,8 per passaggio e un errore di rilevamento di
    circa 6 gradi in banda I/J e 10 in E-H; l'antenna sta a 1,5 metri sull'acqua. Nel gioco lo usano tutti i Type 206.
  en: >-
    The DR-2000U is the Thomson-CSF ESM receiver of the Bundesmarine's Type 206A submarines, fitted together with the
    SARIE. Its performance is not public: the game estimates it halfway between the American WLR-8 and the Soviet
    Bukhta. It covers 2 to 18 GHz, with an intercept probability of 0.8 per pass and a bearing error of about 6 degrees
    in I/J band and 10 in E-H; the antenna is 1.5 metres above the water. In the game every Type 206 uses it.
  uso_it: >-
    È l'ESM di un battello dell'IA: lavora solo quando il 206 ha la testa o l'albero fuori, e sui radar ostili gli dà
    un contatto col solo rilevamento. Se giochi l'Alfa e il 206 è dall'altra parte, sente il tuo Snoop più lontano di
    quanto il tuo radar veda lui: accendilo poco. Come il Bukhta è sordo sotto i 2 GHz, quindi non sente i radar di
    ricerca aerea in banda B, C e D.
  uso_en: >-
    It is the ESM of an AI boat: it works only when the 206 has its head or mast up, and on hostile radars it gives a
    bearing-only contact. If you play the Alfa and the 206 is on the other side, it hears your Snoop farther away than
    your radar can see it: use it sparingly. Like the Bukhta it is deaf below 2 GHz, so it does not hear the B, C and
    D-band air search radars.
  fonti: ['dossier 32 §5', 'dossier 11 §4.2, §4.3 e §6.3',
    'tools/pipeline/emettitori.py (Type 206A: DR-2000U col SARIE, Seaforces e Los Barcos de Eugenio; prestazioni STIMA)',
    'emettitori.toml (esm.dr2000, esm_di)', 'engine/missioni/src/missione.cpp (ESM dell''IA)']
