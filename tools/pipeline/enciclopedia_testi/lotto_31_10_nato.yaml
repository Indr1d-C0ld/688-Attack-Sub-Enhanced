nave.type22b2:
  it: >-
    La Batch 2 della Type 22, quella della Boxer, allunga lo scafo a 146,5 metri e 4.800 tonnellate per far posto
    alla schiera rimorchiata passiva Type 2031Z, lunga circa 500 metri e fatta per le frequenze molto basse. La prua
    diventa più alta e slanciata, ma armi, sonar di scafo Type 2016 e radar restano quelli della Batch 1: Exocet, due
    Sea Wolf, due Lynx e nessun cannone. Nel 1989 ne sono in servizio sei, Boxer, Beaver, Brave, London, Sheffield e
    Coventry; la Brave ha le turbine Spey. La schiera non rese mai quanto si sperava, perché i generatori diesel non
    poggiavano su un basamento elastico e il loro rumore passava in acqua: lo racconta un comandante della London.
  en: >-
    Batch 2 of the Type 22, that of Boxer, lengthens the hull to 146.5 metres and 4,800 tonnes to make room for the
    Type 2031Z passive towed array, about 500 metres long and built for very low frequencies. The bow becomes higher
    and more raked, but weapons, Type 2016 hull sonar and radars stay those of Batch 1: Exocets, two Sea Wolf, two
    Lynx and no gun. In 1989 six are in service, Boxer, Beaver, Brave, London, Sheffield and Coventry; Brave has Spey
    turbines. The array never performed as well as hoped, because the diesel generators were not on a resilient raft
    and their noise reached the water: a commanding officer of London tells the story.
  uso_it: >-
    Rispetto alla Batch 1 cambia l'orecchio: nel gioco traina la Type 2031Z, 500 metri di schiera su 1.500 di cavo,
    fino a 300 metri di quota, con l'analisi LOFAR fine a 0,05 Hz. Vi può sentire da lontano e sotto lo strato, ma
    solo sotto i 20 nodi, oltre i quali deve recuperarla; e per via dei diesel il suo rumore proprio è più alto di
    quello della SQR-19 americana. Gli stessi diesel tradiscono la nave anche a voi, con le righe a 22,5 e 45 Hz. Per
    il resto è come la Batch 1: niente cannone, nessun siluro modellato, e uno o due siluri pesanti per affondarla.
  uso_en: >-
    Compared with Batch 1 the ear changes: in the game it tows the Type 2031Z, 500 metres of array on 1,500 of cable,
    down to 300 metres, with fine LOFAR analysis at 0.05 Hz. It can hear you from afar and below the layer, but only
    under 20 knots, above which it must recover it; and because of the diesels its self-noise is higher than that of
    the American SQR-19. The same diesels give the ship away to you as well, with lines at 22.5 and 45 Hz. Otherwise
    it is like Batch 1: no gun, no modelled torpedo, and one or two heavyweight torpedoes to sink it.
  fonti: ['dossier 32 §4', 'dossier 04 §4 [Helis-2031] [Dowty-2031Z] [WP-T22]', 'dossier 33 §3',
    'extracted/navi/type22b2/RAPPORTO.md',
