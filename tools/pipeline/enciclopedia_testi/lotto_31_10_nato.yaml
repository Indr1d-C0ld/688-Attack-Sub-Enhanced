elicottero.hkp4:
  it: >-
    L'Hkp 4 è il Boeing Vertol 107-II dell'aviazione e della marina svedesi; la versione navale Hkp 4B vola dal 1973,
    poi arriva la 4C. Ha due rotori in tandem di 15,24 metri a tre pale e tocca i 137 nodi; opera da basi a terra e da
    cacciatorpediniere. Per la caccia ai sottomarini cala il sonar a immersione HS-73, a cui le fonti danno 5,6 km di
    portata, e ha un radar di prua. Porta due siluri leggeri Tp 42 da 400 mm, nella versione Tp 422 per gli
    elicotteri, che si sgancia senza paracadute, oppure fino a sei bombe di profondità Sjunkbomb 51, giudicate deboli.
    Le fonti aperte su questo elicottero sono poche e di bassa confidenza.
  en: >-
    The Hkp 4 is the Boeing Vertol 107-II of the Swedish air force and navy; the naval Hkp 4B flies from 1973, then
    comes the 4C. It has two tandem rotors of 15.24 metres with three blades and reaches 137 knots; it operates from
    shore bases and from destroyers. For submarine hunting it lowers the HS-73 dipping sonar, credited by the sources
    with a range of 5.6 km, and it has a nose radar. It carries two Tp 42 400 mm light torpedoes, in the Tp 422
    helicopter version, which is dropped without a parachute, or up to six Sjunkbomb 51 depth charges, judged weak.
    Open sources on this helicopter are few and of low confidence.
  uso_it: >-
    Nel gioco non posa boe: arriva sul punto, si ferma a 15 metri, cala l'HS-73 fino a 100 metri, ascolta da uno a due
    minuti e pinga a 10 kHz tre o quattro volte, uno ogni 8 secondi. Se non vi trova salta di circa 5,6 km, o di 3,7
    km quando vi insegue, e nel salto sentite i due rotori, una riga di circa 13 Hz. Il Tp 42 nel gioco aggancia a 500
    metri in attivo e a 800 in passivo, scende fino a 200 metri e funziona anche con soli 15 metri d'acqua: l'acqua
    bassa non vi salva. Vola anche di notte e fino a mare 5, e di solito ne arrivano due, uno coi siluri e uno con le
    bombe.
  uso_en: >-
    In the game it lays no sonobuoys: it reaches the spot, hovers at 15 metres, lowers the HS-73 to 100 metres,
    listens for one to two minutes and pings at 10 kHz three or four times, one every 8 seconds. If it does not find
    you it jumps about 5.6 km, or 3.7 km when tracking you, and during the jump you hear the two rotors, a line at
    about 13 Hz. In the game the Tp 42 acquires at 500 metres active and 800 passive, dives to 200 metres and works
    even in only 15 metres of water: shallow water does not save you. It also flies at night and up to sea state 5,
    and usually two come, one with torpedoes and one with depth charges.
  fonti: ['dossier 35 §1, §2, §3 e §5 [AEROSEUM-HKP4] [AVROSYS-HKP4]', 'extracted/navi/hkp4/RAPPORTO.md',
    'data/motore/asw_aereo.toml [mezzi.hkp4] [sonar_immersione.hs73]',
    'acustica.toml (sensori.hs73, emissioni.hs73, transitori.elicottero_hkp4)', 'siluri.toml [siluri.tp42]']

elicottero.sh2f:
  it: >-
    Il Kaman SH-2F Seasprite è l'elicottero del LAMPS Mk I, un «sensore remoto» delle scorte: vola dalle fregate
    Knox e, prima dell'arrivo del LAMPS III, anche da Kidd, Spruance e dalle prime Perry. Non ha sonar a immersione:
    porta circa 15 boe, passive SSQ-41 e attive SSQ-47 di sola distanza, il radar di superficie LN-66HP e il
    magnetometro rimorchiato ASQ-81, mentre i due piloni esterni reggono due Mk 46, o un Mk 46 e un serbatoio.
    L'elicottero non elabora il suono delle boe: lo passa alla nave col data link AN/ASK-22, e la nave gli rimanda i
    risultati. Le fonti gli danno circa 120 nodi di crociera, 140 di massima e 3,5-4,5 ore d'autonomia. È un mezzo
    «reattivo»: aspetta che la nave abbia già un contatto, stende un campo di boe sul rilevamento e precisa la
    posizione col MAD prima di lanciare il Mk 46.
  en: >-
    The Kaman SH-2F Seasprite is the LAMPS Mk I helicopter, a «remote sensor» for the escorts: it flies from Knox
    frigates and, before LAMPS III arrived, also from Kidds, Spruances and the early Perrys. It has no dipping sonar:
    it carries about 15 sonobuoys, passive SSQ-41s and range-only active SSQ-47s, the LN-66HP surface radar and the
    towed ASQ-81 magnetometer, while its two external pylons hold two Mk 46s, or one Mk 46 and a fuel tank. The
    helicopter does not process the buoy audio: it passes it to the ship over the AN/ASK-22 data link, and the ship
    sends the results back. The sources give it about 120 knots cruising, 140 maximum and 3.5-4.5 hours of endurance.
    It is a «reactive» asset: it waits for the ship to have a contact, lays a buoy field down the bearing and pins the
    position with MAD before dropping the Mk 46.
  uso_it: >-
    Nel gioco non ha un radar che il vostro ESM possa sentire, quindi arriva in silenzio, e decolla dalla Knox solo
    fino a mare 4. Porta 9 boe SSQ-41B, 5 SSQ-47B e un batitermografo: con le sole omnidirezionali sa soltanto che
    siete vicini, e l'errore scende sotto le 2 miglia quando due boe vi sentono insieme. Allora stende un quadrato di
    SSQ-47B, coi vertici a 970 metri dal centro, che pingano a 16 kHz ogni 10 secondi: con tre distanze vi localizza
    e passa basso col MAD, a circa 45 metri, prima del Mk 46. Quando sentite quei ping uscite dal quadrato, perché la
    boa vi misura solo entro 1,5 km; e ricordate che resta in zona circa 2 ore e mezza, meno un'ora ogni 50 miglia di
    distanza dalla nave.
  uso_en: >-
    In the game it has no radar your ESM can hear, so it arrives silently, and it takes off from the Knox only up to
    sea state 4. It carries 9 SSQ-41B buoys, 5 SSQ-47Bs and a bathythermograph: with the omnidirectional buoys alone it
    only knows you are near, and the error drops below 2 miles when two buoys hear you together. Then it lays a
    square of SSQ-47Bs, with corners 970 metres from the centre, pinging at 16 kHz every 10 seconds: with three ranges
    it fixes you and passes low with the MAD, at about 45 metres, before the Mk 46. When you hear those pings, get
    out of the square, because the buoy ranges you only within 1.5 km; and remember that it stays on station about two
    and a half hours, minus one hour for every 50 miles from the ship.
  fonti: ['dossier 37 §1 e §2 [HOLLER]', 'dossier 17 §2.1b [FASSH2] [GSSH2] [ACSH2F]', 'extracted/navi/sh2f/RAPPORTO.md',
    'data/motore/asw_aereo.toml [mezzi.sh2f]', 'acustica.toml (emissioni.ssq47b)',
    'engine/missioni/src/missione_antisom_navi.cpp (elicottero_di)']
