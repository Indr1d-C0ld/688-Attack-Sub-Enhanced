nota = "Due pagine: il report della missione e le sue imprese (ghiaccio, notte, pedinamento, soccorso, riconoscimento, mine, ASW aereo, armi e navigazione)."
tasto = [
    { uso = ["campo:tab"], cosa = "il report o le imprese" },
    { uso = ["campo:clic"], cosa = "nel piede delle imprese: il report o indietro" },
    { uso = ["campo:invio", "campo:esc"], tasti = ["campo:invio", "campo:esc"], cosa = "torna al debriefing" },
]

[[schermata]]
titolo = "Statistiche della sandbox"
funzioni = ["statistiche.cpp:SchermataStatisticheSandbox::comandi"]
nota = "S dal debriefing dello spettatore (§12.6)."
tasto = [
    { uso = ["campo:tab"], tasti = ["comando:zona_avanti"], cosa = "la scheda successiva o precedente" },
    { uso = ["campo:su_giu"], cosa = "scorre la tabella" },
    { uso = ["campo:invio", "campo:esc"], tasti = ["campo:invio", "campo:esc"], cosa = "torna al debriefing" },
    { uso = ["campo:clic"], cosa = "sulle linguette, la scheda; su una riga con l'ora, il replay da quell'istante" },
]

[[schermata]]
titolo = "Serie della sandbox"
funzioni = ["schermata_serie.cpp:SchermataSerie::comandi"]
nota = "Dopo S nelle regolazioni, o con --serie (§12.8)."
tasto = [
    { uso = ["campo:tab"], tasti = ["comando:zona_avanti"], cosa = "la pagina: esiti, per parte, istogrammi" },
    { uso = ["campo:su_giu"], cosa = "per parte: scorre la tabella; istogrammi: il numero da mostrare" },
    { uso = ["campo:invio", "campo:esc"], tasti = ["campo:invio", "campo:esc"], cosa = "torna alle regolazioni" },
    { uso = ["campo:clic"], cosa = "sulle linguette, la pagina; nel piede, la pagina seguente o indietro; negli istogrammi, su una barra di partita, il suo replay" },
]

[[schermata]]
titolo = "Replay"
funzioni = ["replay.cpp:SchermataReplay::comandi", "trascina_carta.hpp:rotella_carta"]
tasto = [
    { uso = ["campo:pausa"], cosa = "ferma o riprende" },
    { uso = ["campo:compressione", "campo:azioni"], tasti = ["campo:compressione", "comando:telegrafo_avanti", "comando:telegrafo_indietro"], cosa = "raddoppia o dimezza la velocità" },
    { uso = ["campo:ruota"], cosa = "salta di 30 s indietro o avanti (tenuto, continua)" },
    { uso = ["campo:tab"], cosa = "l'evento successivo o precedente" },
    { uso = ["lettera:G"], cosa = "l'intervento del vetrino di Dio successivo (i triangoli magenta sopra la linea del tempo)" },
    { uso = ["campo:veloce"], cosa = "tenuto con G: l'intervento precedente" },
    { uso = ["campo:verita"], cosa = "la lettura: la verità o il quadro del comandante" },
    { uso = ["campo:ingrandisci", "campo:riduci"], cosa = "ingrandisce o riduce la carta" },
    { uso = ["campo:rotella"], tasti = ["fisso:rotella"], cosa = "sopra la carta la ingrandisce o la riduce, attorno al punto sotto il cursore" },
    { uso = ["campo:invio"], cosa = "riprende la missione da quell'istante" },
    { uso = ["campo:esc"], cosa = "chiude il replay" },
    { uso = ["campo:clic"], cosa = "sulla linea del tempo, quell'istante; SEGUI torna a seguire il battello; trascinare sposta la carta" },
]

