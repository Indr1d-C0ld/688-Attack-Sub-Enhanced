# I tasti di ogni schermata, per il volume 1, appendice A (tools/pipeline/manuale_tasti.py, che spiega le voci).
# Scritto a mano: la spiegazione. Dal codice: i tasti (tasti_predefiniti.toml e applica() in finestra.cpp) e il
# controllo (manuale.py --controlla), che segnala ogni tasto delle `funzioni` che qui manca e ogni `uso` che il codice
# non ha piu'. Le righe con lo stesso `gruppo`, una dopo l'altra, fanno una tabella.

# --- il menu ---------------------------------------------------------------------------------------------------------

[[schermata]]
titolo = "Classico o Enhanced (solo al primo avvio)"
funzioni = ["schermata_modo.cpp:SchermataModo::comandi"]
tasto = [
    { uso = ["campo:ruota"], cosa = "il pannello a sinistra (classico) o a destra (Enhanced)" },
    { uso = ["campo:cifre"], tasti = ["pulsanti:1-2"], cosa = "1 classico, 2 Enhanced" },
    { uso = ["campo:invio"], cosa = "conferma" },
    { uso = ["campo:esc"], cosa = "esce dal gioco" },
    { uso = ["campo:clic"], cosa = "sceglie il pannello, un secondo clic conferma; i tasti del piede" },
]

