[[schermata]]
titolo = "In mare, nella sandbox"
funzioni = ["replay.cpp:SchermataReplay::comandi_vivo", "trascina_carta.hpp:rotella_carta"]
nota = "La vista dal vivo (§12.5): lo spettatore guarda e non comanda. È la carta del replay mentre la partita va avanti, con a destra il registro dell'IA e la scheda dell'unità scelta. La partita finisce da sola alla durata scelta o all'esito; poi c'è il debriefing con tutti gli eventi e la verità, fuori carriera."
tasto = [
    { uso = ["campo:pausa"], cosa = "pausa" },
    { uso = ["campo:compressione", "campo:azioni"], tasti = ["campo:compressione", "comando:telegrafo_avanti", "comando:telegrafo_indietro"], cosa = "raddoppia o dimezza la compressione del tempo, fino a 256×" },
    { uso = ["campo:verita"], cosa = "la lettura: la verità, il quadro della NATO, il quadro del Patto, il quadro dell'unità scelta; il filtro del registro segue la parte" },
    { uso = ["lettera:C"], cosa = "nel quadro di una parte, la verità delle altre in grigio sotto, per confronto" },
    { uso = ["campo:tab"], cosa = "l'unità successiva o precedente (le armi no)" },
    { uso = ["lettera:S"], cosa = "la carta segue l'unità scelta" },
    { uso = ["campo:ruota"], cosa = "l'evento precedente o successivo del registro filtrato (tenuto, continua); dopo l'ultimo si torna al vivo" },
    { uso = ["campo:invio"], cosa = "torna al vivo dopo aver guardato indietro" },
    { uso = ["campo:ingrandisci", "campo:riduci"], cosa = "ingrandisce o riduce la carta" },
    { uso = ["campo:rotella"], tasti = ["fisso:rotella"], cosa = "sopra la carta la ingrandisce o la riduce, attorno al punto sotto il cursore" },
    { uso = ["lettera:G"], cosa = "il pannello degli interventi del vetrino di Dio (§12.5): il gruppo, l'intervento, l'unità o il punto (un clic sulla carta), i parametri, quando; Tab scorre, le frecce cambiano il valore, Invio sceglie, Esc torna indietro (dal primo passo chiude il pannello)" },
    { uso = ["campo:cancella"], cosa = "annulla l'ultimo intervento dato dal pannello: la partita si rigioca dall'inizio senza" },
    { uso = ["campo:esc"], cosa = "lascia la partita (col pannello aperto, torna indietro nel pannello)" },
    { uso = ["campo:clic"], cosa = "sulla linea del tempo, guarda indietro a quell'istante (ADESSO torna al vivo); sulla riga in alto del registro, il filtro per parte (a sinistra) e per tipo (a destra); ADESSO a destra nella fascia del tempo e i tre tasti del piede (FINE, CONFRONTO, ADESSO); su una riga del registro, la carta va all'evento e sceglie l'unità; sul titolo della scheda, segue l'unità; trascinare sposta la carta" },
    { uso = ["campo:veloce"], cosa = "tenuto mentre si clicca una riga del registro: anche il tempo va a quell'evento" },
]

