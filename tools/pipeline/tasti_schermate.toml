titolo = "Editor di missione"
funzioni = ["editor_missione.cpp:SchermataEditor::comandi"]
tasto = [
    { uso = ["campo:cifre"], tasti = ["pulsanti:1-8"], cosa = "la scheda: missione, unità, rotte, zone, obiettivi, regole, briefing, prova (cap. 11)" },
    { uso = ["lettera:S"], cosa = "salva" },
    { uso = ["lettera:E"], cosa = "esporta il pacchetto da scambiare" },
    { uso = ["lettera:G"], cosa = "salva e prova in mare (prima vanno corretti gli errori)" },
    { uso = ["lettera:X"], cosa = "nella scheda unità toglie l'unità scelta; nella scheda rotte, l'ultimo punto" },
    { uso = ["campo:ingrandisci", "campo:riduci"], cosa = "ingrandisce o riduce la carta" },
    { uso = ["campo:ruota", "campo:su_giu"], tasti = ["fisso:le frecce"], cosa = "spostano la carta (Maiusc più veloce); col puntatore sulle schede, su e giù scorrono" },
    { uso = ["campo:veloce"], cosa = "la carta si sposta più in fretta" },
    { uso = ["campo:clic"], cosa = "sulla carta sceglie (trascinare sposta l'unità, la zona o la carta); nelle schede cambia il campo in avanti; negli avvisi mostra l'unità; nel piede: indietro, salva, esporta, prova in mare" },
    { uso = ["campo:clic_destro"], cosa = "sulla carta aggiunge (unità, punto di rotta, zona, centro dell'obiettivo); nelle schede cambia il campo all'indietro" },
    { uso = ["campo:esc"], cosa = "torna al menu; con modifiche non salvate, la prima volta avvisa" },
