# Toponimi aggiunti a mano a quelli di Natural Earth (tools/pipeline/toponimi.py), e correzioni dei nomi.
# Coordinate in gradi decimali WGS84, arrotondate al chilometro circa; toponimi.py controlla che i nomi d'acqua cadano in
# mare e gli altri a terra sul fondale vero, e avvisa se no. Nomi nella forma del glossario della traduzione
# (docs/traduzione/glossario.md) e del 1989: nessun nome posteriore (niente «relitto del Kursk»).
# Rango: 1-2 il teatro e i mari, 3-4 isole e stretti maggiori, basi; 5-6 capi, banchi, città minori; 7+ dettagli.

correzioni:            # nome italiano o inglese di Natural Earth -> nome della carta
  mare di Ochotsk: Mare di Okhotsk
  mar Baltico: Mar Baltico
  mare di Barents: Mare di Barents
  mare di Norvegia: Mare di Norvegia
  oceano Atlantico: Oceano Atlantico
  oceano Pacifico: Oceano Pacifico
  mare Adriatico: Mare Adriatico
  mar Ionio: Mar Ionio
  mare di Alborán: Mare di Alborán
  Øresund: Øresund (Sund)
  "en:Sea of Okhotsk": Sea of Okhotsk

escludi: []            # nomi da togliere, anche «teatro:nome»

FONTE: &mano "a mano, coordinate al chilometro (curatore kit)"

