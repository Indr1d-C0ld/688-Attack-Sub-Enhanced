  nazione: usa
  classi: [los_angeles]
  dati:
    - {campo: brt6, nome_it: BRT-6, nome_en: BRT-6, testo_it: "boa UHF satellitare a perdere: su tre SSN-637 a meta' anni '80, poi sui 688; per il 688 del 1989 non verificata", testo_en: "expendable UHF satcom buoy: on three SSN-637s in the mid-1980s, then on the 688s; unverified for the 1989 688", fonte: "dossier 08 §3.3, §4.1 [FASBRT6] [SCMP]", conf: bassa}
    - {campo: slot, nome_it: Boa SLOT, nome_en: SLOT buoy, testo_it: "messaggio registrato fino a 5 minuti, lanciato in immersione e trasmesso in VHF dopo un ritardo agli aerei vicini", testo_en: "recorded message of up to 5 minutes, launched submerged and sent on VHF after a delay to nearby aircraft", fonte: "dossier 10 radio §1.5 [NSL4604] [WPSLOT]", conf: media}
    - {campo: costo, nome_it: Costo, nome_en: Cost, testo_it: "l'AN/BRT-1 costava 572 dollari nel 1982", testo_en: "the AN/BRT-1 cost 572 dollars in 1982", fonte: "dossier 10 radio §1.5 [WPSLOT]", conf: media}
    - {campo: rimorchiata, nome_it: Boa rimorchiata, nome_en: Towed buoy, testo_it: "il 688 Flight I non aveva boe rimorchiate: la BRR-6 era solo degli SSBN Ohio", testo_en: "the 688 Flight I had no towed buoy: the BRR-6 was only on Ohio SSBNs", fonte: "dossier 08 §3.3 [SCMP] [TWZBRR6]", conf: alta}
    - {campo: gioco, nome_it: Nel gioco, nome_en: In the game, testo_it: "proposta: 2-4 boe per missione, con un ritardo di 5-30 minuti", testo_en: "proposal: 2-4 buoys per mission, with a 5-30 minute delay", fonte: "dossier 10 radio §4.4", conf: STIMA}
