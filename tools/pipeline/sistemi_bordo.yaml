centrale:
  nome: Centrale
  nome_en: Control room
  nazione: entrambe
  classi: [los_angeles, alfa]
  dati:
    - {campo: posizione_688, nome_it: Dove (688), nome_en: Where (688), testo_it: "ponte superiore del compartimento prodiero; fa anche da centro d'attacco, con la sala sonar a parte", testo_en: "upper deck of the forward compartment; it is also the attack centre, with the sonar room separate", fonte: "dossier 19 §2.1 [FAS-688] [SI-637]", conf: media}
    - {campo: governo_688, nome_it: Governo (688), nome_en: Ship control (688), testo_it: "quattro uomini: timoniere, pianista, ufficiale d'immersione e capo della guardia al Ballast Control Panel", testo_en: "four men: helmsman, planesman, Diving Officer of the Watch and Chief of the Watch at the Ballast Control Panel", fonte: "dossier 19 §2.2 [NOVA-C] [SR-2004]", conf: alta}
    - {campo: luci_688, nome_it: Luci (688), nome_en: Lighting (688), testo_it: "bianca di giorno; di notte buio o luce rossa prima delle osservazioni al periscopio", testo_en: "white by day; at night dark, or red light before periscope observations", fonte: "dossier 19 §2.1 [NOVA-S]", conf: media}
    - {campo: alfa, nome_it: Posto centrale (Alfa), nome_en: Central post (Alfa), testo_it: "a ferro di cavallo nel compartimento III, quello rifugio; niente sale separate per radio, radar, sonar o carteggio; 8 uomini di guardia", testo_en: "horseshoe-shaped in compartment III, the refuge compartment; no separate radio, radar, sonar or chart rooms; 8 men on watch", fonte: "dossier 19 §3.1, §3.2 [SOB] [PRJ] [BOG]", conf: alta}
    - {campo: compartimenti, nome_it: Compartimenti (688), nome_en: Compartments (688), testo_it: "pochi compartimenti stagni: prodiero (centrale, alloggi, locale siluri), reattore, sala macchine", testo_en: "few watertight compartments: forward (control, berthing, torpedo room), reactor, engine room", fonte: "dossier 02 §9.3 [PM04]", conf: media}
