# Sottomarino costiero Type 206A (U 13-30, Bundesmarine), configurazione 1989: scafo cilindrico corto con la prua tonda
# e piatta (gli otto portelli dei tubi), il cassero basso, la vela a due piani (davanti la parte bassa col portello,
# dietro la carenatura alta degli alberi, a poppa il gradino basso), la coda a croce con un'elica sola.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri; {prua: d} =
# punto a d metri dalla prua. Quote rispetto al galleggiamento in emersione. Misure: 48,6 x 4,6 m, immersione 4,3 m
# (dossier docs/ricerca/32_firme_lotto2.md); vela e cassero dalla foto dell'U 17 sul pontone a Coblenza (2008, di tre
# quarti dal mascone sinistro, tutto lo scafo fuori dall'acqua) con gli scarti della calibrazione (STIMA dove la
# foto, molto di scorcio, non decide). La foto dei due battelli all'ormeggio (S194 e S196, 2013) non si calibra
# (grandangolo distorto, 33 px): serve solo da riscontro per la vela. Modello proprio approvato il 30/10/2026.
nome: Type 206 (U 13-30)
uscita: extracted/navi/type206
tono: 0.25
contrasto: 0.12
moduli_parti: [sottomarini_parti.py]
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  L: 48.6
  B: 4.4
  # prua tonda e piena, cilindro corto, cono di poppa lungo fino all'elica: il volume del 206 vero (498 t in
  # immersione) vuole lo scafo snello; 4,4 m di diametro, la larghezza di 4,6 col cassero (STIMA)
  forma: {prua: 3.0, poppa: 22.0, esponente_prua: 2.6, esponente_poppa: 1.3, raggio_coda: 0.3}
  bordo_libero: 0.3        # sommita' dello scafo (immersione 4,3 m su 4,6 col cassero)
  # il cassero: alto e largo sulla prua (il rigonfio sopra i tubi), basso fino alla vela, poi scende verso la coda
  cassero: [[0.6, 1.2, 0.8], [2.5, 1.5, 1.5], [9.0, 1.3, 1.3], [30.0, 1.2, 1.1], [38.0, 0.9, 0.7], [44.0, 0.5, 0.3]]
  stazioni: 80
  punti_sezione: 40

parti:
  # la vela: la parte bassa dal fronte tondo fino al gradino poppiero; sopra, dal mezzo, il blocco alto degli alberi
  # (la parte «vela», dove le luci mettono il fanale d'albero e i laterali)
  - tipo: vela
    nome: vela_bassa
    pianta: ovale
    esponente: 3.0
    livelli:
      - [1.2, {prua: 12.8}, {prua: 29.1}, 0.95]
      - [3.2, {prua: 14.0}, {prua: 29.0}, 0.9]
  - tipo: vela
    nome: vela_prodiera
    pianta: ovale
    esponente: 2.0
    livelli:
      - [3.2, {prua: 14.0}, {prua: 23.8}, 0.88]
      - [4.9, {prua: 16.0}, {prua: 23.8}, 0.85]
  - {tipo: scatola, nome: vela, x0: {prua: 23.8}, x1: {prua: 17.5}, y0: -0.8, y1: 0.8, z0: 4.9, z1: 6.1, mat: scafo}
  - {tipo: cilindro, nome: periscopio, x: {prua: 19.8}, y: 0, r: 0.15, z0: 6.1, z1: 7.5, n: 8, mat: scuro}
  - {tipo: cilindro, nome: snorkel, x: {prua: 21.8}, y: 0, r: 0.2, z0: 6.1, z1: 6.9, n: 8, mat: scuro}
  # timone superiore della coda a croce
  - {tipo: timone_verticale, nome: timone, x: {prua: 45.5}, z0: -1.0, z1: 1.6, corda: 2.6, corda_estremita: 1.6, spessore: 0.35, freccia: 0.6}

foto:
  - nome: coblenza
    file: extracted/navi/type206/foto/3840px-U_17_vor_Koblenz.jpg
    nave: U 17 (S 196) sul pontone a Coblenza, 2008 (CC BY-SA 4.0), di tre quarti dal mascone sinistro, fuori dall'acqua
    qualita: 1.0
    specchiabile: true
    # il pontone, gli alberi e le bandiere attorno: la maschera e' la sagoma del modello calibrato sui punti, erosa di
    # 4 px (tools/navi/contorno_modello.py --maschera --erodi 4)
    maschera_file: extracted/navi/type206/foto/coblenza_maschera.png
    solo_punti: true
    riquadro: [700, 1000, 2450, 1900]
    fotocamera_iniziale: {posizione: [-40, 60, 12], bersaglio: [0, 0, 0], f: 4000}
    limiti_fotocamera: {elevazione: [-5, 40], distanza: [20, 500], focale: [800, 30000]}
    punti:
      - [[{prua: 0}, 0, -1.3], [765, 1589]]          # punta della prua (la parte piu' avanzata, 0,6 m sopra l'asse)
      - [[{prua: 48.0}, 0, -1.3], [2258, 1532]]      # mozzo dell'elica (come si vede nella foto, sopra l'asse)
      - [[{prua: 1.0}, 0, 1.3], [805, 1358]]         # cima del rigonfio del cassero sulla prua
      - [[{prua: 16.0}, 0, 4.9], [1432, 1116]]       # cielo della parte prodiera della vela, a prua
      - [[{prua: 23.8}, 0, 6.1], [1684, 1053]]       # cielo del blocco alto, spigolo poppiero
      - [[{prua: 29.0}, 0, 3.2], [1832, 1268]]       # gradino poppiero della vela, in cima
      - [[{prua: 12.8}, 0.95, 1.2], [1389, 1379]]    # piede prodiero della vela, lato sinistro
