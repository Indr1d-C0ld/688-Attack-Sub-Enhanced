# Portarinfuse (handysize-supramax con le gru), la classe `portarinfuse` del traffico civile: lo scafo lungo e basso a
# pieno carico, il castello di prua con l'albero, le cinque stive coi boccaporti, le quattro gru a palo sulla linea di
# mezzeria, la sovrastruttura e il fumaiolo a poppa.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri; {prua: d} =
# punto a d metri dalla prua. Misure della classe del traffico: 225 x 33,8 m, 12 m d'immersione (tools/pipeline/
# civili.py); posizioni in proporzione dalla foto di dritta della Bulk Destiny (2023, in zavorra), quote sopra la coperta
# a ~15 px/m e la coperta a 6,5 m sul galleggiamento a pieno carico (STIMA). La sagoma delle portarinfuse con le gru e'
# quella degli anni '80. Modello proprio approvato il 30/10/2026.
nome: Portarinfuse (con le gru)
uscita: extracted/navi/portarinfuse

scafo:
  L: 225.0
  B: 33.8
  bordo: [[0, 11.6], [19.0, 11.6], [20.0, 6.5], [225.0, 6.5]]
  slancio: 4.0
  finezza_prua: 30
  specchio: 0.85
  svasatura: 0.01
  pienezza: [0.5, 0.35]

parti:
  # ---------------- le cinque stive coi boccaporti
  - {tipo: tuga, nome: boccaporto_1, x0: {prua: 52.0}, x1: {prua: 26.0}, y0: -11.0, y1: 11.0, z0: 6.5, z1: 9.5}
  - {tipo: tuga, nome: boccaporto_2, x0: {prua: 81.0}, x1: {prua: 55.0}, y0: -11.0, y1: 11.0, z0: 6.5, z1: 9.5}
  - {tipo: tuga, nome: boccaporto_3, x0: {prua: 117.0}, x1: {prua: 88.0}, y0: -11.0, y1: 11.0, z0: 6.5, z1: 9.5}
  - {tipo: tuga, nome: boccaporto_4, x0: {prua: 153.0}, x1: {prua: 124.0}, y0: -11.0, y1: 11.0, z0: 6.5, z1: 9.5}
  - {tipo: tuga, nome: boccaporto_5, x0: {prua: 186.0}, x1: {prua: 161.0}, y0: -11.0, y1: 11.0, z0: 6.5, z1: 9.5}
  # ---------------- le quattro gru a palo con i bracci
  - {tipo: cilindro, nome: gru_1, x: {prua: 47.2}, y: 0, r: 1.3, z0: 6.5, z1: 26.4}
  - {tipo: cilindro, nome: gru_2, x: {prua: 84.6}, y: 0, r: 1.3, z0: 6.5, z1: 26.4}
  - {tipo: cilindro, nome: gru_3, x: {prua: 120.2}, y: 0, r: 1.3, z0: 6.5, z1: 26.4}
  - {tipo: cilindro, nome: gru_4, x: {prua: 157.5}, y: 0, r: 1.3, z0: 6.5, z1: 26.4}
  - {tipo: asta, nome: braccio_1, da: [{prua: 47.2}, 0, 18.0], a: [{prua: 70.0}, 0, 18.0], spessore: 0.9}
  - {tipo: asta, nome: braccio_2, da: [{prua: 84.6}, 0, 18.0], a: [{prua: 62.0}, 0, 18.0], spessore: 0.9}
  - {tipo: asta, nome: braccio_3, da: [{prua: 120.2}, 0, 18.0], a: [{prua: 143.0}, 0, 18.0], spessore: 0.9}
  - {tipo: asta, nome: braccio_4, da: [{prua: 157.5}, 0, 18.0], a: [{prua: 135.0}, 0, 18.0], spessore: 0.9}
  # ---------------- l'albero di prua sul castello
  - {tipo: albero_palo, nome: albero_prodiero, x: {prua: 9.8}, z0: 11.6, z1: 28.8, r: 0.45}
  # ---------------- la sovrastruttura e il fumaiolo a poppa
  - {tipo: tuga, nome: sovrastruttura, x0: {prua: 215.8}, x1: {prua: 190.1}, y0: -14.0, y1: 14.0, z0: 6.5, z1: 22.8, rastrema: 0.99}
  - {tipo: tuga, nome: plancia, x0: {prua: 206.0}, x1: {prua: 190.1}, y0: -16.9, y1: 16.9, z0: 22.8, z1: 25.8}
  - {tipo: mack, nome: fumaiolo, x0: {prua: 212.8}, x1: {prua: 206.6}, y0: -3.0, y1: 3.0, z0: 25.8, z1: 31.3, cappello: 1.5}
  - {tipo: albero_palo, nome: albero_poppiero, x: {prua: 202.0}, z0: 25.8, z1: 38.0, r: 0.35}

# le foto da Wikimedia Commons (permesso dell'utente del 30/10/2026; crediti in foto/crediti.json e nel RAPPORTO)
foto:
  - nome: dritta_bulk_destiny
    file: extracted/navi/portarinfuse/foto/3840px-2023-05-26_BULK_DESTINY_-_IMO_9781994.jpg
    nave: Bulk Destiny, 26/5/2023 (CC BY-SA 4.0), di dritta quasi al traverso, in zavorra
    qualita: 0.9
    specchiabile: true
    # la maschera e' la sagoma del modello calibrato sui punti, erosa di 3 px: in zavorra la carena rossa sta sotto il
    # galleggiamento del modello a pieno carico, e la maschera la lascia fuori
    maschera_file: extracted/navi/portarinfuse/foto/dritta_bulk_destiny_maschera.png
    solo_punti: true
    riquadro: [150, 550, 3650, 1350]
    # nomi e marchi veri tolti (decisione della principale, 30/10/2026): il nome a prua, il logo del fumaiolo
    cancella: [[3310, 1043, 3475, 1085], [362, 780, 472, 892]]
    fotocamera_iniziale: {posizione: [0, -3000, 20], bersaglio: [0, 0, 15], f: 50000}
    limiti_fotocamera: {elevazione: [-5, 15], distanza: [200, 20000], focale: [1000, 400000]}
    punti:
      - [[{prua: 0}, 0, 11.6], [3572, 1020]]         # prua in coperta, sul castello
      - [[{prua: 225.0}, 0, 6.5], [196, 1097]]       # poppa in coperta
      - [[{prua: 190.1}, -16.9, 25.8], [721, 808]]   # spigolo prodiero alto di dritta della plancia
      - [[{prua: 206.6}, 0, 31.3], [472, 725]]       # spigolo prodiero del cielo del fumaiolo
      - [[{prua: 157.5}, 0, 26.4], [1209, 799]]      # cima della gru poppiera
      - [[{prua: 47.2}, 0, 26.4], [2867, 799]]       # cima della gru prodiera
      - [[{prua: 9.8}, 0, 28.8], [3429, 762]]        # cima dell'albero di prua
