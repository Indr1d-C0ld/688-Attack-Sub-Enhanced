# Elicottero Kamov Ka-25PL "Hormone-A", configurazione 1989: oggetto in volo (vista: volante).
# Coordinate del kit: x verso prua, y verso sinistra, z verso l'alto, metri. Il modello sta tutto sopra z = 0:
# fondo delle ruote a z ~7,0, ventre della cabina a z ~8,05, mozzi dei rotori a 10,8 e 12,3.
# {prua: d} = punto a d metri dal muso (L = 9,75 m, lunghezza della fusoliera dichiarata).
# Misure pubbliche (Wikipedia en/ru): fusoliera 9,75 m, rotori coassiali tripala da 15,74 m, altezza 5,37 m,
# larghezza massima 3,76 m (piano di coda con le derive), carreggiata 3,5 m (ruote posteriori) e 1,41 m (anteriori),
# passo 3,02 m. Posizioni e quote triangolate da quattro foto (vedi extracted/navi/ka25/RAPPORTO.md):
# mozzi a 3,4 m dal muso, separazione dei rotori ~1,5 m, derive di estremita' da 7,9 a 9,2 m, alte 1,65 m.
nome: Ka-25PL Hormone-A
uscita: extracted/navi/ka25
moduli_parti: [elicotteri_parti.py]
vista: {volante: true, elevazioni: [0, 10, 25], centro: [0.0, 0.0, 9.6]}
# dischi dei rotori nel materiale 'traliccio', schiarito: puntinato grigio medio come negli sprite originali
albedo: {traliccio: 0.6}

# lo "scafo" e' la fusoliera: sezioni [d dal muso, z basso, z alto, semilarghezza, esponente] (quote assolute)
scafo:
  generatore: fusoliera
  L: 9.75
  z0: 0.0
  sezioni:
    - [0.00, 7.95, 8.45, 0.15, 2.0]
    - [0.25, 7.80, 8.95, 0.55, 2.2]
    - [0.55, 7.80, 9.40, 0.72, 2.5]
    - [1.00, 7.90, 9.90, 0.80, 3.0]
    - [1.60, 8.02, 10.00, 0.82, 3.5]
    - [5.40, 8.05, 10.00, 0.82, 3.5]
    - [6.20, 8.45, 9.60, 0.60, 3.0]
    - [7.30, 8.85, 9.55, 0.34, 2.5]
    - [8.40, 9.00, 9.45, 0.25, 2.2]
    - [9.00, 9.05, 9.40, 0.18, 2.0]

parti:
  # radome del radar di ricerca sotto il muso
  - {tipo: ellissoide, nome: radome, x: {prua: 0.75}, y: 0, z: 8.0, rx: 0.75, ry: 0.62, rz: 0.4}
  # ponte motori (due turboalbero GTD-3) con le prese d'aria anteriori
  - {tipo: fusoliera, nome: ponte_motori, L: 9.75, sezioni: [[1.5, 9.85, 10.0, 0.5, 3], [1.9, 9.85, 10.5, 0.75, 3], [5.0, 9.85, 10.55, 0.8, 3], [5.8, 9.8, 10.2, 0.6, 2.5], [6.3, 9.6, 9.8, 0.3, 2]]}
  - {tipo: tubo, nome: presa_sinistra, x0: {prua: 2.5}, x1: {prua: 1.85}, y: 0.4, z: 10.3, r: 0.27, mat: scuro}
  - {tipo: tubo, nome: presa_destra, x0: {prua: 2.5}, x1: {prua: 1.85}, y: -0.4, z: 10.3, r: 0.27, mat: scuro}
  # albero coassiale con i due mozzi e il piatto oscillante
  - {tipo: cilindro, nome: albero_rotori, x: {prua: 3.4}, y: 0, r: 0.17, z0: 10.5, z1: 12.45}
