# Incrociatore lanciamissili a propulsione nucleare classe Kirov (Progetto 1144 "Orlan"), unita' capoclasse
# Kirov nella configurazione 1980-1990 (quella in servizio nel 1989, Flotta del Nord).
# Coordinate del kit: x verso prua (origine a meta' dello scafo generato), y verso sinistra, z verso l'alto,
# metri. {prua: d} = punto a d metri dalla prua (dritto in coperta).
#
# Scelta dell'unita' (vedi extracted/navi/kirov/RAPPORTO.md): Kirov, Flotta del Nord, l'unita' meglio
# documentata dalle foto di pubblico dominio (1980-1989). Differenze delle altre unita', NON costruite:
#  - Frunze (1984, Flotta del Pacifico) e Kalinin (1988, Flotta del Nord): al posto delle due torri singole
#    AK-100 poppiere (ak100_superiore, ak100_inferiore) un impianto binato AK-130 sull'asse, piu' arretrato
#    (parte del kit `impianto_binato` o `torre_singola` larga 5 m); niente lanciatore binato SS-N-14 a prua
#    (lanciatore_ssn14: tolto, al suo posto le celle a scomparsa del Kinzhal/SA-N-9 e l'Udav-1 invece della
#    RBU-6000); albero poppiero con Top Plate al posto del Top Steer.
#  - Kalinin: in piu' sei Kashtan (CADS-N-1) al posto degli AK-630, due dei quali ai lati della prua
#    (parti `ciws` del kit, 3 m di diametro).
# Misure: scala dalla foto di fianco calibrata del Kirov (1983), 0,0972 m/pixel, lunghezza fuori tutto 252 m;
# larghezze dalla foto di prua (1985) e dalla larghezza massima ufficiale (28,5 m).
nome: Kirov (Progetto 1144)
uscita: extracted/navi/kirov
moduli_parti: [kirov_parti.py]

# Specchio di poppa verticale (foto di poppa del Frunze; nella foto di fianco del Kirov in moto la parte bassa
# dello specchio e' coperta dall'onda di poppa bianca, che sembrava uno specchio inclinato).
scafo: &scafo
  L: 252.0
  B: 25.0
  # insellatura: 14,6 m al dritto, ~10 m da 68 m a 200 m, gradino del ponte di volo a ~227 m
  bordo: [[0, 14.6], [10, 14.4], [20, 14.0], [30, 13.3], [40, 12.6], [50, 11.6], [60, 10.6], [66, 9.9],
          [90, 10.0], [200, 10.0], [224, 9.2], [227, 7.8], [230, 7.0], [234, 6.4], [242, 6.4], [247, 6.8], [252, 7.1]]
  slancio: 16.0
  finezza_prua: 80
  specchio: 0.88
  svasatura: 0.14
  pienezza: [1.1, 0.55]

parti:
  - {tipo: chiusura_dritto, nome: chiusura_dritto, <<: *scafo}
  # asta di bandiera di prua e di poppa
  - {tipo: asta, nome: asta_prua, da: [{prua: 0.8}, 0, 14.6], a: [{prua: 0.8}, 0, 21.0], spessore: 0.2}
  - {tipo: asta, nome: asta_poppa, da: [{prua: 251.0}, 0, 7.1], a: [{prua: 251.0}, 0, 12.0], spessore: 0.2}
  # castello: lanciatore binato SS-N-14 (Metel) e tuga bassa dietro di esso
  - {tipo: lanciatore_binato, nome: lanciatore_ssn14, x: {prua: 26.2}, z0: 13.6, altezza: 2.3, braccio: 2.6}
  - {tipo: tuga, nome: tuga_castello, x0: {prua: 34.5}, x1: {prua: 29.5}, y0: -4.0, y1: 4.0, z0: 12.9, z1: 14.9, rastrema: 0.95}
  # (pozzi a filo del ponte: 12 S-300F e 20 P-700 Granit tra 35 e 90 m: non sporgono, non modellati)
  - {tipo: tuga, nome: rialzo_prodiero, x0: {prua: 63.0}, x1: {prua: 57.5}, y0: -5.0, y1: 5.0, z0: 10.2, z1: 11.1}
  # ponte tra i pozzi e la sovrastruttura: tughe basse e piccoli impianti
  - {tipo: tuga, nome: tuga_bassa_ponte, x0: {prua: 91.5}, x1: {prua: 75.5}, y0: -3.0, y1: 3.0, z0: 9.8, z1: 11.0}
  - {tipo: tuga, nome: impianto_80, x0: {prua: 80.6}, x1: {prua: 79.4}, y0: -1.0, y1: 1.0, z0: 11.0, z1: 11.9}
  - {tipo: tuga, nome: impianto_85, x0: {prua: 86.5}, x1: {prua: 83.5}, y0: -1.5, y1: 1.5, z0: 11.0, z1: 12.6}
  # sovrastruttura prodiera bassa, direttori e albero a palo
  - {tipo: tuga, nome: tuga_prodiera, x0: {prua: 108.6}, x1: {prua: 93.0}, y0: -5.0, y1: 5.0, z0: 10.0, z1: 16.8, rastrema: 0.96}
  - {tipo: tuga, nome: tuga_direttore_prodiero, x0: {prua: 99.0}, x1: {prua: 93.5}, y0: -4.0, y1: 4.0, z0: 16.7, z1: 18.3}
  - {tipo: direttore_tiro, nome: direttore_prodiero, x: {prua: 96.5}, z0: 18.3, altezza_base: 0.3}
  - {tipo: asta, nome: palo_prodiero, da: [{prua: 101.8}, 0, 16.8], a: [{prua: 101.8}, 0, 25.7], spessore: 0.35}
  # blocco della plancia e radar sul cielo della plancia
  - {tipo: tuga, nome: plancia, x0: {prua: 131.5}, x1: {prua: 108.6}, y0: -6.0, y1: 6.0, z0: 10.0, z1: 22.5, rastrema: 0.94, smusso_prua: 0.8}
  - {tipo: tuga, nome: cielo_plancia, x0: {prua: 133.0}, x1: {prua: 123.0}, y0: -5.0, y1: 5.0, z0: 22.4, z1: 25.2}
  - {tipo: cilindro, nome: colonna_radar_plancia, x: {prua: 121.0}, y: 0, r: 1.2, z0: 22.5, z1: 26.5}
  - {tipo: radome, nome: radar_plancia, x: {prua: 121.0}, z: 28.2, r: 2.0}
  # torre piramidale dell'albero prodiero (con gli scarichi) e piattaforma in cima
  - {tipo: tronco, nome: torre_prodiera, x0: {prua: 145.0}, x1: {prua: 133.0}, semilarghezza: 6.5, z0: 10.0, z1: 37.5,
     x0_alto: {prua: 147.0}, x1_alto: {prua: 133.5}, semilarghezza_alta: 3.0}
  - {tipo: tuga, nome: piattaforma_torre, x0: {prua: 145.0}, x1: {prua: 131.5}, y0: -3.5, y1: 3.5, z0: 37.5, z1: 38.8}
  - {tipo: top_pair, nome: top_pair, x: {prua: 138.0}, z0: 38.8, altezza_colonna: 2.7, orientamento: 90}
  - {tipo: asta, nome: cima_albero_prodiero, da: [{prua: 138.0}, 0, 46.0], a: [{prua: 138.0}, 0, 50.7], spessore: 0.3}
  # sovrastruttura poppiera, albero poppiero (Top Steer), Top Dome, direttore delle torri
  - {tipo: tuga, nome: tuga_poppiera, x0: {prua: 187.0}, x1: {prua: 149.0}, y0: -5.5, y1: 5.5, z0: 10.0, z1: 17.5, rastrema: 0.96}
  - {tipo: tuga, nome: raccordo_torre, x0: {prua: 149.0}, x1: {prua: 145.0}, y0: -5.0, y1: 5.0, z0: 10.0, z1: 15.0}
  - {tipo: tronco, nome: base_albero_poppiero, x0: {prua: 168.3}, x1: {prua: 160.5}, semilarghezza: 4.5, z0: 17.5, z1: 27.5,
     x0_alto: {prua: 166.2}, x1_alto: {prua: 162.8}, semilarghezza_alta: 2.0}
  - {tipo: traliccio, nome: albero_poppiero, x: {prua: 160.5}, base: 3.0, cima: 0.8, z0: 27.5, z1: 36.0, piani: [32.0]}
  - {tipo: asta, nome: pennone_poppiero, da: [{prua: 154.5}, 0, 36.0], a: [{prua: 161.0}, 0, 36.0], spessore: 0.3}
  - {tipo: asta, nome: palo_top_steer, da: [{prua: 164.0}, 0, 27.5], a: [{prua: 164.0}, 0, 35.2], spessore: 0.5}
  - {tipo: antenna_radar, nome: top_steer, x: {prua: 166.0}, z0: 31.0, larghezza: 4.5, altezza: 4.0, orientamento: 90}
  - {tipo: cilindro, nome: colonna_top_dome, x: {prua: 174.3}, y: 0, r: 2.2, z0: 17.5, z1: 22.5}
  - {tipo: radome, nome: top_dome, x: {prua: 174.3}, z: 25.6, r: 2.6}
  - {tipo: direttore_tiro, nome: kite_screech, x: {prua: 181.5}, z0: 17.5, altezza_base: 1.0, orientamento: 180}
  # due torri singole AK-100 da 100 mm sovrapposte sull'asse, canne verso poppa
  - {tipo: tuga, nome: base_ak100, x0: {prua: 197.0}, x1: {prua: 187.0}, y0: -4.5, y1: 4.5, z0: 10.0, z1: 12.1}
  - {tipo: torre_singola, nome: ak100_superiore, x: {prua: 191.0}, z0: 12.1, altezza: 2.9, verso: -1}
  - {tipo: torre_singola, nome: ak100_inferiore, x: {prua: 203.2}, z0: 10.0, altezza: 2.4, verso: -1}

