    soglia_cielo: 200
    cancella: [[352, 1158, 462, 1218]]      # numero 065
    soglia_schiuma: 175
    fotocamera_iniziale: {posizione: [0, 2000, 15], bersaglio: [0, 0, 10], f: 20600}
    orizzonte_punti: [[30, 1070], [700, 1057], [2300, 1026], [2500, 1022]]
    punti:
      - [[{prua: 0}, 0, 14.6], [62, 1100]]          # dritto in coperta
      - [[{prua: 15.0}, 0, 0.7], [219, 1240]]       # piede del dritto (bordo della schiuma)
      - [[{prua: 252}, 11.7, 7.1], [2656, 1128]]     # specchio di poppa, spigolo di sinistra in coperta
      - [[{prua: 138.0}, 0, 50.7], [1474, 699]]     # cima dell'albero prodiero
      - [[{prua: 158.6}, 0, 36.0], [1694, 850]]     # cima dell'albero poppiero (pennone)
      - [[{prua: 174.3}, 0, 28.2], [1848, 928]]     # sommita' del Top Dome
      - [[{prua: 191.0}, 0, 15.0], [2027, 1059]]    # cielo della torre AK-100 superiore
      - [[{prua: 203.2}, 0, 12.4], [2153, 1085]]    # cielo della torre AK-100 inferiore
  - nome: prua_dritta
    file: extracted/navi/kirov/foto/prua_dritta_1985.jpg
    nave: Kirov (065), 30/10/1985, alla fonda
    maschera_file: extracted/navi/kirov/maschere/prua_dritta_1985_maschera.png   # classi/kirov_maschere.yaml (metodo cielo)
