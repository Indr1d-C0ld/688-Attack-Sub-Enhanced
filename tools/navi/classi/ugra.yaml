      - [[{prua: 141.4}, 0, 7.5], [1120, 305]]       # poppa in coperta
      - [[{prua: 30.0}, 8.0, 16.0], [455, 237]]      # spigolo prodiero alto di sinistra del blocco della plancia
      - [[{prua: 51.8}, 0, 25.2], [598, 95]]         # cima del radar sull'albero
      - [[{prua: 66.9}, 0, 15.5], [700, 232]]        # spigolo prodiero del cielo del fumaiolo
      - [[{prua: 89.0}, 0, 18.3], [861, 196]]        # cima dell'albero poppiero
      - [[{prua: 105.6}, 0, 12.6], [955, 263]]       # cielo del binato poppiero
