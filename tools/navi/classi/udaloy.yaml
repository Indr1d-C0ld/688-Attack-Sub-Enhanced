    punti:
      - [[{prua: 0}, 0, 9.8], [2850, 844]]           # dritto di prua in coperta
      - [[{prua: 163.5}, -9.0, 7.0], [80, 1090]]     # spigolo poppiero di dritta del ponte di volo
      - [[{prua: 98.0}, 0, 30.5], [1320, 500]]       # cima dell'albero poppiero (Top Plate)
      - [[{prua: 77.5}, 0, 28.2], [1652, 544]]       # cima dell'albero maestro
