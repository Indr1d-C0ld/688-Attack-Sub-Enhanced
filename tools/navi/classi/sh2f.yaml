# Elicottero SH-2F Seasprite (LAMPS I), configurazione 1989: l'elicottero imbarcato delle Knox (e delle navi senza
# hangar per l'SH-60B). Oggetto in volo (vista: volante). Prima usava lo sprite dell'SH-60B (SEGNAPOSTO).
# Coordinate del kit: x verso prua, y verso sinistra, z verso l'alto, metri; il modello sta tutto sopra z = 0, col
# ventre della fusoliera a z = 8,15 come l'SH-60B. {prua: d} = punto a d metri dal muso.
# Misure: fusoliera 12,3 m, rotore principale 13,41 m a 4 pale, rotore di coda 2,46 m sul lato sinistro della deriva
# (dati del Seasprite; STIMA dove le fonti divergono); il profilo dalla foto di dritta dell'HSL-33 (18/4/1988, ~134 px/m).
nome: SH-2F Seasprite (LAMPS I)
uscita: extracted/navi/sh2f
moduli_parti: [elicotteri_parti.py]
vista: {volante: true, elevazioni: [0, 10, 25], centro: [0.0, 0.0, 9.4]}
albedo: {traliccio: 0.6}

# la fusoliera: sezioni [d dal muso, z basso, z alto, semilarghezza, esponente], quote dal ventre
scafo:
  generatore: fusoliera
  L: 12.3
  z0: 8.15
  sezioni:
    - [0.00, 0.17, 0.32, 0.15, 2.0]
    - [0.40, 0.04, 0.66, 0.50, 2.2]
    - [1.00, -0.07, 1.33, 0.80, 2.5]
    - [1.80, -0.09, 1.78, 1.00, 3.0]
    - [3.00, -0.05, 1.79, 1.05, 3.5]
    - [5.00, 0.00, 1.74, 1.05, 3.5]
    - [7.00, 0.01, 1.63, 1.00, 3.2]
    - [8.50, 0.04, 1.47, 0.80, 2.8]
    - [10.00, 0.10, 1.44, 0.60, 2.4]
    - [11.30, 0.21, 1.33, 0.45, 2.2]
    - [12.30, 0.43, 1.18, 0.30, 2.0]

parti:
  # carenatura del rotore e gondole dei motori ai lati
  - {tipo: fusoliera, nome: carenatura, L: 12.3, z0: 8.15, sezioni: [[3.1, 1.7, 1.9, 0.5, 3], [3.6, 1.7, 2.6, 0.8, 3], [6.2, 1.6, 2.72, 0.85, 3], [7.1, 1.5, 2.0, 0.5, 2.5]]}
  - {tipo: tubo, nome: motore_sinistro, x0: {prua: 6.6}, x1: {prua: 4.6}, y: 1.0, z: 10.33, r: 0.38}
  - {tipo: tubo, nome: motore_destro, x0: {prua: 6.6}, x1: {prua: 4.6}, y: -1.0, z: 10.33, r: 0.38}
  # la deriva inclinata all'indietro, col rotore di coda a sinistra; lo stabilizzatore
  - {tipo: deriva_y, nome: deriva, y: 0.0, spessore: 0.3, profilo: [[{prua: 11.6}, 9.3], [{prua: 12.3}, 9.33], [{prua: 13.0}, 11.15], [{prua: 12.6}, 11.15]]}
  - {tipo: piano, nome: stabilizzatore, z: 9.5, spessore: 0.1, beccheggio: 0, profilo: [[{prua: 11.0}, -1.4], [{prua: 11.0}, 1.4], [{prua: 11.7}, 1.4], [{prua: 11.7}, -1.4]]}
  # albero e testa del rotore principale
  - {tipo: cilindro, nome: albero_rotore, x: {prua: 4.13}, y: 0, r: 0.22, z0: 10.8, z1: 11.3}
  - {tipo: cilindro, nome: testa_rotore, x: {prua: 4.13}, y: 0, r: 0.6, z0: 11.2, z1: 11.5, mat: scuro}
  # carrello: le ruote principali sotto la cabina, il ruotino di coda; il radome sotto il mento
  - {tipo: ruota, nome: ruota_destra, x: {prua: 3.3}, y: -1.2, z: 7.55, r: 0.3, larghezza: 0.2}
  - {tipo: ruota, nome: ruota_sinistra, x: {prua: 3.3}, y: 1.2, z: 7.55, r: 0.3, larghezza: 0.2}
  - {tipo: ruota, nome: ruotino, x: {prua: 8.6}, y: 0, z: 7.2, r: 0.25, larghezza: 0.15}
  - {tipo: tubo_inclinato, nome: gamba_ruotino, da: [{prua: 8.6}, 0, 7.2], a: [{prua: 8.4}, 0, 8.2], r: 0.07, mat: scuro}
  - {tipo: ellissoide, nome: radome, x: {prua: 3.5}, y: 0, z: 7.6, rx: 0.6, ry: 0.5, rz: 0.22}
  # il serbatoio esterno (o il Mk 46) sul pilone di dritta
  - {tipo: tubo_inclinato, nome: serbatoio, da: [{prua: 5.5}, -1.25, 7.75], a: [{prua: 8.6}, -1.25, 7.75], r: 0.25}
  # rotori in moto: dischi puntinati
  - {tipo: disco_rotore, nome: rotore_principale, x: {prua: 4.13}, y: 0, z: 11.4, raggio: 6.7, normale: [0.052, 0, 0.9986], conicita: 3, densita: 0.22, lato: 0.12, raggio_interno: 0.6, seme: 1, mat: traliccio, spessore: 0.22, inclinazione: 25}
  - {tipo: disco_rotore, nome: rotore_coda, x: {prua: 12.4}, y: 0.4, z: 10.8, raggio: 1.23, normale: [0, 1, 0], conicita: 0, densita: 0.25, lato: 0.08, raggio_interno: 0.15, seme: 2, mat: traliccio}

foto:
  - nome: fianco_dritto_1988
    file: extracted/navi/sh2f/foto/Kaman_SH-2F_Seasprite_of_HSL-33_in_flight_on_18_April_1988_(6430152).jpg
    nave: SH-2F dell'HSL-33, 18/4/1988 (US Navy, pubblico dominio), di dritta
    qualita: 1.0
    specchiabile: true
    # la maschera e' la sagoma del modello calibrato sui punti senza i rotori, erosa di 3 px (contorno_modello.py)
    maschera_file: extracted/navi/sh2f/foto/fianco_dritto_1988_maschera.png
    solo_punti: true
    riquadro: [150, 600, 2150, 1300]
    fotocamera_iniziale: {posizione: [-5, -150, 9.5], bersaglio: [0, 0, 9.5], f: 20000}
    limiti_fotocamera: {elevazione: [-15, 15], distanza: [20, 2000], focale: [1000, 200000]}
    punti:
      - [[{prua: 0}, 0, 8.4], [1945, 1084]]          # punta del muso
      - [[{prua: 12.93}, 0, 11.11], [213, 721]]      # cima della deriva
      - [[{prua: 4.13}, 0, 11.43], [1392, 679]]      # testa del rotore
      - [[{prua: 3.1}, 0, 10.87], [1530, 753]]       # fronte della carenatura in cima
      - [[{prua: 1.8}, 0, 8.06], [1704, 1130]]       # ventre sotto la cabina
      - [[{prua: 12.3}, 0, 8.58], [297, 1060]]       # fine del cono di coda, in basso
      - [[{prua: 5.2}, -0.9, 10.33], [1245, 826]]    # presa d'aria del motore di dritta
