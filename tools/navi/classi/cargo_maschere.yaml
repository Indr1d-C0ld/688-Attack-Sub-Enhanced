            [560, 330], [690, 230], [700, 225], [930, 170], [1040, 170], [1050, 280], [1262, 255], [1266, 110],
            [1300, 110], [1302, 290], [1440, 460], [1520, 548], [1520, 640], [1440, 720], [1360, 826], [40, 720]]
