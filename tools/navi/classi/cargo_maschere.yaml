# Maschere tracciate a mano per le foto della nave da carico (tools/navi/maschera_manuale.py).
# Coordinate in pixel delle miniature da 1920 px. Dentro l'inviluppo e' nave cio' che e' poco blu: il cielo ha
# B - (R+G)/2 tra 24 e 44, torri delle gru e cassero bianchi circa 0, container verdi e case delle gru rosse
# negativi. Lo scafo (blu scuro su una foto) e' il poligono `includi`, tra la linea di coperta e il
# galleggiamento (o il bordo della banchina che lo copre). Foto della Hauge: metodo cielo (vedi sotto).
---
# Cpl. Louis J. Hauge Jr., 16/08/1990, prua di dritta da una banchina (fotocamera a ~5 m sull'acqua)
