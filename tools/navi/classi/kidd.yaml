# Cacciatorpediniere lanciamissili classe Kidd (DDG-993), scafo tipo Spruance, configurazione 1989.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua (x = L/2 - d).
# Misure: quote ed elementi principali (dritto, specchio, cime degli alberi, torri Mk45, hangar) da
# triangolazione su tre foto calibrate insieme (tools/navi/triangola.py: Kidd 1990 prua dritta, Chandler
# 1988 poppa dritta, Kidd 1987 prua sinistra; errori 2,6 / 1,4 / 1,2 px). Posizioni di mack, alberi,
# radar e sovrastrutture retroproiettate dalle foto calibrate (scala ~0,07-0,09 m/pixel sulla foto della
# Kidd 1990). Parti specifiche (Mk26, Mk45, SPS-48, mack, Harpoon) nate per questa classe, ora in kit.py.
nome: Kidd (DDG-993)
uscita: extracted/navi/kidd

scafo:
  L: 171.7
  B: 16.8
  # coperta: castello alto a prua con forte cavallino, ponte principale ~5,1 m, ponte di poppa
  # ribassato (~3,7 m) per gli ultimi 22 m
  bordo: [[0, 7.3], [6, 7.1], [12, 6.8], [28, 6.1], [60, 5.3], [149.0, 5.1], [150.0, 3.7], [171.7, 3.7]]
  slancio: 8.1
  finezza_prua: 50
  specchio: 0.79
  svasatura: 0.06
  pienezza: [0.8, 0.5]

parti:
  # --- prua: Mk45 prodiero e Mk26 prodiero
  - {tipo: cannone_mk45, nome: mk45_prodiero, x: {prua: 32.1}, z0: 6.2, altezza: 2.8, lunghezza: 4.8, verso: 1}
  - {tipo: tuga, nome: deposito_mk26_prodiero, x0: {prua: 50.5}, x1: {prua: 41.0}, y0: -3.5, y1: 3.5, z0: 5.3, z1: 6.0}
  - {tipo: lanciatore_mk26, nome: mk26_prodiero, x: {prua: 45.8}, z0: 6.0, verso: 1, elevazione: 40}
  # --- sovrastruttura continua dalla plancia all'hangar (livelli 01-03)
  - {tipo: tuga, nome: tuga_principale, x0: {prua: 100.0}, x1: {prua: 54.0}, y0: -6.9, y1: 6.9, z0: 5.1, z1: 13.2, rastrema: 0.99}
  - {tipo: tuga, nome: hangar, x0: {prua: 117.2}, x1: {prua: 100.0}, y0: -7.3, y1: 7.3, z0: 5.1, z1: 13.9, rastrema: 0.99}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 54.3}, x1: {prua: 53.8}, y0: -6.6, y1: 6.6, z0: 11.8, z1: 12.6, mat: nero, rastrema: 0.99}
  - {tipo: tuga, nome: tuga_sotto_albero_prodiero, x0: {prua: 68.5}, x1: {prua: 56.0}, y0: -4.5, y1: 4.5, z0: 13.2, z1: 17.2, rastrema: 0.97}
  # --- mack prodiero (fumaiolo spostato a sinistra) e albero prodiero con SPS-49
  - {tipo: mack, nome: mack_prodiero, x0: {prua: 77.5}, x1: {prua: 69.0}, y0: -0.2, y1: 6.2, z0: 13.2, z1: 19.0, cappello: 1.8}
  - {tipo: traliccio, nome: albero_prodiero, x: {prua: 62.6}, base: 5.0, cima: 1.4, z0: 17.2, z1: 31.5, piani: [24.8, 31.5]}
  - {tipo: pennone, nome: pennone_prodiero, x: {prua: 62.6}, z: 31.5, semilunghezza: 5.5}
  - {tipo: asta, nome: alberetto_prodiero, da: [{prua: 62.6}, 0, 31.5], a: [{prua: 62.1}, 0, 40.5], spessore: 0.5}
  # piattaforme a sbalzo verso prua: SPS-49 sulla superiore, radome (SATCOM) sull'inferiore
  - {tipo: scatola, nome: piattaforma_sps49, x0: {prua: 63.0}, x1: {prua: 54.0}, y0: -2.6, y1: 2.6, z0: 24.9, z1: 25.3, mat: traliccio}
  - {tipo: asta, nome: puntone_sps49, da: [{prua: 62.0}, 0, 19.6], a: [{prua: 55.0}, 0, 24.9], spessore: 0.4}
  - {tipo: antenna_radar, nome: sps49, x: {prua: 56.0}, z0: 25.3, larghezza: 7.3, altezza: 4.0, orientamento: 30}
  - {tipo: scatola, nome: piattaforma_radome, x0: {prua: 62.5}, x1: {prua: 54.8}, y0: -2.2, y1: 2.2, z0: 19.2, z1: 19.6, mat: traliccio}
  - {tipo: sfera, nome: radome_albero_prodiero, x: {prua: 56.4}, y: 0, z: 20.9, r: 1.3}
  - {tipo: ciws, nome: phalanx_prodiero, x: {prua: 56.5}, y: -4.0, z0: 13.2}
  # --- Harpoon tra i mack (due lanciatori quadrupli)
  - {tipo: harpoon, nome: harpoon_dritta, x: {prua: 82.0}, y: -4.8, z0: 13.2, verso: -1}
  - {tipo: harpoon, nome: harpoon_sinistra, x: {prua: 82.0}, y: 4.8, z0: 13.2, verso: 1}
  # --- mack poppiero: base dell'albero e fumaiolo spostato a dritta
  - {tipo: mack, nome: base_albero_poppiero, x0: {prua: 100.0}, x1: {prua: 87.0}, y0: -3.5, y1: 3.5, z0: 13.2, z1: 18.8, cappello: 1.8, scarichi: 0}
  - {tipo: mack, nome: mack_poppiero, x0: {prua: 113.0}, x1: {prua: 103.5}, y0: -6.4, y1: 0.0, z0: 13.9, z1: 19.0, cappello: 2.2}
  - {tipo: traliccio, nome: albero_poppiero, x: {prua: 91.0}, base: 4.5, cima: 1.2, z0: 18.8, z1: 35.0, piani: [27.0, 35.0]}
  - {tipo: pennone, nome: pennone_poppiero, x: {prua: 91.0}, z: 35.0, semilunghezza: 4.5}
  - {tipo: asta, nome: alberetto_poppiero, da: [{prua: 91.0}, 0, 35.0], a: [{prua: 91.0}, 0, 39.0], spessore: 0.6}
  - {tipo: scatola, nome: coffa_poppiera, x0: {prua: 92.0}, x1: {prua: 90.0}, y0: -1.0, y1: 1.0, z0: 39.0, z1: 40.3, mat: traliccio}
  # SPS-48 (antenna rotante) su piattaforma a sbalzo verso poppa; orientata a 45 gradi come compromesso
  - {tipo: scatola, nome: piattaforma_sps48, x0: {prua: 97.0}, x1: {prua: 90.0}, y0: -2.4, y1: 2.4, z0: 26.6, z1: 27.0, mat: traliccio}
  - {tipo: sps48, nome: sps48, x: {prua: 95.0}, z0: 28.2, larghezza: 5.4, altezza: 6.2, inclinazione: 15, verso: -1, orientamento: 45}
  - {tipo: imbarcazione, nome: lancia_dritta, x0: {prua: 101.0}, x1: {prua: 93.5}, y: -7.4, z0: 7.4}
  # --- hangar, Phalanx poppiero, ponte di volo
  - {tipo: tuga, nome: piattaforma_phalanx_poppiero, x0: {prua: 119.0}, x1: {prua: 114.0}, y0: -1.0, y1: 5.5, z0: 13.9, z1: 17.3}
  - {tipo: ciws, nome: phalanx_poppiero, x: {prua: 116.6}, y: 2.5, z0: 17.3}
  - {tipo: tuga, nome: ponte_di_volo, x0: {prua: 137.0}, x1: {prua: 117.2}, y0: -7.6, y1: 7.6, z0: 5.1, z1: 8.3}
  # --- poppa: Mk26 poppiero e Mk45 poppiero sul ponte ribassato
  - {tipo: tuga, nome: deposito_mk26_poppiero, x0: {prua: 154.0}, x1: {prua: 142.0}, y0: -4.5, y1: 4.5, z0: 5.1, z1: 5.9}
  - {tipo: lanciatore_mk26, nome: mk26_poppiero, x: {prua: 149.5}, z0: 5.9, verso: -1, elevazione: 50}
  - {tipo: cannone_mk45, nome: mk45_poppiero, x: {prua: 158.4}, z0: 3.7, altezza: 2.8, lunghezza: 4.8, verso: -1}

