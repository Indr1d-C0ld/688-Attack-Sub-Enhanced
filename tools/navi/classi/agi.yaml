# Nave raccolta informazioni (AGI) classe Okean: peschereccio laterale da pesca costruito in RDT (Volkswerft
# Stralsund, 1959-61) e convertito in nave da ricognizione. Configurazione modellata: la LINZA durante
# l'esercitazione NATO Northern Wedding del 1986 (7 foto US Navy di pubblico dominio, extracted/navi/agi/foto).
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua.
#
# Misure: L 50,8 m e B 8,8 m (fonti in extracted/navi/agi/RAPPORTO.md); profilo, sovrastrutture e alberi dalla
# foto di fianco calibrata (fianco_dritta, circa 49,4 pixel/m), quote corrette per l'inclinazione dell'orizzonte;
# alberi, radome e plancia triangolati su sei foto (extracted/navi/agi/triangolazione/). Le larghezze delle
# sovrastrutture sono stimate dalle foto di prua.
# Quote: la triangolazione (ancorata all'orizzonte e al piede del dritto) dava quote circa 0,6 m piu' basse di
# quelle misurate sulla foto di fianco; con quei valori, in tutte e sei le foto la carena scura usciva sotto il
# galleggiamento del modello. Tutte le quote sono state alzate di 0,6 m (vedi RAPPORTO.md).
# Particolarita' della LINZA (gruppo Linza/Lotlin/Reduktor/Zond): la tuga di coperta (ponte di riparo) va da
# murata a murata dalla poppa a 18,6 m dalla prua; a dritta ha una galleria aperta (fascia scura), a sinistra
# la murata e' chiusa. Il modello la fa piena da entrambi i lati: la galleria la dipinge la foto.
nome: AGI classe Okean (LINZA, 1986)
uscita: extracted/navi/agi
moduli_parti: [agi_parti.py]

scafo:
  L: 50.8
  B: 8.8
  # orlo della murata: castello a prua, pozzo prodiero basso (2,85 m), ponte di riparo da 18,6 m a poppa
  bordo: [[0, 4.7], [3, 4.2], [6.3, 3.7], [10.4, 3.25], [14, 3], [18.3, 2.85], [18.7, 3.9], [26, 4.15], [33, 4.45], [42, 4.65], [50.8, 4.7]]
  slancio: 2.7
  finezza_prua: 19
  specchio: 0.35
  lunghezza_poppa: 9
  svasatura: 0.10
  pienezza: [0.85, 0.55]

parti:
  # chiusura sotto il dritto slanciato (stessi parametri dello scafo)
  - {tipo: chiusura_dritto, nome: chiusura_dritto, L: 50.8, B: 8.8, bordo: [[0, 4.7], [3, 4.2], [6.3, 3.7], [10.4, 3.25], [14, 3], [18.3, 2.85], [18.7, 3.9], [26, 4.15], [33, 4.45], [42, 4.65], [50.8, 4.7]], slancio: 2.7, finezza_prua: 19, specchio: 0.35, lunghezza_poppa: 9, svasatura: 0.10, pienezza: [0.85, 0.55]}
  # poppa tonda chiara (nessuna foto la vede di fronte, vedi agi_parti.py)
  - {tipo: pannello_poppa, nome: pannello_poppa, L: 50.8, B: 8.8, bordo: [[0, 4.7], [3, 4.2], [6.3, 3.7], [10.4, 3.25], [14, 3], [18.3, 2.85], [18.7, 3.9], [26, 4.15], [33, 4.45], [42, 4.65], [50.8, 4.7]], slancio: 2.7, finezza_prua: 19, specchio: 0.35, lunghezza_poppa: 9, svasatura: 0.10, pienezza: [0.85, 0.55]}
  # salpancore sul castello
  - {tipo: verricello, nome: salpancore, x: {prua: 3.6}, z0: 4.2, larghezza: 2.2, r: 0.35, lunghezza: 1.2}
  # verricello del pozzo prodiero (ex verricello da traino), davanti alla tuga di coperta
  - {tipo: verricello, nome: verricello_prua, x: {prua: 15.7}, z0: 2.85, larghezza: 3.4, r: 0.4, lunghezza: 1.4}
  # albero prodiero: palo con il bipode (due puntoni verso prua ai lati del pozzo), radome piccolo, crocette e gabbia
  - {tipo: asta, nome: albero_prua_basso, da: [{prua: 12.9}, 0, 2.9], a: [{prua: 13.4}, 0, 10.8], spessore: 0.65, mat: sovrastruttura}
  - {tipo: asta, nome: albero_prua_alto, da: [{prua: 13.4}, 0, 10.8], a: [{prua: 14.0}, 0, 18.3], spessore: 0.35, mat: sovrastruttura}
  - {tipo: asta, nome: puntone_dritta, da: [{prua: 13.4}, -0.2, 10.6], a: [{prua: 9.8}, -3.0, 3.3], spessore: 0.35, mat: sovrastruttura}
  - {tipo: asta, nome: puntone_sinistra, da: [{prua: 13.4}, 0.2, 10.6], a: [{prua: 9.8}, 3.0, 3.3], spessore: 0.35, mat: sovrastruttura}
  - {tipo: pennone, nome: crocetta_prua, x: {prua: 13.9}, z: 16.9, semilunghezza: 0.9}
  - {tipo: pennone, nome: crocetta_prua_bassa, x: {prua: 13.7}, z: 14.9, semilunghezza: 0.7}
  - {tipo: cilindro, nome: radome_albero, x: {prua: 12.6}, y: 0, r: 0.35, z0: 11.6, z1: 12.3, mat: bianco, n: 10}
  - {tipo: sfera, nome: radome_albero_cupola, x: {prua: 12.6}, y: 0, z: 12.3, r: 0.35, mat: bianco, n: 8, mezza: true}
  - {tipo: sfera_filo, nome: sfera_prua, x: {prua: 14.0}, z: 17.6, r: 0.65}
  # bigo bianco orizzontale dall'albero prodiero alla plancia
  - {tipo: asta, nome: bigo, da: [{prua: 13.8}, 0, 4.8], a: [{prua: 25.0}, 0, 4.8], spessore: 0.3, mat: bianco}
  # tuga bianca: plancia a prua (fronte inclinato, cielo a 7,8 m), parte poppiera piu' bassa con le zattere sul cielo
  - {tipo: tuga, nome: plancia, x0: {prua: 31.2}, x1: {prua: 25.5}, y0: -2.8, y1: 2.8, z0: 4.2, z1: 7.8, smusso_prua: 0.8, rastrema: 0.92, mat: bianco}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 26.3}, x1: {prua: 25.95}, y0: -2.3, y1: 2.3, z0: 6.3, z1: 6.8, mat: nero}
  - {tipo: tuga, nome: tuga_poppiera, x0: {prua: 34.3}, x1: {prua: 31.2}, y0: -2.8, y1: 2.8, z0: 4.5, z1: 6.9, mat: bianco}
  - {tipo: tubo, nome: zattere_dritta, x0: {prua: 33.8}, x1: {prua: 29.6}, y: -2.3, z: 7.2, r: 0.3, mat: bianco}
  - {tipo: tubo, nome: zattere_sinistra, x0: {prua: 33.8}, x1: {prua: 29.6}, y: 2.3, z: 7.2, r: 0.3, mat: bianco}
  # casotto grigio a volta sopra la tuga (sala apparati e cassa dei fumi: il fumo esce da qui nelle foto)
  - {tipo: casotto_tondo, nome: casotto, x0: {prua: 33.5}, x1: {prua: 31.2}, y0: -1.6, y1: 1.6, z0: 6.9, z1: 9.95}
  - {tipo: tuga, nome: casotto_prodiero, x0: {prua: 31.2}, x1: {prua: 29.4}, y0: -1.1, y1: 1.1, z0: 7.8, z1: 9.8}
  # fumaiolo: scarico corto sul cielo del casotto, lato sinistro (il fumo esce da qui nelle foto di dritta e di sinistra)
  - {tipo: cilindro, nome: fumaiolo, x: {prua: 33.0}, y: 0.6, r: 0.3, z0: 9.0, z1: 10.25, mat: scuro, n: 10}
  # cupola radar su colonna bianca sul cielo della plancia, e radar di navigazione
  - {tipo: cilindro, nome: radome_colonna, x: {prua: 29.9}, y: 2.6, r: 0.28, z0: 6.9, z1: 10.5, mat: bianco, n: 10}
  - {tipo: cilindro, nome: radome, x: {prua: 29.9}, y: 2.6, r: 0.5, z0: 10.4, z1: 11, mat: sovrastruttura, n: 12}
  - {tipo: sfera, nome: radome_cupola, x: {prua: 29.9}, y: 2.6, z: 11, r: 0.5, mat: sovrastruttura, n: 10, mezza: true}
  - {tipo: cilindro, nome: radar_nav_colonna, x: {prua: 29.2}, y: 0, r: 0.15, z0: 9.8, z1: 10.7, mat: scuro, n: 8}
  - {tipo: scatola, nome: radar_nav, x0: {prua: 29.4}, x1: {prua: 29.0}, y0: -0.9, y1: 0.9, z0: 10.7, z1: 10.9, mat: scuro}
  # antenne ad anello su pali sopra la tuga
  - {tipo: anello, nome: anello_poppiero, x: {prua: 34.0}, z: 11.4, r: 0.45, orientamento: 90, palo: 0.15, palo_base: 6.9}
  # albero poppiero (palo leggermente inclinato a poppa) con il braccio poppiero, crocetta e gabbia
  - {tipo: asta, nome: albero_poppa_basso, da: [{prua: 41.9}, 0, 4.6], a: [{prua: 42.7}, 0, 12.2], spessore: 0.6, mat: sovrastruttura}
  - {tipo: asta, nome: albero_poppa_alto, da: [{prua: 42.7}, 0, 12.2], a: [{prua: 43.6}, 0, 17.7], spessore: 0.32, mat: sovrastruttura}
  - {tipo: asta, nome: braccio_poppa, da: [{prua: 42.7}, 0, 12.2], a: [{prua: 45.0}, 0, 12], spessore: 0.3, mat: sovrastruttura}
  - {tipo: pennone, nome: crocetta_poppa, x: {prua: 43.6}, z: 16.8, semilunghezza: 0.9}
  - {tipo: sfera_filo, nome: sfera_poppa, x: {prua: 43.7}, z: 17.4, r: 0.65}
  # lance sotto le gruette a gravita' ai lati del ponte di riparo
  - {tipo: imbarcazione, nome: lancia_dritta, x0: {prua: 43.9}, x1: {prua: 36.4}, y: -3.0, z0: 5.35, larghezza: 2.3, altezza: 1.8}
  - {tipo: imbarcazione, nome: lancia_sinistra, x0: {prua: 43.9}, x1: {prua: 36.4}, y: 3.0, z0: 5.35, larghezza: 2.3, altezza: 1.8}
  - {tipo: gru_lancia, nome: gruetta_dritta_poppa, x: {prua: 45.4}, y: -3.4, z0: 4.65, altezza: 3.7}
  - {tipo: gru_lancia, nome: gruetta_dritta_prua, x: {prua: 35.2}, y: -3.4, z0: 4.55, altezza: 3.7}
  - {tipo: gru_lancia, nome: gruetta_sinistra_poppa, x: {prua: 45.4}, y: 3.4, z0: 4.65, altezza: 3.7}
  - {tipo: gru_lancia, nome: gruetta_sinistra_prua, x: {prua: 35.2}, y: 3.4, z0: 4.55, altezza: 3.7}
  # verricello di poppa
  - {tipo: verricello, nome: verricello_poppa, x: {prua: 48.6}, z0: 4.75, larghezza: 3.0, r: 0.45, lunghezza: 1.4}

