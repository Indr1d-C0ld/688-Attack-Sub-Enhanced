    specchiabile: true      # usata anche riflessa per il lato opposto
    file: extracted/prototipo_perry/foto/fianco_sinistro.jpg
    nave: USS Nicholas (FFG-47), 1984
    qualita: 1.0
    orizzonte_y: 367
    soglia_cielo: 185
    soglia_mare: 135
    mare_fino_a_y: 436
    riquadro: [60, 200, 880, 440]
    cancella: [[118, 398, 156, 420], [824, 404, 843, 416]]
    fotocamera_iniziale: {posizione: [0, 1500, 4], bersaglio: [0, 0, 12], f: 8500}
    punti:
      - [[{prua: 63.8}, 0, 35.8], [435, 230]]   # cima dell'alberetto
      - [[{prua: 0}, 0, 8.9], [70, 384]]        # dritto di prua in coperta
      - [[{prua: 9.2}, 0, 0], [122, 435]]       # dritto al galleggiamento
