# Fregata classe Oliver Hazard Perry (FFG-7), scafo lungo (FFG-36 e successive), configurazione 1989.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua (x = L/2 - d).
# Posizioni e quote delle sovrastrutture misurate sulla foto di fianco della USS Nicholas (1984),
# scala 0,175 m/pixel; da confrontare con i piani d'epoca prima dell'uso definitivo.
nome: Oliver Hazard Perry (FFG-7, scafo lungo)
uscita: extracted/navi/perry

scafo:
  L: 138.1
  B: 13.7
  bordo: [[0, 8.9], [20, 7.9], [49, 5.8], [138.1, 5.8]]   # quota della coperta lungo lo scafo
  slancio: 9.2           # arretramento del dritto di prua al galleggiamento
  finezza_prua: 40
  specchio: 0.82
  svasatura: 0.04
  pienezza: [0.8, 0.45]  # prua fine al galleggiamento, svasata in coperta

parti:
  - {tipo: tuga, nome: tuga_prodiera, x0: {prua: 66.0}, x1: {prua: 40.2}, y0: -6.0, y1: 6.0, z0: 5.8, z1: 13.6, rastrema: 0.93}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 42.3}, x1: {prua: 40.0}, y0: -5.85, y1: 5.85, z0: 12.0, z1: 12.8, mat: nero, rastrema: 0.95}
  - {tipo: radome, nome: radome_mk92, x: {prua: 46.7}, z: 18.5, r: 1.5}
  - {tipo: lanciatore, nome: lanciatore_mk13, x: {prua: 30.0}, z0: 6.5, altezza: 5.4, braccio: 3.5}
  - {tipo: traliccio, nome: supporto_sps49, x: {prua: 54.2}, base: 2.6, cima: 1.2, z0: 13.6, z1: 21.0, piani: [17.5]}
  - {tipo: antenna_radar, nome: sps49, x: {prua: 54.2}, z0: 21.0, larghezza: 7.3, altezza: 4.2, orientamento: 90}
  - {tipo: traliccio, nome: albero_principale, x: {prua: 63.8}, base: 5.5, cima: 1.0, z0: 13.6, z1: 29.7, piani: [21.5, 25.5, 29.7]}
  - {tipo: pennone, nome: pennone, x: {prua: 63.8}, z: 28.0, semilunghezza: 6.0}   # misurato sulla foto di prua
  - {tipo: asta, nome: alberetto, da: [{prua: 63.8}, 0, 29.7], a: [{prua: 63.8}, 0, 35.8], spessore: 0.3}
  - {tipo: tuga, nome: tuga_centrale_hangar, x0: {prua: 111.9}, x1: {prua: 66.0}, y0: -6.3, y1: 6.3, z0: 5.8, z1: 12.2, rastrema: 0.97}
  - {tipo: cilindro, nome: stir_supporto, x: {prua: 73.4}, y: 0, r: 1.0, z0: 12.2, z1: 14.4}
  - {tipo: cilindro, nome: stir, x: {prua: 73.4}, y: 0, r: 1.3, z0: 14.4, z1: 15.3, mat: bianco}
  - {tipo: cannone, nome: cannone_mk75, x: {prua: 83.0}, z0: 12.2, torretta: [3.0, 2.8, 1.2], canna: 4.5}
  - {tipo: fumaiolo, nome: fumaiolo, x0: {prua: 97.0}, x1: {prua: 91.0}, semilarghezza: 2.4, z0: 12.2, z1: 13.4}
  - {tipo: ciws, nome: phalanx, x: {prua: 107.5}, z0: 12.2}
  - {tipo: imbarcazione, nome: lancia_sinistra, x0: {prua: 73.5}, x1: {prua: 66.5}, y: 5.4, z0: 9.0}
  - {tipo: imbarcazione, nome: lancia_dritta, x0: {prua: 73.5}, x1: {prua: 66.5}, y: -5.4, z0: 9.0}

# Foto di riferimento (pubblico dominio, NARA/DVIC; metadati in extracted/prototipo_perry/foto/fonti.json).
