    fotocamera_iniziale: {posizione: [450, 0, 35], bersaglio: [0, 0, 8], f: 7000}
    punti:
      - [[{prua: 63.8}, 0, 35.8], [454, 174]]   # cima dell'alberetto
      - [[{prua: 46.7}, 0, 18.5], [461, 470]]   # centro del radome
      - [[{prua: 0}, 0, 8.9], [477, 686]]       # dritto di prua in coperta
      - [[{prua: 40.2}, -5.6, 13.6], [358, 570]]  # tetto della plancia, spigolo di dritta
      - [[{prua: 40.2}, 5.6, 13.6], [565, 570]]   # tetto della plancia, spigolo di sinistra
      - [[{prua: 63.8}, -6.0, 28.0], [351, 306]]  # pennone, estremita' di dritta
      - [[{prua: 63.8}, 6.0, 28.0], [559, 306]]   # pennone, estremita' di sinistra
