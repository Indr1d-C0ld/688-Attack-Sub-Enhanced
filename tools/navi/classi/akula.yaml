# Sottomarino d'attacco Progetto 971 "Shchuka-B" (NATO: Akula I), configurazione 1989 (K-284, K-263, K-322, K-480):
# scafo doppio largo con prua tonda, vela lunga e bassa con fronte ripido, cielo piatto leggermente inclinato verso
# poppa e lungo raccordo poppiero, grande pod dell'array rimorchiato in cima al timone verticale.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua. Quote assolute rispetto al galleggiamento in emersione normale.
nome: Akula I (Progetto 971)
uscita: extracted/navi/akula
tono: 0.22
contrasto: 0.12
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  L: 110.3
  B: 13.6
  # raggio e asse dal profilo di riferimento (vedi RAPPORTO.md): prua tonda e corta, cilindro fino a ~59 m,
  # poppa con la linea di coperta che scende piano e la carena che risale verso il mozzo
  raggio: [[0.0, 0.0], [0.7, 2.5], [2.4, 4.6], [5.3, 5.9], [8.2, 6.5], [11.1, 6.8], [59.1, 6.8], [74.7, 6.1], [86.3, 5.5],
           [92.1, 4.6], [95.0, 3.85], [97.9, 2.8], [103.7, 1.2], [108.3, 0.4], [110.3, 0.0]]
  asse: [[0.0, -3.3], [59.1, -3.3], [74.7, -3.9], [86.3, -4.2], [92.1, -4.2], [95.0, -4.05], [97.9, -3.6], [103.7, -3.5], [110.3, -3.3]]
  stazioni: 100
  punti_sezione: 48

parti:
  - tipo: vela
    nome: vela
    pianta: ovale
    esponente: 3.0
    livelli:
      - [2.5, {prua: 31.9}, {prua: 62.1}, 2.6]
      - [3.5, {prua: 32.2}, {prua: 59.7}, 2.55]
      - [4.3, {prua: 32.8}, {prua: 58.0}, 2.5]
      - [5.5, {prua: 33.6}, {prua: 55.7}, 2.4]
      - [6.6, {prua: 34.2}, {prua: 52.2}, 2.25]
      - [7.2, {prua: 34.6}, {prua: 48.6}, 2.0]
      - [7.4, {prua: 35.0}, {prua: 44.6}, 1.7]
  # alberi e periscopi alzati come nella foto di fianco del 1990
  - {tipo: cilindro, nome: albero_1, x: {prua: 38.0}, y: 0, r: 0.15, z0: 6.5, z1: 11.3, n: 6, mat: scuro}
  - {tipo: cilindro, nome: periscopio, x: {prua: 45.5}, y: 0, r: 0.3, z0: 6.5, z1: 12.3, n: 8, mat: scuro}
  - {tipo: cilindro, nome: antenna, x: {prua: 46.9}, y: 0, r: 0.12, z0: 6.5, z1: 13.0, n: 6, mat: scuro}
  - {tipo: cilindro, nome: albero_cono, x: {prua: 48.2}, y: 0, r: 0.25, z0: 6.5, z1: 12.2, n: 8, mat: scuro}
  # pod dell'array rimorchiato sul timone verticale
  - {tipo: timone_verticale, nome: timone_pod, x: {prua: 97.5}, z0: -2.0, z1: 4.0, corda: 4.5, corda_estremita: 4.8, spessore: 0.8, freccia: -0.8, pod: [{prua: 94.5}, 4.0, 10.5, 2.6], muso_pod: 0.3, coda_pod: 0.45}

foto:
  - nome: fianco_sinistro
    file: extracted/navi/akula/foto/fianco_sinistro_1990.jpg
    maschera_file: extracted/navi/akula/foto/fianco_sinistro_1990_maschera.png   # classi/akula_maschere.yaml
    nave: Akula I non identificato, 1/4/1990 (DN-SN-91-00616)
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [0, 1000, 300], bersaglio: [0, 0, 3], f: 15000}
    prior_fotocamera: {elevazione: 12, sigma_el: 4}
    limiti_fotocamera: {azimut: [50, 130], elevazione: [5, 30], rollio: [-10, 10]}
    punti:
      - [[{prua: 1.3}, 0, 0.0], [82, 700]]        # prua al galleggiamento
      - [[{prua: 34.6}, 0, 7.4], [665, 612]]      # spigolo prodiero del cielo della vela
      - [[{prua: 59.7}, 0, 3.5], [1065, 702]]     # piede del raccordo poppiero della vela
      - [[{prua: 94.5}, 0, 4.0], [1590, 715]]     # muso del pod
      - [[{prua: 105.0}, 0, 4.0], [1750, 722]]    # coda del pod
      - [[{prua: 45.5}, 0, 12.3], [850, 532]]     # cima del periscopio a bulbo
      - [[{prua: 48.2}, 0, 12.2], [894, 535]]     # cima dell'albero a cono
  - nome: poppa_dritta_aerea
    file: extracted/navi/akula/foto/poppa_dritta_aerea.jpg
    maschera_file: extracted/navi/akula/foto/poppa_dritta_aerea_maschera.png   # classi/akula_maschere.yaml
    nave: Akula I non identificato, Baltico (DD-ST-89-11764)
    esponente_peso: 1.0
    qualita: 0.9
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [-300, -250, 250], bersaglio: [0, 0, 3], f: 5000}
    prior_fotocamera: {elevazione: 30, sigma_el: 6, distanza: 1500, sigma_logD: 0.5}
    affondamento: 1.0
    escludi_parti: [albero_1, periscopio, antenna, albero_cono]   # alberi alzati diversamente
    limiti_fotocamera: {azimut: [-175, -95], elevazione: [12, 60], rollio: [-15, 15], mira_z: [-40, 40]}
    punti:
      - [[{prua: 1.3}, 0, 0.0], [1735, 262]]      # prua al galleggiamento
      - [[{prua: 34.6}, 0, 7.4], [1318, 218]]     # spigolo prodiero del cielo della vela
      - [[{prua: 32.2}, 0, 3.5], [1328, 300]]     # piede del fronte della vela
      - [[{prua: 94.5}, 0, 4.0], [455, 470]]      # muso del pod
      - [[{prua: 105.0}, 0, 4.0], [300, 507]]     # coda del pod
