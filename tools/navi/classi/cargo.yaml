  # cassero poppiero (alloggi): blocco principale, prolungamento a sinistra fino quasi allo specchio, ponte di
  # comando, timoneria con alette, fumaiolo (cima nera), albero del radar e radome a sinistra dell'asse
  - {tipo: tuga, nome: cassero, x0: {prua: 214.0}, x1: {prua: 173.0}, y0: -13.4, y1: 13.4, z0: 14.3, z1: 27.5, mat: bianco, rastrema: 0.995}
  - {tipo: tuga, nome: cassero_sinistra, x0: {prua: 228.5}, x1: {prua: 214.0}, y0: 0.0, y1: 12.0, z0: 14.3, z1: 26.5, mat: bianco}
  - {tipo: tuga, nome: ponte_comando, x0: {prua: 213.0}, x1: {prua: 186.0}, y0: -10.0, y1: 10.0, z0: 27.5, z1: 31.0, mat: bianco, rastrema: 0.99}
  - {tipo: tuga, nome: timoneria, x0: {prua: 204.0}, x1: {prua: 192.0}, y0: -8.0, y1: 8.0, z0: 31.0, z1: 34.5, mat: bianco, rastrema: 0.98}
  - {tipo: scatola, nome: finestre_timoneria, x0: {prua: 192.4}, x1: {prua: 191.9}, y0: -7.6, y1: 7.6, z0: 32.3, z1: 33.7, mat: scuro}
  - {tipo: scatola, nome: alette_plancia, x0: {prua: 195.0}, x1: {prua: 192.0}, y0: -13.0, y1: 13.0, z0: 30.8, z1: 31.4, mat: bianco}
  - {tipo: fumaiolo, nome: fumaiolo, x0: {prua: 208.0}, x1: {prua: 202.5}, semilarghezza: 3.2, z0: 31.0, z1: 36.4, rastrema: 0.95}
  - {tipo: scatola, nome: cima_fumaiolo, x0: {prua: 207.8}, x1: {prua: 202.7}, y0: -3.0, y1: 3.0, z0: 36.4, z1: 37.7, mat: nero}
  - {tipo: asta, nome: albero_radar, da: [{prua: 200.4}, 0, 34.5], a: [{prua: 200.4}, 0, 43.7], spessore: 0.5}
  - {tipo: pennone, nome: pennone_radar, x: {prua: 200.4}, z: 41.0, semilunghezza: 2.5}
  - {tipo: asta, nome: sostegno_radome, da: [{prua: 200.8}, 2.9, 34.5], a: [{prua: 200.8}, 2.9, 38.6], spessore: 0.4}
  - {tipo: sfera, nome: radome, x: {prua: 200.8}, y: 2.9, z: 38.4, r: 1.5}
  # ponte di volo per elicotteri sopra la poppa (sporge di qualche metro oltre lo specchio), su pilastri
  - {tipo: ponte_volo, nome: ponte_volo, x0: {prua: 234.0}, x1: {prua: 213.5}, y0: -12.8, y1: 12.8, z: 31.8, z_base: 26.5}
  # rampa di poppa al giardinetto di dritta, sollevata (posizione di navigazione)
  - {tipo: scatola, nome: rampa_poppa, x0: {prua: 229.5}, x1: {prua: 226.5}, y0: -10.5, y1: -3.0, z0: 14.3, z1: 30.0, mat: scuro}

