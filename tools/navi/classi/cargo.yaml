# Nave da carico civile "Cargo Ship" (tipo 0x02 del gioco): portacontainer/ro-ro classe Cpl. Louis J. Hauge Jr.
# (cinque navi Maersk costruite a Odense nel 1979-80, noleggiate dal Military Sealift Command come navi di
# preposizionamento dal 1984-85; equipaggio civile Maersk, aspetto da mercantile). Configurazione 1985-1990, con
# container in coperta come nella foto della Hauge del 1990.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua (x = L/2 - d).
# Lunghezza, larghezza e immersione ufficiali (755'5" x 90'0" x 33'10"). Quote e posizioni ricavate dalla
# triangolazione su cinque foto (tools/navi/triangola.py) e dai raggi delle fotocamere calibrate intersecati con
# i piani della murata e dell'asse; dettagli in extracted/navi/cargo/RAPPORTO.md.
# Parti proprie (torri delle gru, pile di container, ponte di volo) in classi/cargo_parti.py.
nome: Cpl. Louis J. Hauge Jr. (T-AK 3000), portacontainer/ro-ro
uscita: extracted/navi/cargo
moduli_parti: [cargo_parti.py]

scafo:
  L: 230.25
  B: 27.43
  bordo: [[0, 16.6], [30, 16.8], [190, 16.8], [194, 14.3], [230.25, 14.3]]
  slancio: 11.3
  finezza_prua: 55
  specchio: 0.25        # specchio a V (23/10/2026): stretto al galleggiamento, largo in coperta; verificato
  specchio_alto: 0.88   # sulla foto di poppa della Baugh (prima: specchio verticale 0,88, che finiva fuori dallo scafo)
  svasatura: 0.03
  pienezza: [0.9, 0.8]
  prua_segue_dritto: true
  bagnasciuga: 2.2

parti:
  - {tipo: chiusura_dritto, nome: chiusura_dritto, L: 230.25, B: 27.43, bordo: [[0, 16.6], [30, 16.8], [190, 16.8], [194, 14.3], [230.25, 14.3]],
     slancio: 11.3, finezza_prua: 55, specchio: 0.88, svasatura: 0.03, pienezza: [0.9, 0.8], prua_segue_dritto: true, bagnasciuga: 2.2}
  # boccaporti (coperchi) lungo tutta la zona di carico
  - {tipo: scatola, nome: boccaporti, x0: {prua: 166.0}, x1: {prua: 10.0}, y0: -11.2, y1: 11.2, z0: 16.0, z1: 17.6, mat: ponte}
  # container in coperta: 3 strati (pila stretta) tra l'albero prodiero e la gru 3, 2 nelle stive centrali, 3 davanti al cassero
  - {tipo: pila_container, nome: container_b, x0: {prua: 50.0}, x1: {prua: 28.0}, y0: -5.5, y1: 5.5, z0: 17.6, strati: 3}
  - {tipo: pila_container, nome: container_c, x0: {prua: 86.0}, x1: {prua: 61.0}, y0: -9.8, y1: 9.8, z0: 17.6, strati: 2}
  - {tipo: pila_container, nome: container_d, x0: {prua: 126.5}, x1: {prua: 97.0}, y0: -9.8, y1: 9.8, z0: 17.6, strati: 2}
  - {tipo: pila_container, nome: container_e, x0: {prua: 166.0}, x1: {prua: 137.5}, y0: -9.8, y1: 9.8, z0: 17.6, strati: 3}
  # case delle gru (rosse) e torri con braccio abbassato verso poppa (posizioni e quote dalla triangolazione)
  - {tipo: scatola, nome: casa_gru_3, x0: {prua: 60.3}, x1: {prua: 50.3}, y0: -7.0, y1: 7.0, z0: 16.0, z1: 24.0, mat: scafo}
  - {tipo: scatola, nome: casa_gru_2, x0: {prua: 96.9}, x1: {prua: 86.9}, y0: -7.0, y1: 7.0, z0: 16.0, z1: 24.5, mat: scafo}
  - {tipo: scatola, nome: casa_gru_1, x0: {prua: 139.2}, x1: {prua: 129.2}, y0: -7.0, y1: 7.0, z0: 16.0, z1: 25.0, mat: scafo}
  - {tipo: torre_gru, nome: gru_3, x: {prua: 55.3}, z0: 24.0, z1: 46.1, z_braccio: 30.5, z_punta: 29.0, braccio: 36.0}
  - {tipo: torre_gru, nome: gru_2, x: {prua: 91.9}, z0: 24.5, z1: 46.0, z_braccio: 30.5, z_punta: 29.0, braccio: 40.0}
  - {tipo: torre_gru, nome: gru_1, x: {prua: 134.2}, z0: 25.0, z1: 40.1, z_braccio: 30.5, z_punta: 29.0, braccio: 37.0}
