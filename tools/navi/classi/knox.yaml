# Fregata antisom classe Knox (FF-1052), configurazione 1989: il castello alto con la murata di prua, il pezzo da 127/54
# Mk 42, il lanciatore ASROC a otto celle (anche Harpoon) davanti alla plancia, il «mack» cilindrico a centro nave con
# l'albero, l'SPS-40 e l'SPS-10, la sovrastruttura poppiera con l'hangar del LAMPS, il ponte di volo e sul cassero di poppa
# il lanciatore BPDMS (Sea Sparrow) a otto celle.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri; {prua: d} =
# punto a d metri dalla prua. Misure: 134,0 x 14,25 m (dossier docs/ricerca/32_firme_lotto2.md); posizioni e quote
# misurate sulla foto di sinistra della USS Knox del 9/12/1981 (DoD, un poco dall'alto, ~14,9 px/m), affinate con gli
# scarti della calibrazione (STIMA dove la foto non arriva). Modello proprio approvato il 30/10/2026.
nome: Knox (FF-1052)
uscita: extracted/navi/knox

scafo:
  L: 134.0
  B: 14.25
  bordo: [[0, 10.2], [26, 9.6], [27.5, 7.6], [60, 7.3], [102, 7.0], [104, 4.6], [134.0, 4.3]]
  slancio: 7.6
  finezza_prua: 48
  specchio: 0.78
  svasatura: 0.06
  pienezza: [0.8, 0.45]

parti:
  # ---------------- il castello: il pezzo Mk 42 e l'ASROC
  - {tipo: cannone, nome: mk42, x: {prua: 24.5}, z0: 9.2, torretta: [4.6, 3.6, 2.4], canna: 6.0, verso: 1}
  - {tipo: tuga, nome: basamento_asroc, x0: {prua: 42.0}, x1: {prua: 35.5}, y0: -2.2, y1: 2.2, z0: 7.4, z1: 8.2}
  - {tipo: scatola, nome: asroc, x0: {prua: 41.8}, x1: {prua: 35.9}, y0: -1.6, y1: 1.6, z0: 8.2, z1: 10.7}
  # ---------------- la sovrastruttura prodiera e la plancia
  - {tipo: tuga, nome: tuga_prodiera, x0: {prua: 66.0}, x1: {prua: 42.4}, y0: -6.0, y1: 6.0, z0: 7.3, z1: 12.8, rastrema: 0.98}
  - {tipo: tuga, nome: plancia, x0: {prua: 52.0}, x1: {prua: 44.4}, y0: -5.4, y1: 5.4, z0: 12.8, z1: 15.6, rastrema: 0.95}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 44.8}, x1: {prua: 44.3}, y0: -4.8, y1: 4.8, z0: 14.2, z1: 15.0, mat: nero, rastrema: 0.98}
  - {tipo: direttore_tiro, nome: mk68, x: {prua: 50.0}, z0: 15.6, altezza_base: 1.2, larghezza: 2.4, disco: 1.4}
  # ---------------- il mack cilindrico, l'albero con l'SPS-40 e l'SPS-10
  - {tipo: cilindro, nome: mack, x: {prua: 70.1}, y: 0, r: 3.3, z0: 10.6, z1: 21.6, n: 18}
  - {tipo: cilindro, nome: mack_cima, x: {prua: 70.1}, y: 0, r: 3.0, z0: 21.6, z1: 22.8, n: 18, mat: nero}
  - {tipo: tuga, nome: mensola_sps40, x0: {prua: 69.0}, x1: {prua: 65.5}, y0: -1.5, y1: 1.5, z0: 22.0, z1: 23.6, mat: nero}
  - {tipo: antenna_radar, nome: sps40, x: {prua: 67.1}, z0: 25.4, larghezza: 5.6, altezza: 2.6, orientamento: 60}
  - {tipo: cilindro, nome: colonna_sps40, x: {prua: 67.1}, y: 0, r: 0.5, z0: 23.6, z1: 25.4, mat: nero}
  - {tipo: traliccio, nome: albero, x: {prua: 73.6}, base: 2.0, cima: 0.8, z0: 22.8, z1: 30.0, piani: [29.8], mat: nero}
  - {tipo: pennone, nome: pennone, x: {prua: 73.6}, z: 29.0, semilunghezza: 5.5}
  - {tipo: antenna_radar, nome: sps10, x: {prua: 71.6}, z0: 31.8, larghezza: 2.4, altezza: 0.9, orientamento: 20}
  - {tipo: asta, nome: alberetto, da: [{prua: 74.4}, 0, 30.0], a: [{prua: 74.4}, 0, 38.9], spessore: 0.4}
  # ---------------- la sovrastruttura poppiera con l'hangar, le lance
  - {tipo: tuga, nome: tuga_centrale, x0: {prua: 85.0}, x1: {prua: 66.0}, y0: -6.2, y1: 6.2, z0: 7.0, z1: 10.6}
  - {tipo: tuga, nome: tuga_poppiera, x0: {prua: 103.0}, x1: {prua: 85.0}, y0: -6.4, y1: 6.4, z0: 7.0, z1: 12.8, rastrema: 0.98}
  - {tipo: imbarcazione, nome: lancia_sinistra, x0: {prua: 87.0}, x1: {prua: 79.6}, y: 5.8, z0: 8.4}
  - {tipo: imbarcazione, nome: lancia_dritta, x0: {prua: 87.0}, x1: {prua: 79.6}, y: -5.8, z0: 8.4}
  # ---------------- il ponte di volo sopra la struttura poppiera, il BPDMS sul cassero
  - {tipo: tuga, nome: ponte_di_volo, x0: {prua: 122.4}, x1: {prua: 103.0}, y0: -7.0, y1: 7.0, z0: 4.4, z1: 6.4}
  - {tipo: tuga, nome: basamento_bpdms, x0: {prua: 128.0}, x1: {prua: 122.6}, y0: -1.8, y1: 1.8, z0: 4.3, z1: 6.9}
  - {tipo: scatola, nome: bpdms, x0: {prua: 129.5}, x1: {prua: 124.0}, y0: -1.3, y1: 1.3, z0: 6.9, z1: 9.3, mat: bianco}

# le foto da Wikimedia Commons (permesso dell'utente del 30/10/2026; crediti in foto/crediti.json e nel RAPPORTO)
foto:
  - nome: sinistra_1981
    file: extracted/navi/knox/foto/USS_Knox_(FF-1052)_underway_at_sea_on_9_December_1981_(6349375).jpeg
    nave: USS Knox (FF-1052), 9/12/1981 (DoD, pubblico dominio), di sinistra un poco dall'alto
    qualita: 1.0
    specchiabile: true
    # il mare scuro e lo scafo grigio si staccano, ma la scia bianca no: la maschera e' la sagoma del modello calibrato
    # sui punti, erosa di 3 px (tools/navi/contorno_modello.py --maschera --erodi 3)
    maschera_file: extracted/navi/knox/foto/sinistra_1981_maschera.png
    solo_punti: true
    orizzonte_punti: [[100, 405], [2600, 405]]
    riquadro: [400, 500, 2520, 1200]
    cancella: [[560, 1030, 700, 1085]]   # 1052
    fotocamera_iniziale: {posizione: [200, 1500, 250], bersaglio: [0, 0, 8], f: 8000}
    limiti_fotocamera: {elevazione: [-3, 30], distanza: [300, 6000], focale: [2000, 60000]}
    punti:
      - [[{prua: 0}, 0, 10.2], [455, 999]]            # dritto di prua in coperta (murata)
      - [[{prua: 7.6}, 0, 0.0], [568, 1149]]          # piede del dritto al galleggiamento
      - [[{prua: 134.0}, 5.6, 4.3], [2455, 1050]]     # specchio, spigolo di sinistra in coperta
      - [[{prua: 74.4}, 0, 38.9], [1565, 555]]        # cima dell'alberetto
      - [[{prua: 70.1}, 0, 22.8], [1500, 795]]        # cima del mack, al centro
      - [[{prua: 35.9}, 1.6, 10.7], [990, 980]]       # spigolo prodiero alto di sinistra dell'ASROC
      - [[{prua: 122.4}, 7.0, 6.4], [2290, 1026]]     # spigolo poppiero di sinistra del ponte di volo
      - [[{prua: 124.0}, 1.3, 9.3], [2294, 978]]      # spigolo prodiero alto di sinistra del BPDMS
