# Corazzata classe Iowa (BB-61), configurazione della riattivazione (1984-1991).
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua (x = L/2 - d).
# Quote e posizioni misurate sulla foto di fianco dritto della USS Iowa (1984), con la fotocamera calibrata
# (riproiezione dei pixel sul piano di simmetria); larghezze da controllare con le foto di prua e di poppa.
nome: Iowa (BB-61), riattivazione anni '80
uscita: extracted/navi/iowa
moduli_parti: [iowa_parti.py]

scafo:
  L: 270.4
  B: 33.0
  # coperta misurata sulla foto di fianco calibrata (riproiezione sul piano di simmetria); a prua il
  # parapetto rialzato dello scafo (circa 2,5 m sopra la coperta) fino a 6 m dalla prua
  bordo: [[0, 13.0], [5.5, 12.9], [6.5, 10.4], [12.7, 9.9], [17.8, 9.6], [23, 9.4], [28, 9.1], [33, 8.7], [38, 8.3], [43, 7.9], [48.5, 7.6], [60, 7.3], [100, 7.1], [220, 7.0], [240, 7.2], [255, 7.4], [270.4, 7.9]]
  slancio: 6.8
  finezza_prua: 95
  specchio: 0.35
  svasatura: 0.03
  pienezza: [0.75, 0.55]
  bagnasciuga: 1.5

parti:
  # riempimento sotto lo slancio del dritto: lo scafo del kit e' aperto sotto la prua slanciata e da prua si
  # vedevano le facce interne dei fianchi (fessura scura negli sprite a 0 gradi)
  - {tipo: prisma_xz, nome: piede_prua, profilo: [[{prua: 0}, 13.0], [{prua: 6.8}, 0.0], [{prua: 14}, 0.0], [{prua: 14}, 11.0]], y0: -0.5, y1: 0.5, mat: scafo}
  # torri da 16"/50 (casamatte, quote e bocche delle canne misurate sulla foto di fianco)
  - {tipo: torre_trinata, nome: torre_1, x: {prua: 69.7}, z0: 7.4, z_ponte: 7.0, altezza: 3.1, lunghezza: 19.5, canna: 12.0, z_canne: 1.5}
  - {tipo: torre_trinata, nome: torre_2, x: {prua: 89.2}, z0: 10.2, z_ponte: 7.0, altezza: 3.1, lunghezza: 17.5, canna: 12.0, z_canne: 1.5}
  - {tipo: torre_trinata, nome: torre_3, x: {prua: 193.5}, z0: 8.0, z_ponte: 7.0, altezza: 3.2, lunghezza: 17.5, canna: 14.3, z_canne: 1.6, verso: -1}
  # asta di bandiera di prua (jackstaff) con pennoncino
  - {tipo: asta, nome: asta_prua, da: [{prua: 17.5}, 0, 9.6], a: [{prua: 17.5}, 0, 23.1], spessore: 0.35}
  - {tipo: pennone, nome: pennoncino_prua, x: {prua: 17.5}, z: 19.5, semilunghezza: 2.5}
  # sovrastruttura a gradoni (livelli 01, 02 e 03/04; quote dei ponti riproiettate dalla foto di fianco)
  - {tipo: tuga, nome: sovrastruttura_01, x0: {prua: 186}, x1: {prua: 96}, y0: -11.5, y1: 11.5, z0: 6.9, z1: 9.9}
  - {tipo: tuga, nome: sovrastruttura_02, x0: {prua: 184}, x1: {prua: 99}, y0: -8.0, y1: 8.0, z0: 9.9, z1: 12.5}
  - {tipo: tuga, nome: gradino_poppiero, x0: {prua: 185.5}, x1: {prua: 182}, y0: -5.0, y1: 5.0, z0: 12.5, z1: 15.2}
  - {tipo: tuga, nome: sovrastruttura_03_prodiera, x0: {prua: 163}, x1: {prua: 99}, y0: -6.0, y1: 6.0, z0: 12.5, z1: 17.6, rastrema: 0.97}
  - {tipo: tuga, nome: sovrastruttura_03_poppiera, x0: {prua: 182}, x1: {prua: 163}, y0: -6.0, y1: 6.0, z0: 12.5, z1: 16.7, rastrema: 0.97}
  - {tipo: tuga, nome: blocco_plancia, x0: {prua: 113.5}, x1: {prua: 99}, y0: -6.5, y1: 6.5, z0: 17.6, z1: 20.3, rastrema: 0.95}
  - {tipo: direttore_mk37, nome: mk37_prodiero, x: {prua: 109}, y: 0, z0: 20.3, altezza_base: 1.3}
  # torre di direzione del tiro prodiera
  - {tipo: tuga, nome: torre_tiro, x0: {prua: 125}, x1: {prua: 115.5}, y0: -4.0, y1: 4.0, z0: 17.6, z1: 33.5, rastrema: 0.85}
  - {tipo: tuga, nome: piattaforma_torre, x0: {prua: 124.5}, x1: {prua: 114}, y0: -4.0, y1: 4.0, z0: 33.5, z1: 35.5}
  - {tipo: tuga, nome: casa_direttore, x0: {prua: 124}, x1: {prua: 116.5}, y0: -3.2, y1: 3.2, z0: 35.5, z1: 38.2}
  - {tipo: direttore_mk38, nome: mk38_prodiero, x: {prua: 118.5}, z0: 38.2, altezza: 1.3}
  # fumaiolo prodiero e albero di trinchetto a traliccio con SPS-49
  - {tipo: fumaiolo_cappello, nome: fumaiolo_1, x0: {prua: 134.5}, x1: {prua: 127}, semilarghezza: 4.2, z0: 17.6, z1: 28.5, cappello: 2.3}
  - {tipo: traliccio, nome: albero_trinchetto, x: {prua: 128.5}, base: 5.5, cima: 3.5, z0: 28.5, z1: 41.8, piani: [41.8]}
  - {tipo: asta, nome: pennone_longitudinale, da: [{prua: 120.2}, 0, 41.8], a: [{prua: 135}, 0, 41.8], spessore: 0.35}
  - {tipo: pennone, nome: pennone_trinchetto, x: {prua: 128.5}, z: 41.8, semilunghezza: 10.5}
  - {tipo: asta, nome: alberetto_trinchetto, da: [{prua: 132.2}, 0, 41.8], a: [{prua: 132.2}, 0, 55.2], spessore: 0.45}
  - {tipo: asta, nome: supporto_sps49, da: [{prua: 128.0}, 0, 41.8], a: [{prua: 128.0}, 0, 44.8], spessore: 0.7}
  - {tipo: antenna_radar, nome: sps49, x: {prua: 128.0}, z0: 44.8, larghezza: 7.3, altezza: 2.5, orientamento: 90}
  # tra i fumaioli e attorno al fumaiolo poppiero: Phalanx su colonnine (due per lato)
  - {tipo: cilindro, nome: colonna_ciws_1d, x: {prua: 146}, y: -6.2, r: 1.1, z0: 17.6, z1: 20.4}
  - {tipo: ciws, nome: phalanx_1d, x: {prua: 146}, y: -6.2, z0: 20.4}
  - {tipo: cilindro, nome: colonna_ciws_2d, x: {prua: 151}, y: -6.2, r: 1.1, z0: 17.6, z1: 20.4}
  - {tipo: ciws, nome: phalanx_2d, x: {prua: 151}, y: -6.2, z0: 20.4}
  - {tipo: cilindro, nome: colonna_ciws_1s, x: {prua: 146}, y: 6.2, r: 1.1, z0: 17.6, z1: 20.4}
  - {tipo: ciws, nome: phalanx_1s, x: {prua: 146}, y: 6.2, z0: 20.4}
  - {tipo: cilindro, nome: colonna_ciws_2s, x: {prua: 151}, y: 6.2, r: 1.1, z0: 17.6, z1: 20.4}
  - {tipo: ciws, nome: phalanx_2s, x: {prua: 151}, y: 6.2, z0: 20.4}
  # fumaiolo poppiero e albero di maestra
  - {tipo: fumaiolo_cappello, nome: fumaiolo_2, x0: {prua: 161}, x1: {prua: 152.5}, semilarghezza: 4.2, z0: 17.6, z1: 27.8, cappello: 2.2}
  - {tipo: asta, nome: albero_maestra, da: [{prua: 151.3}, 0, 17.6], a: [{prua: 151.3}, 0, 35.0], spessore: 0.45}
  - {tipo: pennone, nome: pennone_maestra, x: {prua: 151.3}, z: 31.0, semilunghezza: 3.0}
  # direzione del tiro poppiera
  - {tipo: tuga, nome: base_torre_poppiera, x0: {prua: 175}, x1: {prua: 170}, y0: -3.0, y1: 3.0, z0: 16.7, z1: 20.0}
  - {tipo: cilindro, nome: torre_mk38_poppiero, x: {prua: 172.5}, y: 0, r: 2.3, z0: 20.0, z1: 22.4}
  - {tipo: direttore_mk38, nome: mk38_poppiero, x: {prua: 172.5}, z0: 22.4, altezza: 1.8, verso: -1}
  - {tipo: direttore_mk37, nome: mk37_poppiero, x: {prua: 181.3}, y: 0, z0: 12.5, altezza_base: 3.8, verso: -1}
  # impianti binati da 5"/38: tre per lato (i quattro poppieri sono stati sbarcati nella riattivazione)
  - {tipo: impianto_binato, nome: mk28_1d, x: {prua: 104}, y: -9.8, z0: 9.9}
  - {tipo: impianto_binato, nome: mk28_2d, x: {prua: 117}, y: -9.8, z0: 9.9}
  - {tipo: impianto_binato, nome: mk28_3d, x: {prua: 131}, y: -9.8, z0: 9.9, verso: -1}
  - {tipo: impianto_binato, nome: mk28_1s, x: {prua: 104}, y: 9.8, z0: 9.9}
  - {tipo: impianto_binato, nome: mk28_2s, x: {prua: 117}, y: 9.8, z0: 9.9}
  - {tipo: impianto_binato, nome: mk28_3s, x: {prua: 131}, y: 9.8, z0: 9.9, verso: -1}
  # lanciatori corazzati Tomahawk (8 ABL) e Harpoon (4 x 4) sul livello 02 ai lati
  - {tipo: abl, nome: abl_1d, x: {prua: 140}, y: -9.0, z0: 9.9}
  - {tipo: abl, nome: abl_2d, x: {prua: 147}, y: -9.0, z0: 9.9}
  - {tipo: abl, nome: abl_3d, x: {prua: 160}, y: -7.4, z0: 12.5, verso: -1}
  - {tipo: abl, nome: abl_4d, x: {prua: 167}, y: -7.4, z0: 12.5, verso: -1}
  - {tipo: abl, nome: abl_1s, x: {prua: 140}, y: 9.0, z0: 9.9}
  - {tipo: abl, nome: abl_2s, x: {prua: 147}, y: 9.0, z0: 9.9}
  - {tipo: abl, nome: abl_3s, x: {prua: 160}, y: 7.4, z0: 12.5, verso: -1}
  - {tipo: abl, nome: abl_4s, x: {prua: 167}, y: 7.4, z0: 12.5, verso: -1}
  - {tipo: harpoon, nome: harpoon_d, x: {prua: 176}, y: -7.6, z0: 12.5, verso: -1}
  - {tipo: harpoon, nome: harpoon_s, x: {prua: 176}, y: 7.6, z0: 12.5, verso: -1}

