    punti:
      - [[{prua: 0}, 0, 4.2], [40, 1542]]           # dritto di prua in coperta
      - [[{prua: 3.8}, 0, 0], [230, 1748]]          # piede del dritto al galleggiamento
      - [[{prua: 59.3}, 5.15, 3.15], [2967, 1550]]  # specchio, spigolo di sinistra in coperta
      - [[{prua: 20.7}, 5.5, 8.0], [1045, 1340]]    # lanciatore di sinistra, testata in alto
      - [[{prua: 30.9}, 5.5, 6.7], [1555, 1400]]    # lanciatore di sinistra, estremita' poppiera in alto
      - [[{prua: 18.8}, 0, 9.5], [967, 1267]]       # cima del Pop Group
  - nome: prua_sinistra
    file: extracted/navi/nanuchka/foto/prua_sinistra_vikhr_1988.jpg
    nave: Vikhr (Nanuchka I), 1988
    maschera_file: extracted/navi/nanuchka/foto/prua_sinistra_vikhr_1988_maschera.png   # ritoccata a mano (classi/nanuchka_maschera_fianco.yaml)
    qualita: 0.9
    specchiabile: true
