    punti:
      - [[{prua: 0}, 0, 4.2], [30, 367]]            # dritto di prua in coperta
      - [[{prua: 29.9}, 0, 14.5], [549, 204]]       # sommita' del radome Band Stand
      - [[{prua: 33.8}, 0, 19.7], [635, 103]]       # cima del palo
      - [[{prua: 18.8}, 0, 9.5], [346, 292]]        # cima del Pop Group
      - [[{prua: 20.7}, 5.5, 8.0], [343, 342]]      # lanciatore di sinistra, testata in alto
      - [[{prua: 30.9}, 5.5, 6.7], [527, 373]]      # lanciatore di sinistra, estremita' poppiera in alto
      - [[{prua: 13.3}, 0, 4.4], [248, 378]]        # Osa-M, centro della cupola
      - [[{prua: 49.0}, 0, 7.7], [923, 363]]        # cima del Muff Cob
      - [[{prua: 54.0}, 0, 5.4], [1027, 417]]       # cima della torre da 57 mm
