# Piccola nave missilistica classe Nanuchka I (Progetto 1234 "Ovod"), configurazione 1989.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua.
# Misure: scafo, lanciatori e sovrastruttura prodiera dalla foto di fianco calibrata del Mirazh (1985,
# Nanuchka III, 49,4 pixel/m); radome, albero, Osa-M, Muff Cob e torre da 57 mm triangolati sulle due foto
# della Nanuchka I (Vikhr 1988 e unita' 610 del 1982) con tools/navi/triangola.py
# (extracted/navi/nanuchka/triangolazione/triangola.yaml). Nella Nanuchka III plancia e radome sono piu' a
# prua e l'albero e' diverso: la foto del Mirazh dipinge solo le parti comuni (maschera ritoccata).
nome: Nanuchka I (Progetto 1234)
uscita: extracted/navi/nanuchka
moduli_parti: [nanuchka_parti.py]

scafo:
  L: 59.3
  B: 11.2
  bordo: [[0, 4.2], [10, 3.8], [25, 3.4], [40, 3.2], [59.3, 3.15]]
  slancio: 3.8
  finezza_prua: 24
  specchio: 0.85
  svasatura: 0.12
  pienezza: [1.1, 0.5]

parti:
  # chiusura sotto il dritto slanciato, materiale chiaro (vedi nanuchka_parti.py)
  - {tipo: chiusura_chiara, nome: chiusura_dritto, mat: bianco, L: 59.3, B: 11.2, bordo: [[0, 4.2], [10, 3.8], [25, 3.4], [40, 3.2], [59.3, 3.15]], slancio: 3.8, finezza_prua: 24, specchio: 0.85, svasatura: 0.12, pienezza: [1.1, 0.5]}
  # specchio di poppa piu' chiaro (nessuna foto lo vede: vedi nanuchka_parti.py)
  - {tipo: pannello_specchio, nome: pannello_specchio, mat: bianco, L: 59.3, B: 11.2, bordo: [[0, 4.2], [10, 3.8], [25, 3.4], [40, 3.2], [59.3, 3.15]], slancio: 3.8, finezza_prua: 24, specchio: 0.85, svasatura: 0.12, pienezza: [1.1, 0.5]}
  # Osa-M (SA-N-4) a scomparsa sul castello (portello circolare; cima triangolata a 13,3 m dalla prua)
  - {tipo: lanciatore_scomparsa, nome: osa_m, x: {prua: 13.3}, z0: 3.7, r: 1.4, altezza: 0.2}
  # sovrastruttura prodiera centrale (tra i lanciatori), fronte inclinato. Materiale 'bianco' per tuga e
  # plancia: i fronti verso prua non sono visti da nessuna foto e con 'sovrastruttura' l'ombreggiatura del
  # modello risultava molto piu' scura delle parti dipinte dalle foto.
  - {tipo: tuga, nome: tuga_prodiera, x0: {prua: 34.5}, x1: {prua: 16.1}, y0: -2.6, y1: 2.6, z0: 3.2, z1: 7.4, smusso_prua: 0.8, mat: bianco}
  # lanciatori tripli P-120 Malakhit (SS-N-9), testata prodiera in alto a 8,0 m, coda a 6,7 m
  - {tipo: lanciatore_malakhit, nome: malakhit_sinistra, x0: {prua: 30.9}, x1: {prua: 20.7}, y_int: 2.6, y_est: 5.5, z0: 3.3, elevazione: 7.3, z_base: 0.2}
  - {tipo: lanciatore_malakhit, nome: malakhit_dritta, x0: {prua: 30.9}, x1: {prua: 20.7}, y_int: -2.6, y_est: -5.5, z0: 3.3, elevazione: 7.3, z_base: 0.2}
  # direttore Pop Group (MPZ-301) dell'Osa-M sulla piattaforma prodiera (cima triangolata 9,5 m)
  - {tipo: direttore_tiro, nome: pop_group, x: {prua: 18.8}, z0: 7.4, altezza_base: 0.5, larghezza: 1.6, disco: 1.0}
  # plancia (Nanuchka I: dal centro dei lanciatori fino all'albero) e radome Band Stand sulla parte poppiera
  - {tipo: tuga, nome: plancia, x0: {prua: 31.4}, x1: {prua: 25.0}, y0: -2.4, y1: 2.4, z0: 7.4, z1: 11.0, rastrema: 0.95, smusso_prua: 1.0, mat: bianco}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 26.0}, x1: {prua: 25.6}, y0: -2.0, y1: 2.0, z0: 10.1, z1: 10.5, mat: nero}
  - {tipo: band_stand, nome: band_stand, x: {prua: 29.9}, z0: 11.0, altezza: 1.95, r: 1.55}
  # radar di navigazione sul tetto della plancia
  - {tipo: cilindro, nome: radar_nav_colonna, x: {prua: 26.5}, y: 0.0, r: 0.3, z0: 11.0, z1: 11.8}
  - {tipo: scatola, nome: radar_nav, x0: {prua: 26.7}, x1: {prua: 26.3}, y0: -1.5, y1: 1.5, z0: 11.8, z1: 12.1, mat: scuro}
  # albero a traliccio subito dietro il radome e palo (cima triangolata a 19,7 m, 34,3 m dalla prua)
  - {tipo: traliccio, nome: albero, x: {prua: 32.6}, base: 2.0, cima: 0.9, z0: 7.4, z1: 16.5, piani: [12.0, 16.5]}
  - {tipo: asta, nome: palo, da: [{prua: 32.7}, 0, 16.5], a: [{prua: 33.8}, 0, 19.7], spessore: 0.4, mat: scuro}
  - {tipo: pennone, nome: crocetta, x: {prua: 33.1}, z: 17.8, semilunghezza: 1.6}
  # tuga poppiera bassa con un rialzo dietro l'albero
  - {tipo: tuga, nome: tuga_poppiera, x0: {prua: 50.5}, x1: {prua: 34.5}, y0: -2.9, y1: 2.9, z0: 3.1, z1: 4.9}
  - {tipo: tuga, nome: rialzo_poppiero, x0: {prua: 38.5}, x1: {prua: 34.5}, y0: -2.2, y1: 2.2, z0: 4.9, z1: 6.2}
  # direttore Muff Cob (MR-103) per il 57 mm, all'estremita' poppiera della tuga (cima triangolata 7,7 m)
  - {tipo: direttore_tiro, nome: muff_cob, x: {prua: 49.0}, z0: 4.9, altezza_base: 1.2, larghezza: 1.6, disco: 1.0, orientamento: 180}
  # impianto binato AK-257 (AK-725) da 57 mm a poppa (cima triangolata 5,4 m, 54,0 m dalla prua)
  - {tipo: impianto_chiaro, nome: ak257, mat: bianco, x: {prua: 54.0}, y: 0.0, z0: 3.1, verso: 1, lunghezza: 4.5, larghezza: 2.9, altezza: 2.3, canna: 2.8, smusso: 1.0}

