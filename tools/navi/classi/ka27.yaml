# Elicottero Ka-27PL «Helix-A», configurazione 1989 (pezzo A4 di docs/13_asw_aereo.md): oggetto in volo.
# Coordinate del kit: x verso prua, y verso SINISTRA, z verso l'alto, metri; ventre a z = 8,0.
# {prua: d} = punto a d metri dal muso (L = 11,3 m, la fusoliera senza rotori).
# Misure pubbliche (Wikipedia, «Kamov Ka-27»; dossier 17 §3.2): fusoliera 11,30 m, due rotori coassiali da
# 15,90 m a 3 pale, altezza 5,40 m; fusoliera tozza col radome del radar «Osminog» sotto il muso, carenatura dei
# due TV3-117 sopra la cabina, trave di coda corta col piano orizzontale e le due derive d'estremita', carrello a
# quattro ruote. Misurati sulla foto in volo (extracted/navi/ka27/foto/fonti.json, pubblico dominio US Navy):
# mozzi a 4,3 m dal muso e 1,4 m l'uno dall'altro, derive alte 2,5 m, radome ventrale da 0,4 a 4,4 m, ruote a 2,3
# e 5,5 m.
nome: Ka-27PL Helix-A (1989)
uscita: extracted/navi/ka27
moduli_parti: [elicotteri_parti.py]
vista: {volante: true, elevazioni: [0, 10, 25], centro: [0.0, 0.0, 10.2]}
albedo: {traliccio: 0.6}
tono: 0.55

scafo:
  generatore: fusoliera
  L: 11.3
  z0: 8.0
  sezioni:
    - [0.00, 0.60, 1.20, 0.20, 2.0]
    - [0.35, 0.30, 1.65, 0.70, 2.4]
    - [1.00, 0.10, 1.95, 0.95, 3.0]
    - [1.60, 0.00, 2.05, 1.00, 3.4]
    - [6.00, 0.00, 2.05, 1.00, 3.4]
    - [6.80, 0.35, 1.95, 0.75, 3.0]
    - [8.00, 0.95, 1.75, 0.40, 2.4]
    - [10.40, 1.15, 1.60, 0.28, 2.0]
    - [11.30, 1.25, 1.50, 0.15, 2.0]

parti:
  # carenatura dei motori sopra la cabina con le prese d'aria e gli scarichi
  - {tipo: fusoliera, nome: carenatura, L: 11.3, z0: 8.0, sezioni: [[1.2, 2.05, 2.2, 0.6, 3], [1.8, 2.05, 2.75, 0.95, 3], [5.8, 2.05, 2.8, 0.95, 3], [6.8, 2.05, 2.4, 0.5, 2.5]]}
  - {tipo: tubo, nome: presa_sinistra, x0: {prua: 2.0}, x1: {prua: 1.6}, y: 0.55, z: 10.45, r: 0.3, mat: scuro}
  - {tipo: tubo, nome: presa_destra, x0: {prua: 2.0}, x1: {prua: 1.6}, y: -0.55, z: 10.45, r: 0.3, mat: scuro}
  # radome del radar sotto il muso
  - {tipo: ellissoide, nome: radome, x: {prua: 2.4}, y: 0, z: 7.95, rx: 2.0, ry: 0.85, rz: 0.42}
  # piano di coda con le due derive d'estremita'
  - {tipo: piano, nome: piano_coda, z: 9.6, spessore: 0.1, profilo: [[{prua: 9.9}, -1.85], [{prua: 9.9}, 1.85], [{prua: 11.2}, 1.85], [{prua: 11.2}, -1.85]]}
  - {tipo: deriva_y, nome: deriva_sinistra, y: 1.85, spessore: 0.12, profilo: [[{prua: 9.8}, 8.55], [{prua: 11.35}, 8.8], [{prua: 11.35}, 11.15], [{prua: 9.8}, 11.1]]}
  - {tipo: deriva_y, nome: deriva_destra, y: -1.85, spessore: 0.12, profilo: [[{prua: 9.8}, 8.55], [{prua: 11.35}, 8.8], [{prua: 11.35}, 11.15], [{prua: 9.8}, 11.1]]}
  # albero coassiale coi due mozzi
  - {tipo: cilindro, nome: albero_rotori, x: {prua: 4.3}, y: 0, r: 0.2, z0: 10.8, z1: 13.0}
  - {tipo: cilindro, nome: mozzo_inferiore, x: {prua: 4.3}, y: 0, r: 0.5, z0: 11.3, z1: 11.55, mat: scuro}
  - {tipo: cilindro, nome: mozzo_superiore, x: {prua: 4.3}, y: 0, r: 0.45, z0: 12.7, z1: 13.0, mat: scuro}
  # carrello a quattro ruote, esteso in volo (posizioni misurate sulle foto)
  - {tipo: ruota, nome: ruota_ant_sinistra, x: {prua: 2.3}, y: 0.7, z: 7.2, r: 0.3, larghezza: 0.16}
  - {tipo: ruota, nome: ruota_ant_destra, x: {prua: 2.3}, y: -0.7, z: 7.2, r: 0.3, larghezza: 0.16}
  - {tipo: tubo_inclinato, nome: gamba_ant_sinistra, da: [{prua: 2.3}, 0.65, 7.2], a: [{prua: 2.2}, 0.55, 8.0], r: 0.07, mat: scuro}
  - {tipo: tubo_inclinato, nome: gamba_ant_destra, da: [{prua: 2.3}, -0.65, 7.2], a: [{prua: 2.2}, -0.55, 8.0], r: 0.07, mat: scuro}
  - {tipo: ruota, nome: ruota_post_sinistra, x: {prua: 5.5}, y: 1.6, z: 7.0, r: 0.38, larghezza: 0.2}
  - {tipo: ruota, nome: ruota_post_destra, x: {prua: 5.5}, y: -1.6, z: 7.0, r: 0.38, larghezza: 0.2}
  - {tipo: tubo_inclinato, nome: puntone_sinistro, da: [{prua: 5.5}, 1.5, 7.0], a: [{prua: 5.0}, 0.85, 8.3], r: 0.07, mat: scuro}
  - {tipo: tubo_inclinato, nome: puntone_destro, da: [{prua: 5.5}, -1.5, 7.0], a: [{prua: 5.0}, -0.85, 8.3], r: 0.07, mat: scuro}
  - {tipo: tubo_inclinato, nome: ammortizzatore_sinistro, da: [{prua: 5.5}, 1.5, 7.1], a: [{prua: 5.3}, 0.95, 10.0], r: 0.07, mat: scuro}
  - {tipo: tubo_inclinato, nome: ammortizzatore_destro, da: [{prua: 5.5}, -1.5, 7.1], a: [{prua: 5.3}, -0.95, 10.0], r: 0.07, mat: scuro}
  # rotori coassiali in moto
  - {tipo: disco_rotore, nome: rotore_inferiore, x: {prua: 4.3}, y: 0, z: 11.45, raggio: 7.95, conicita: 3, densita: 0.16, lato: 0.12, raggio_interno: 0.55, seme: 7, mat: traliccio, spessore: 0.25, inclinazione: 25}
  - {tipo: disco_rotore, nome: rotore_superiore, x: {prua: 4.3}, y: 0, z: 12.85, raggio: 7.95, conicita: 3, densita: 0.16, lato: 0.12, raggio_interno: 0.5, seme: 8, mat: traliccio, spessore: 0.25, inclinazione: 25}

# Maschera: tools/navi/maschera_colore_modello.py --solo-sagoma --erodi 2 (calibrazione da 2 px). Punti: muso, mozzi dei due rotori, derive (bordo d'attacco in alto e in basso, d'uscita in alto), ruote.
