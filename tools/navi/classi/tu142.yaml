# Tupolev Tu-142M/MK "Bear-F" (NATO: Bear-F Mod 3 = Tu-142MK, con il MAD in cima alla deriva), Aviazione Navale
# Sovietica, configurazione 1989. Oggetto in volo.
# Coordinate del kit: x verso il muso (origine a meta' lunghezza fuori tutto), y verso sinistra, z verso l'alto.
# {prua: d} = punto a d metri dalla punta della sonda di rifornimento (x = L/2 - d). Asse della fusoliera a z = 10 m.
# Misure pubbliche: lunghezza 53,07 m, apertura 50,0 m, ala a freccia di 35 gradi, quattro NK-12MV con eliche
# controrotanti AV-60 (diametro ~5,6 m), fusoliera di ~2,9 m di diametro.
# La lunghezza fuori tutto va dalla punta della sonda alla punta della carenatura del MAD in cima alla deriva, che
# sporge oltre la torretta di coda (foto del 1982 e del 1987); torretta, deriva, piani di coda, estremita' alari e
# motori triangolati da due foto (tools/navi/classi/tu142_triangolazione.yaml).
nome: Tupolev Tu-142M Bear-F (1989)
uscita: extracted/navi/tu142
moduli_parti: [aerei_parti.py]
vista: {volante: true, elevazioni: [0, 10, 25], centro: [0, 0, 10]}
# dischi delle eliche ('traliccio') chiari: pale sfocate contro il cielo
albedo: {traliccio: 0.72}

scafo:
  generatore: fusoliera
  L: 53.07
  z: 10.0
  # [d dalla punta della sonda, semilarghezza, semialtezza, spostamento verticale del centro]
  profilo:
    - [2.3, 0.0, 0.0, -0.10]
    - [2.6, 0.45, 0.45, -0.10]
    - [3.3, 0.85, 0.85, -0.08]
    - [4.5, 1.18, 1.20, -0.05]
    - [6.0, 1.38, 1.40, 0.0]
    - [7.5, 1.45, 1.45, 0.0]
    - [36.0, 1.45, 1.45, 0.0]
    - [40.0, 1.35, 1.30, 0.06]
    - [43.0, 1.10, 1.05, 0.15]
    - [45.3, 0.80, 0.80, 0.25]
    - [46.5, 0.62, 0.62, 0.30]
    - [47.0, 0.40, 0.40, 0.30]
    - [47.2, 0.0, 0.0, 0.30]

parti:
  - {tipo: corpo, nome: sonda, x_naso: {prua: 0}, z: 11.0, n: 8, profilo: [[0, 0.06], [0.3, 0.12], [3.5, 0.14], [4.5, 0.2]]}
  - {tipo: ellissoide, nome: cabina, x: {prua: 7.0}, y: 0, z: 10.95, a: 2.6, b: 1.15, c: 0.65}
  - {tipo: ellissoide, nome: radome_ventrale, x: {prua: 9.8}, y: 0, z: 8.75, a: 2.6, b: 1.05, c: 0.65}
  # ala a freccia (35 gradi al quarto della corda), corda 8,6 -> 2,9 m, quasi senza diedro
  - {tipo: ala, nome: ala, radice: [{prua: 13.3}, 1.3, 10.0, 8.4], estremita: [{prua: 32.3}, 25.02, 10.2, 2.7], spessore: 0.13, spessore_estremita: 0.11}
  # gondole NK-12MV: lunghe, le interne con la carenatura del carrello oltre il bordo d'uscita
  - {tipo: corpo, nome: gondola_interna, x_naso: {prua: 13.9}, y: 6.2, z: 9.5, simmetrico: true,
     profilo: [[0, 0.55, 0.60], [0.8, 0.80, 0.92], [3.0, 0.86, 1.02, -0.05], [8.0, 0.86, 1.05, -0.15], [12.5, 0.72, 0.85, -0.15], [16.0, 0.25, 0.30, 0.0]]}
  - {tipo: corpo, nome: gondola_esterna, x_naso: {prua: 17.5}, y: 11.4, z: 9.7, simmetrico: true,
     profilo: [[0, 0.55, 0.60], [0.8, 0.78, 0.88], [3.0, 0.82, 0.95, -0.05], [7.0, 0.78, 0.90, -0.05], [10.0, 0.35, 0.40, 0.0]]}
  - {tipo: elica, nome: elica_interna, x: {prua: 13.2}, y: 6.2, z: 9.5, r: 2.8, doppia: 0.75, ogiva: [0.6, 0.5]}
  - {tipo: elica, nome: elica_esterna, x: {prua: 16.8}, y: 11.4, z: 9.7, r: 2.8, doppia: 0.75, ogiva: [0.6, 0.5]}
  # impennaggi a freccia: il piano orizzontale sporge oltre la torretta di coda
  - {tipo: ala, nome: piano_orizzontale, radice: [{prua: 43.4}, 0.6, 10.6, 5.0], estremita: [{prua: 49.5}, 7.6, 11.4, 2.1], spessore: 0.11, spessore_estremita: 0.09}
  - {tipo: ala, nome: deriva, verticale: true, simmetrica: false, radice: [{prua: 40.1}, 0, 11.3, 7.5], estremita: [{prua: 48.3}, 0, 18.5, 3.0], spessore: 0.11, spessore_estremita: 0.09}
  - {tipo: ala, nome: pinna_dorsale, verticale: true, simmetrica: false, radice: [{prua: 35.5}, 0, 11.35, 5.0], estremita: [{prua: 40.6}, 0, 12.6, 1.0], spessore: 0.07}
  # carenatura del MAD in cima alla deriva, verso coda (Tu-142M/MK)
  - {tipo: corpo, nome: carenatura_mad, x_naso: {prua: 48.1}, z: 18.4, n: 10, profilo: [[0, 0.30, 0.32], [4.6, 0.28, 0.28], [4.97, 0.0, 0.0]]}

