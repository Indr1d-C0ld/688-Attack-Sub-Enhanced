    maschera_file: extracted/navi/sh3h/maschere/fianco_sinistro_alto_hs17_1986.png
    qualita: 0.9
    fotocamera_iniziale: {posizione: [0.0, 40.0, 25.0], bersaglio: [0.0, 0.0, 9.6], f: 2600}
