# Incrociatore antisommergibile classe Kara (Progetto 1134B "Berkut-B"), configurazione 1989.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua.
# Misure: elementi principali da triangolazione su quattro foto (prua, piede del dritto, cima della torre,
# cima dell'albero prodiero, spigoli del fumaiolo, galleggiamento); le altre quote e posizioni dalla foto di
# fianco del Nikolayev (1986), ripresa da lontano e quasi al traverso, proiettando i pixel sul piano di
# ciascun elemento con la fotocamera triangolata (vedi extracted/navi/kara/RAPPORTO.md).
# Configurazione di riferimento: Nikolayev, Petropavlovsk, Tashkent (non l'Azov, con l'S-300F di prova).
nome: Kara (Progetto 1134B)
uscita: extracted/navi/kara
moduli_parti: [kara_parti.py]

scafo:
  L: 173.2
  B: 18.6
  # coperta: castello alto a prua (8,3 m), ponte principale basso al centro (~4,2 m), fiancate che salgono
  # fino al ponte di volo poppiero (~6 m) negli ultimi 17 m
  bordo: [[0, 8.3], [11, 6.8], [26, 5.4], [45, 4.6], [74, 4.2], [102, 4.2], [130, 4.4], [150, 5.0], [156, 6.0], [173.2, 6.0]]
  slancio: 8.1
  finezza_prua: 52
  specchio: 0.86
  svasatura: 0.06
  pienezza: [0.9, 0.75]

parti:
  # chiusura sotto il dritto slanciato (stessi parametri dello scafo)
  - {tipo: chiusura_dritto, nome: chiusura_dritto, L: 173.2, B: 18.6, bordo: [[0, 8.3], [11, 6.8], [26, 5.4], [45, 4.6], [74, 4.2], [102, 4.2], [130, 4.4], [150, 5.0], [156, 6.0], [173.2, 6.0]], slancio: 8.1, finezza_prua: 52, specchio: 0.86, svasatura: 0.06, pienezza: [0.9, 0.75]}
  # ---------------- castello di prua
  - {tipo: lanciarazzi_rbu, nome: rbu6000_prodiero, x: {prua: 22.6}, z0: 5.6}
  - {tipo: tuga, nome: tuga_shtorm_prodiero, x0: {prua: 46.5}, x1: {prua: 29.3}, y0: -5.0, y1: 5.0, z0: 4.4, z1: 6.4, rastrema: 0.97}
  - {tipo: lanciarazzi_rbu, nome: rbu6000_poppiero, x: {prua: 31.7}, z0: 6.4}
  # Shtorm (SA-N-3) prodiero: lanciatore binato B-187, bracci verso prua
  - {tipo: shtorm, nome: shtorm_prodiero, x: {prua: 37.4}, z0: 6.4, altezza_base: 2.4, verso: 1}
  # ---------------- plancia e sovrastruttura prodiera
  - {tipo: tuga, nome: tuga_prodiera_01, x0: {prua: 72.0}, x1: {prua: 46.5}, y0: -5.2, y1: 5.2, z0: 4.2, z1: 7.4}
  - {tipo: tuga, nome: plancia, x0: {prua: 58.5}, x1: {prua: 46.5}, y0: -5.0, y1: 5.0, z0: 7.4, z1: 11.8, rastrema: 0.92, smusso_prua: 0.8}
  - {tipo: scatola, nome: finestre_plancia, x0: {prua: 47.6}, x1: {prua: 46.2}, y0: -4.6, y1: 4.6, z0: 10.4, z1: 11.2, mat: nero, rastrema: 0.97}
  - {tipo: cilindro, nome: colonna_head_light_prodiero, x: {prua: 56.6}, y: 0, r: 2.2, z0: 11.8, z1: 14.0}
  - {tipo: head_light, nome: head_light_prodiero, x: {prua: 56.6}, z0: 14.0}
  # Rastrub (SS-N-14) ai lati della plancia, inclinati verso l'alto a prua
  - {tipo: rastrub_inclinato, nome: rastrub_dritta, x0: {prua: 63.8}, x1: {prua: 53.8}, z0: 4.6, y: -7.0, elevazione: 12, larghezza: 3.0, altezza: 3.5}
  - {tipo: rastrub_inclinato, nome: rastrub_sinistra, x0: {prua: 63.8}, x1: {prua: 53.8}, z0: 4.6, y: 7.0, elevazione: 12, larghezza: 3.0, altezza: 3.5}
  # tetto sporgente sopra i vani laterali tra plancia e albero prodiero
  - {tipo: scatola, nome: tetto_vani, x0: {prua: 69.5}, x1: {prua: 57.5}, y0: -8.2, y1: 8.2, z0: 9.2, z1: 10.0}
  - {tipo: sfera, nome: cupola_dritta, x: {prua: 63.6}, y: -6.4, z: 4.6, r: 2.6, mat: sovrastruttura, mezza: true}
  - {tipo: sfera, nome: cupola_sinistra, x: {prua: 63.6}, y: 6.4, z: 4.6, r: 2.6, mat: sovrastruttura, mezza: true}
  # albero prodiero a traliccio con Head Net-C e alberetto inclinato verso poppa
  - {tipo: tuga, nome: tuga_albero_prodiero, x0: {prua: 72.0}, x1: {prua: 61.5}, y0: -4.4, y1: 4.4, z0: 7.4, z1: 14.2, rastrema: 0.95}
  - {tipo: traliccio, nome: albero_prodiero, x: {prua: 69.2}, base: 3.6, cima: 1.2, z0: 14.2, z1: 21.2, piani: [15.4]}
  - {tipo: head_net, nome: head_net, x: {prua: 69.1}, z0: 21.2, larghezza: 6.4, altezza: 1.8}
  - {tipo: asta, nome: alberetto_prodiero, da: [{prua: 71.8}, 0, 15.4], a: [{prua: 74.9}, 0, 27.0], spessore: 0.45}
  # ---------------- centro nave: AK-726, torre con Top Sail, Osa-M, fumaiolo
  - {tipo: tuga, nome: tuga_centrale_01, x0: {prua: 100.0}, x1: {prua: 72.0}, y0: -7.6, y1: 7.6, z0: 4.2, z1: 6.8}
  - {tipo: impianto_binato, nome: ak726_dritta, x: {prua: 80.4}, y: -6.0, z0: 6.8, lunghezza: 4.6, larghezza: 3.2, altezza: 3.4, canna: 4.0, smusso: 1.2}
  - {tipo: impianto_binato, nome: ak726_sinistra, x: {prua: 80.4}, y: 6.0, z0: 6.8, lunghezza: 4.6, larghezza: 3.2, altezza: 3.4, canna: 4.0, smusso: 1.2}
  - {tipo: tuga, nome: tuga_centrale_02, x0: {prua: 98.0}, x1: {prua: 76.0}, y0: -4.2, y1: 4.2, z0: 6.8, z1: 9.0}
  - {tipo: tronco, nome: torre, basso: [{prua: 96.5}, {prua: 87.4}, 3.0], alto: [{prua: 94.0}, {prua: 92.0}, 1.0], z0: 6.8, z1: 28.4}
  - {tipo: albero_palo, nome: alberetto_torre, x: {prua: 93.0}, z0: 28.4, z1: 34.6, r: 0.5}
  - {tipo: top_sail, nome: top_sail, x: {prua: 90.2}, z: 29.0, larghezza: 6.6, altezza: 7.6, inclinazione: 22, orientamento: 30}
  - {tipo: lanciatore_scomparsa, nome: osa_m_dritta, x: {prua: 94.2}, y: -6.0, z0: 4.2, r: 2.7, altezza: 3.6}
  - {tipo: lanciatore_scomparsa, nome: osa_m_sinistra, x: {prua: 94.2}, y: 6.0, z0: 4.2, r: 2.7, altezza: 3.6}
  - {tipo: fumaiolo, nome: fumaiolo, x0: {prua: 109.8}, x1: {prua: 99.5}, semilarghezza: 4.0, z0: 6.8, z1: 17.8, rastrema: 0.98}
  - {tipo: ak630, nome: ak630_dritta_av, x: {prua: 101.5}, y: -6.4, z0: 6.3}
  - {tipo: ak630, nome: ak630_sinistra_av, x: {prua: 101.5}, y: 6.4, z0: 6.3}
  - {tipo: ak630, nome: ak630_dritta_ad, x: {prua: 112.0}, y: -6.4, z0: 6.3}
  - {tipo: ak630, nome: ak630_sinistra_ad, x: {prua: 112.0}, y: 6.4, z0: 6.3}
  # ---------------- sovrastruttura poppiera: Head Light e Shtorm poppieri, hangar, ponte di volo
  - {tipo: tuga, nome: tuga_poppiera_01, x0: {prua: 131.0}, x1: {prua: 99.0}, y0: -6.6, y1: 6.6, z0: 4.2, z1: 6.3}
  - {tipo: tuga, nome: tuga_poppiera_02, x0: {prua: 117.0}, x1: {prua: 109.8}, y0: -4.6, y1: 4.6, z0: 6.3, z1: 10.9, rastrema: 0.96}
  - {tipo: tuga, nome: colonna_head_light_poppiero, x0: {prua: 123.0}, x1: {prua: 117.0}, y0: -2.4, y1: 2.4, z0: 6.3, z1: 11.2, rastrema: 0.9}
  - {tipo: head_light, nome: head_light_poppiero, x: {prua: 120.3}, z0: 11.2, orientamento: 180}
  - {tipo: tuga, nome: tuga_shtorm_poppiero, x0: {prua: 141.0}, x1: {prua: 131.0}, y0: -5.0, y1: 5.0, z0: 4.4, z1: 6.2}
  - {tipo: shtorm, nome: shtorm_poppiero, x: {prua: 136.6}, z0: 6.2, altezza_base: 2.0, verso: -1}
  - {tipo: tuga, nome: hangar, x0: {prua: 153.0}, x1: {prua: 138.2}, y0: -6.0, y1: 6.0, z0: 4.6, z1: 7.8}
  - {tipo: ponte_elicotteri, nome: ponte_volo, x0: {prua: 172.6}, x1: {prua: 153.0}, semilarghezza: 8.6, z: 6.3}

