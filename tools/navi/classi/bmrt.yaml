    file: "extracted/navi/bmrt/foto/БМРТ_АБ-0122_«Амбарчик»_Paljassaare_sadamas_92.jpg"
    nave: BMRT all'ormeggio, Paljassaare (Tallinn), 1992 (CC BY-SA 4.0), di dritta di tre quarti da prua
    qualita: 1.0
    specchiabile: true
    # la maschera e' la sagoma del modello calibrato sui punti, erosa di 2 px (contorno_modello.py --maschera): lascia
    # fuori la gru di banchina, la torre dei fari, le altre navi e la carena scoperta sotto il galleggiamento
    maschera_file: extracted/navi/bmrt/foto/dritta_paljassaare_maschera.png
    solo_punti: true
    # nome e matricola veri tolti: il nome a prua, la sigla con la matricola sulla sovrastruttura
    cancella: [[1302, 563, 1406, 589], [343, 477, 432, 508]]
    riquadro: [30, 170, 1590, 815]
    fotocamera_iniziale: {posizione: [54, -72, 15], bersaglio: [10, 0, 11.6], f: 1570}
    limiti_fotocamera: {elevazione: [-5, 15], distanza: [30, 2000], focale: [300, 20000]}
    punti:
      - [[{prua: 0}, 0, 11.7], [1572, 508]]          # dritto di prua, orlo della murata
      - [[{prua: 5.3}, 0, 1.8], [1431, 737]]         # dritto all'orlo superiore della fascia scura
      - [[{prua: 94.5}, -6.4, 6.0], [48, 556]]       # spigolo di dritta della poppa, orlo della murata
      - [[{prua: 22.8}, -7.3, 9.6], [990, 549]]      # spigolo prodiero alto di dritta della tuga di coperta
      - [[{prua: 65.0}, -6.8, 13.5], [340, 455]]     # spigolo poppiero alto di dritta della sovrastruttura
      - [[{prua: 44.5}, 5.5, 16.6], [745, 398]]      # spigolo prodiero alto di sinistra della plancia (il piu' a destra)
      - [[{prua: 57.8}, -5.6, 19.3], [443, 351]]     # cielo del fumaiolo di dritta
      - [[{prua: 85.7}, -4.5, 16.2], [150, 406]]     # testa di dritta del portale poppiero
      - [[{prua: 28.4}, -2.9, 20.4], [924, 315]]     # testa del picco poppiero di dritta
