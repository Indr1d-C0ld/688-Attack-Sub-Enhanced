# Sottomarino lanciamissili balistici Progetto 941 "Akula" (NATO: Typhoon), configurazione 1989 (sei unita' in
# servizio, TK-208, -202, -12, -13, -17, -20): scafo esterno larghissimo e basso che racchiude due scafi resistenti
# affiancati (sezione ellittica squadrata, ellitticita' 0,74, esponente 3), prua a cupola, ponte dei 20 tubi R-39
# piatto davanti alla vela (bordo libero ~5 m), vela con la grande carenatura alla base, poppa larga che scende sotto l'acqua
# con il timone verticale staccato, timoni prodieri estesi e periscopi alzati (come nelle foto del 1985).
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua. Quote assolute rispetto al galleggiamento in emersione normale.
# Misure: lunghezza 175 m e larghezza 23 m (dossier, [WPTyphoon]); profilo (vela, carenatura, timone, linea del
# ponte) dal disegno di profilo in extracted/navi/typhoon/disegni/ (CC BY-SA, solo consultato per le misure,
# 10,95 px/m, galleggiamento con immersione 12 m), poi verificato sulle foto calibrate.
nome: Typhoon (Progetto 941)
uscita: extracted/navi/typhoon
tono: 0.22
contrasto: 0.12
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  # galleggiamento con l'immersione operativa di 12 m (bordo libero ~5 m sul ponte), come nelle foto del 1985; il
  # battello in disarmo del 1999 galleggia ~5,5 m piu' alto (bagnasciuga fuori dall'acqua): `affondamento` della foto
  dz: &dz 0.0
  L: 175.0
  B: 23.0
  ellitticita: 0.74
  esponente_sezione: 3.0
  # raggio orizzontale: prua a cupola (profilo del disegno), poppa larga che si restringe negli ultimi 50 m
  raggio: [[0.0, 0.0], [0.5, 3.4], [1.0, 4.8], [2.0, 6.4], [3.3, 7.5], [5.0, 8.7], [6.9, 9.8], [10.6, 10.9], [14.2, 11.3],
           [18.0, 11.5], [122.0, 11.5], [128.0, 11.3], [135.0, 10.5], [142.0, 9.8], [149.0, 9.0], [156.0, 8.2],
           [163.0, 7.0], [168.0, 5.5], [172.0, 3.5], [175.0, 0.0]]
  # asse che scende a poppa: la coperta va sotto l'acqua a ~158 m dalla prua (disegno: 4,1 m a 135 m, 1,7 m a 149 m)
  asse: [[0.0, -3.4], [120.0, -3.4], [128.0, -3.5], [135.0, -3.7], [142.0, -4.2], [149.0, -5.0], [156.0, -5.5],
         [165.0, -6.0], [175.0, -6.0]]
  stazioni: 110
  punti_sezione: 64

parti:
  # carenatura alla base della vela (fronte ripido, dorso lungo e dolce)
  - tipo: vela
    nome: carenatura_vela
    pianta: ovale
    esponente: 2.4
    dz: *dz
    livelli:
      - [4.4, {prua: 79.0}, {prua: 122.0}, 5.8]
      - [6.0, {prua: 80.3}, {prua: 120.0}, 5.5]
      - [7.5, {prua: 81.8}, {prua: 116.5}, 4.9]
      - [8.5, {prua: 83.5}, {prua: 112.5}, 4.0]
      - [8.9, {prua: 85.5}, {prua: 109.5}, 3.0]
  # vela: fianchi verticali, cielo piatto a 14,3 m con spigoli arrotondati
  - tipo: vela
    nome: vela
    pianta: ovale
    esponente: 3.0
    dz: *dz
    livelli:
      - [8.0, {prua: 82.6}, {prua: 110.9}, 2.7]
      - [13.6, {prua: 82.6}, {prua: 110.9}, 2.6]
      - [14.1, {prua: 83.1}, {prua: 110.4}, 2.35]
      - [14.3, {prua: 83.8}, {prua: 109.7}, 1.9]
  # periscopi e alberi alzati
  - {tipo: cilindro, nome: albero_1, x: {prua: 92.0}, y: 0.6, r: 0.35, z0: 14.0, z1: 20.5, n: 8, mat: scuro}
  - {tipo: cilindro, nome: albero_2, x: {prua: 95.5}, y: -0.4, r: 0.4, z0: 14.0, z1: 21.2, n: 8, mat: scuro}
  - {tipo: cilindro, nome: albero_3, x: {prua: 103.0}, y: 0.0, r: 0.3, z0: 14.0, z1: 19.3, n: 8, mat: scuro}
  # timone verticale (staccato dallo scafo che a poppa e' gia' sotto l'acqua)
  - {tipo: timone_verticale, nome: timone, x: {prua: 154.6}, z0: -2.0, z1: 10.4, corda: 12.1, corda_estremita: 8.1, spessore: 1.4, freccia: 3.6, dz: *dz}
  # timoni prodieri estesi
  - {tipo: pinna_orizzontale, nome: timoni_prodieri, x: {prua: 16.0}, z: 1.2, dz: *dz, apertura: 16.0, radice: 10.0, corda: 4.0, corda_estremita: 3.2, spessore: 0.6, freccia: 0.5}

foto:
  - nome: poppa_dritta
    file: extracted/navi/typhoon/foto/poppa_dritta_tk202_1985.jpg
    maschera_file: extracted/navi/typhoon/foto/poppa_dritta_tk202_1985_maschera.png   # classi/typhoon_maschere.yaml
    nave: TK-202, 1985
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [-450, -100, 110], bersaglio: [40, 0, -5], f: 12000}
    prior_fotocamera: {elevazione: 22, sigma_el: 8, distanza: 450, sigma_logD: 0.5}
    limiti_fotocamera: {azimut: [-180, -110], elevazione: [5, 45], mira_z: [-60, 60]}
    punti:
      - [[{prua: 162.6}, 0, 10.4], [222, 675]]     # cima del timone
      - [[{prua: 110.6}, 0, 14.3], [624, 300]]     # cielo della vela, estremita' poppiera
      - [[{prua: 82.8}, 0, 14.3], [836, 252]]      # cielo della vela, estremita' prodiera
      - [[{prua: 18.0}, -16.0, 1.2], [1468, 418]]  # estremita' del timone prodiero di dritta
      - [[{prua: 110.9}, 0, 8.7], [600, 495]]      # retro della vela sulla carenatura
  - nome: poppa
    file: extracted/navi/typhoon/foto/poppa_1985.jpg
    maschera_file: extracted/navi/typhoon/foto/poppa_1985_maschera.png   # classi/typhoon_maschere.yaml
    nave: Typhoon non identificato, 1985
    esponente_peso: 1.0
    qualita: 0.9
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [-300, 6, 45], bersaglio: [80, 0, -8], f: 17000}
    prior_fotocamera: {elevazione: 9, sigma_el: 5, distanza: 380, sigma_logD: 0.5}   # cielo della vela molto scorciato: ripresa bassa
    limiti_fotocamera: {azimut: [140, 220], elevazione: [1, 55], mira_z: [-30, 60]}
    punti:
      - [[{prua: 162.6}, 0, 10.4], [1190, 1455]]   # cima del timone
      - [[{prua: 82.8}, 0, 14.3], [1025, 512]]     # cielo della vela, estremita' prodiera
      - [[{prua: 18.0}, 16.0, 1.2], [158, 878]]    # estremita' del timone prodiero di sinistra
      - [[{prua: 18.0}, -16.0, 1.2], [1762, 843]]  # estremita' del timone prodiero di dritta
  - nome: prua_dritta
    file: extracted/navi/typhoon/foto/prua_dritta_tk202_1999.jpg
    maschera_file: extracted/navi/typhoon/foto/prua_dritta_tk202_1999_maschera.png   # classi/typhoon_maschere.yaml
    nave: TK-202 in disarmo a Sevmash, 1999
    esponente_peso: 1.0
    qualita: 0.8
    specchiabile: true
    affondamento: -5.5         # in disarmo e scarico: ~4 m piu' alto dell'emersione operativa, piu' il bagnasciuga
    escludi: [[0, 770, 1700, 1100], [0, 0, 280, 1100]]   # scafo sotto il galleggiamento operativo e poppa: fuori dal modello
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [180, -40, 6], bersaglio: [40, 0, 5], f: 5000}
    prior_fotocamera: {elevazione: 2, sigma_el: 3, distanza: 180, sigma_logD: 0.5}
    limiti_fotocamera: {azimut: [-40, -2], elevazione: [-3, 10], focale: [1500, 30000]}
    punti:
      - [[{prua: 110.6}, 0, 14.3], [375, 400]]     # cielo della vela, estremita' poppiera
      - [[{prua: 82.8}, 0, 14.3], [535, 395]]      # cielo della vela, estremita' prodiera
      - [[{prua: 82.6}, 0, 8.0], [544, 552]]       # fronte della vela sulla carenatura
      - [[{prua: 110.9}, 0, 8.7], [364, 569]]      # retro della vela sulla carenatura
      - [[{prua: 162.6}, 0, 10.4], [237, 597]]     # cima del timone
      - [[{prua: 14.0}, 0, 5.1], [1290, 560]]      # cima della cupola di prua (cucitura centrale) contro il cielo
