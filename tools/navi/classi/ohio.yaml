# Sottomarino lanciamissili balistici USS Ohio (SSBN-726), configurazione 1989: scafo lunghissimo e cilindrico, la
# coperta piatta dei 24 silos dei Trident dietro la vela, la vela a prua coi timoni orizzontali, il timone a croce.
# Misure dal dossier docs/ricerca/32_firme_lotto2.md (170,7 x 12,8 x 10,8 m); la vela, i timoni, le quote della vela e
# della coperta dalle due foto del 1982 (di tre quarti da prua sinistra e da poppa a lunga focale), corrette sugli scarti
# dei punti di calibrazione: la coperta a 3,9 m, la vela a 10 m. Modello proprio approvato dall'utente il 29/10/2026.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua. Quote assolute rispetto al galleggiamento in emersione normale.
nome: Ohio (SSBN-726)
uscita: extracted/navi/ohio
tono: 0.22
contrasto: 0.12
moduli_parti: [sottomarini_parti.py]
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  L: 170.7
  B: 12.8
  # prua quasi emisferica, cilindro lunghissimo, cono di poppa sui 42 m finali (STIMA come il Los Angeles)
  forma: {prua: 14.0, poppa: 42.0, esponente_prua: 2.2, esponente_poppa: 1.5, raggio_coda: 0.35}
  bordo_libero: 3.5        # sommita' dello scafo (immersione 10,8 m su 12,8, piu' la carenatura; dalle foto)
  # la coperta piatta sopra i silos a 3,4 m, larga ~7 m, dalla vela fin oltre i due terzi (la foto: la vela e' il
  # doppio della murata fuori dall'acqua)
  cassero: [[18.0, 3.5, 2.6], [40.0, 3.9, 3.6], [122.0, 3.9, 3.6], [130.0, 3.5, 3.0]]
  stazioni: 120
  punti_sezione: 48

parti:
  # vela alta e stretta, a prua, coi timoni orizzontali a due terzi dell'altezza
  - tipo: vela
    nome: vela
    pianta: naca
    livelli:
      - [2.5, {prua: 29.2}, {prua: 42.0}, 1.3]
      - [10.0, {prua: 29.2}, {prua: 42.0}, 1.3]
  - {tipo: pinna_orizzontale, nome: timoni_vela, x: {prua: 31.0}, z: 7.2, apertura: 6.0, corda: 3.4, corda_estremita: 2.3, spessore: 0.5, freccia: 1.2}
  - {tipo: cilindro, nome: periscopio_ricerca, x: {prua: 34.0}, y: 0, r: 0.24, z0: 10.0, z1: 16.0, n: 8, mat: scuro}
  - {tipo: cilindro, nome: albero, x: {prua: 36.0}, y: 0, r: 0.2, z0: 10.0, z1: 19.0, n: 8, mat: scuro}
  # timone superiore (STIMA in proporzione al Los Angeles)
  - {tipo: timone_verticale, nome: timone, x: {prua: 162.0}, z0: -3.5, z1: 3.4, corda: 5.0, corda_estremita: 2.8, spessore: 0.6, freccia: 1.2}

# le foto da Wikimedia Commons (permesso dell'utente del 29/10/2026; crediti in foto/crediti.json e nel RAPPORTO)
foto:
  - nome: sinistra_prua
    file: extracted/navi/ohio/foto/A_port_beam_view_of_the_nuclear-powered_strategic_missile_submarine_USS_OHIO_SSBN-726_as_the_large_harbor_tugs_MANHATTAN_YTB-779_and_OTTUMWA_YTB-761_escort_it_through_the_Hood_-_DPLA_-_d2a8b26a0d3ae87a7e6924db6ecabf65.jpeg
    nave: USS Ohio (SSBN-726), Hood Canal, 1982 (DoD, pubblico dominio), di tre quarti dal mascone sinistro
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    # i rimorchiatori dietro e lo scafo coi riflessi chiari confondono la maschera automatica: la maschera e' la sagoma
    # del modello calibrato sui punti, erosa di 5 px (tools/navi/contorno_modello.py --maschera --erodi 5)
    maschera_file: extracted/navi/ohio/foto/sinistra_prua_1982_maschera.png
    solo_punti: true
    riquadro: [700, 580, 3000, 1400]
    fotocamera_iniziale: {posizione: [250, 450, 15], bersaglio: [40, 0, 5], f: 5000}   # davanti alla vela, a sinistra
    limiti_fotocamera: {elevazione: [-4, 15], distanza: [100, 3000], focale: [1500, 60000]}
    punti:
      - [[{prua: 4.0}, 0, 0.0], [797, 1344]]        # prua al galleggiamento (la prua tonda: l'acqua a ~4 m dalla punta)
      - [[{prua: 29.2}, 0, 10.0], [1479, 967]]      # spigolo prodiero del cielo della vela
      - [[{prua: 42.0}, 0, 10.0], [1727, 967]]      # spigolo poppiero del cielo della vela
      - [[{prua: 33.0}, -6.0, 7.2], [1390, 1074]]   # estremita' del timone di vela destro (di tre quarti da prua sinistra
      - [[{prua: 33.0}, 6.0, 7.2], [1767, 1078]]    # il destro cade a sinistra nell'immagine), del sinistro
      - [[{prua: 36.0}, 0, 19.0], [1583, 620]]      # cima dell'albero
  - nome: poppa_sinistra_aerea
    file: extracted/navi/ohio/foto/An_aerial_port_quarter_view_of_the_nuclear-powered_strategic_missile_submarine_USS_OHIO_SSBN-726_as_the_large_harbor_tugs_MANHATTAN_YTB-779_and_OTTUMWA_YTB-761_assist_in_docki_-_DPLA_-_77650abe51d6f373b197267b678dae70.jpeg
    nave: USS Ohio (SSBN-726), Bangor, 1982 (DoD, pubblico dominio), da poppa e un po' da sinistra, quasi lungo l'asse, a lunga focale
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    # lo scafo bagnato ha riflessi chiari come il mare: la maschera e' la sagoma del modello calibrato sui punti,
    # erosa di 6 px (tools/navi/contorno_modello.py --maschera --erodi 6), e la calibrazione sui soli punti
    maschera_file: extracted/navi/ohio/foto/poppa_sinistra_aerea_1982_maschera.png
    riquadro: [0, 500, 1550, 2760]
    cancella: [[1000, 1080, 1550, 1700], [0, 2250, 760, 2760]]   # rimorchiatori, banchina
    solo_punti: true
    fotocamera_iniziale: {posizione: [-300, 20, 25], bersaglio: [43, 0, 6], f: 32000}
    limiti_fotocamera: {elevazione: [0.5, 20], distanza: [100, 3000], focale: [3000, 80000]}
    punti:
      - [[{prua: 33.0}, 6.0, 7.2], [35, 925]]       # estremita' del timone di vela sinistro
      - [[{prua: 33.0}, -6.0, 7.2], [1165, 905]]    # estremita' del timone di vela destro
      - [[{prua: 29.2}, 0, 10.0], [565, 600]]       # spigolo prodiero del cielo della vela
      - [[{prua: 42.0}, 0, 10.0], [565, 650]]       # spigolo poppiero del cielo della vela
      - [[{prua: 162.0}, 0, 3.4], [1525, 2508]]     # cima del timone verticale, a meta' corda
