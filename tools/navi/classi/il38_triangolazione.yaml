# Triangolazione degli elementi principali dell'Il-38 da tre foto (tools/navi/triangola.py).
# xyz = [distanza dal muso, y (sinistra), quota]; asse della fusoliera a z = 10. Lunghezza 39,6 m (muso - punta del MAD).
L: 39.6
uscita_fotocamere: extracted/navi/il38/triangolazione_fotocamere.json
elementi:
  naso: {xyz: [0, 0, 10.0]}
  mad: {xyz: [39.6, 0, 10.6], liberi: z}
  deriva_ba: {xyz: [33.0, 0, 16.9], liberi: xz}
  deriva_bu: {xyz: [34.7, 0, 16.9], liberi: xz}
  ala_d: {xyz: [12.5, -18.7, 9.9], liberi: xz}
  ala_s: {simmetrico_di: ala_d}
  ala_d_bu: {xyz: [14.6, -18.7, 9.9], liberi: x}
  stab_d: {xyz: [33.0, -5.9, 10.6], liberi: xyz}
  est_d: {xyz: [8.0, -10.0, 9.6], liberi: xyz}
  int_d: {xyz: [7.0, -4.9, 9.6], liberi: xyz}
