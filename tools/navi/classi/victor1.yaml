# Sottomarino d'attacco Progetto 671 "Ersh" (NATO: Victor I), configurazione 1989: lo scafo del Victor III piu' corto
# (93 m, dossier docs/ricerca/31_firme_lotto1.md), la vela bassa e arrotondata piu' a prua, il timone verticale senza il
# bulbo della schiera rimorchiata. Le posizioni della vela dalla foto aerea di fianco (STIMA dove non si vede). Passo 3
# del primo lotto, approvato dall'utente il 29/10/2026.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua. Quote assolute rispetto al galleggiamento in emersione normale.
nome: Victor I (Progetto 671)
uscita: extracted/navi/victor1
# scafo nero: livello medio e contrasto propri (le foto si portano a questi valori, non al grigio medio 0,45)
tono: 0.22
contrasto: 0.12
moduli_parti: [sottomarini_parti.py]
# scafo di rivoluzione visto quasi di taglio da tutte le foto basse: pesi delle foto piccoli (coseno 0,2-0,4).
# Ombreggiatura di ripiego leggera ed esponente 1 sul coseno, cosi' le foto prevalgono dove vedono la superficie.
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  L: 93.0
  B: 10.6
  # le stazioni del Victor III (tools/navi/classi/victor3.yaml) scalate a 93 m: stesso scafo, piu' corto (dossier 31)
  raggio: [[0.0, 0.0], [0.44, 1.67], [0.88, 2.19], [1.75, 2.85], [2.63, 3.3], [3.51, 3.65], [5.26, 4.17],
           [7.02, 4.53], [8.77, 4.8], [11.41, 5.07], [14.04, 5.22], [16.67, 5.29], [19.3, 5.3], [49.13, 5.3],
           [52.64, 5.05], [57.03, 4.75], [61.42, 4.4], [66.68, 3.55], [71.94, 2.65], [76.33, 1.75], [80.72, 1.2],
           [85.1, 0.9], [89.49, 0.6], [93.0, 0.0]]
  bordo_libero: 3.8        # sommita' dello scafo: immersione ~7 m su 10,6 m di diametro
  # coperta piatta del cassero, larga ~3,6 m, fino all'inizio del cono di poppa
  cassero: [[10.5, 3.55, 1.7], [15.8, 3.65, 1.8], [49.1, 3.65, 1.8], [54.4, 3.4, 1.7]]
  stazioni: 90
  punti_sezione: 48

parti:
  # vela bassa e arrotondata, dalla foto aerea: da 24 a 42 m dalla prua, il cielo a ~8,5 m
  - tipo: vela
    nome: vela
    pianta: ovale
    esponente: 2.5
    livelli:
      - [2.6, {prua: 23.8}, {prua: 42.5}, 1.9]
      - [3.7, {prua: 23.9}, {prua: 41.6}, 1.85]
      - [5.5, {prua: 24.0}, {prua: 39.6}, 1.75]
      - [7.2, {prua: 24.3}, {prua: 37.4}, 1.6]
      - [8.3, {prua: 24.8}, {prua: 35.4}, 1.4]
      - [8.6, {prua: 25.6}, {prua: 34.0}, 1.1]
  - {tipo: cilindro, nome: albero, x: {prua: 30.0}, y: 0, r: 0.12, z0: 8.0, z1: 13.0, n: 6, mat: scuro}
  # timone verticale semplice (senza il bulbo del Victor III)
  - {tipo: timone_verticale, nome: timone, x: {prua: 86.0}, z0: -2.5, z1: 4.4, corda: 5.0, corda_estremita: 4.0, spessore: 0.7, freccia: 0.8}

# le foto da Wikimedia Commons (permesso dell'utente del 29/10/2026; crediti in foto/crediti.json e nel RAPPORTO)
foto:
  - nome: dritta_aerea
    file: extracted/navi/victor1/foto/Victor_I_class_submarine.jpg
    nave: Victor I (Progetto 671), anni '80 (US Navy, pubblico dominio), di dritta dall'alto
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    soglia_mare: 80            # lo scafo ~96 e la vela ~31 sul mare ~64: la soglia prende la vela, i punti fanno il resto
    riquadro: [300, 1000, 2650, 1400]
    fotocamera_iniziale: {posizione: [0, -1000, 500], bersaglio: [0, 0, 2], f: 6000}
    limiti_fotocamera: {elevazione: [10, 45], distanza: [200, 4000], focale: [1500, 30000]}
    punti:
      - [[{prua: 0.5}, 0, 0.0], [2505, 1320]]       # prua al galleggiamento
      - [[{prua: 24.2}, 0, 8.4], [1950, 1134]]      # fronte della vela, sotto lo spigolo superiore
      - [[{prua: 35.0}, 0, 8.6], [1680, 1128]]      # fine del cielo della vela
      - [[{prua: 90.5}, 0, 4.4], [420, 1116]]       # cima del timone
