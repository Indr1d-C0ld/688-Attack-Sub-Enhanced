# Elicottero SH-60B Seahawk (LAMPS Mk III), configurazione 1989: oggetto in volo (vista: volante).
# Coordinate del kit: x verso prua, y verso sinistra, z verso l'alto, metri. Il modello sta tutto sopra z = 0:
# ventre della fusoliera a z = 8,15, fondo delle ruote a z ~7,5 (carrello esteso in volo).
# {prua: d} = punto a d metri dal muso (L = 15,26 m = lunghezza della fusoliera senza rotori).
# Misure pubbliche (aerospaceweb.org, Wikipedia, dati UH-60/SH-60): lunghezza con rotori in moto 19,76 m,
# fusoliera 15,26 m, rotore principale 16,36 m (4 pale), rotore di coda 3,35 m inclinato di 20 gradi,
# altezza alla sommita' del rotore di coda 5,18 m, alla testa del rotore ~3,8 m; carreggiata ~2,8 m,
# passo ~4,8 m (ruotino di coda arretrato di 3,96 m rispetto all'UH-60); stabilizzatore ~4,4 m.
nome: SH-60B Seahawk (LAMPS III)
uscita: extracted/navi/sh60b
moduli_parti: [elicotteri_parti.py]
vista: {volante: true, elevazioni: [0, 10, 25], centro: [0.0, 0.0, 9.3]}
# dischi dei rotori nel materiale 'traliccio', schiarito: puntinato grigio medio come negli sprite originali
albedo: {traliccio: 0.6}

# lo "scafo" e' la fusoliera: sezioni [d dal muso, z basso, z alto, semilarghezza, esponente], quote dal ventre
scafo:
  generatore: fusoliera
  L: 15.26
  z0: 8.15
  sezioni:
    - [0.00, 0.30, 0.70, 0.12, 2.0]
    - [0.12, 0.20, 0.95, 0.45, 2.2]
    - [0.52, 0.18, 1.12, 0.78, 2.5]
    - [1.35, 0.05, 1.56, 1.02, 2.8]
    - [1.90, 0.00, 1.72, 1.12, 3.2]
    - [3.00, 0.00, 1.78, 1.18, 3.5]
    - [6.60, 0.00, 1.78, 1.18, 3.5]
    - [7.30, 0.06, 1.70, 1.00, 3.0]
    - [8.70, 0.12, 1.45, 0.70, 2.6]
    - [10.35, 0.19, 1.15, 0.55, 2.4]
    - [12.00, 0.37, 0.95, 0.42, 2.2]
    - [13.20, 0.60, 0.90, 0.32, 2.0]
    - [13.90, 0.80, 1.00, 0.25, 2.0]

parti:
  # carenatura superiore (trasmissione e motori) e gondole dei motori
  - {tipo: fusoliera, nome: carenatura, L: 15.26, z0: 8.15, sezioni: [[2.6, 1.6, 1.75, 0.55, 3], [3.4, 1.6, 2.0, 0.8, 3], [6.5, 1.6, 2.05, 0.85, 3], [7.3, 1.5, 1.8, 0.6, 2.5], [8.3, 1.3, 1.4, 0.35, 2]]}
  - {tipo: tubo, nome: motore_sinistro, x0: {prua: 7.4}, x1: {prua: 4.7}, y: 0.92, z: 10.3, r: 0.40}
  - {tipo: tubo, nome: motore_destro, x0: {prua: 7.4}, x1: {prua: 4.7}, y: -0.92, z: 10.3, r: 0.40}
  # pilone del rotore di coda, a freccia (bordi misurati sulla foto del 1983 calibrata)
  - {tipo: deriva_y, nome: deriva, y: 0.0, spessore: 0.35, profilo: [[{prua: 12.3}, 9.0], [{prua: 14.1}, 8.95], [{prua: 15.3}, 10.9], [{prua: 15.15}, 11.45], [{prua: 14.4}, 11.45]]}
  - {tipo: ellissoide, nome: scatola_coda, x: {prua: 14.5}, y: -0.15, z: 11.15, rx: 0.4, ry: 0.3, rz: 0.3}
  # stabilizzatore a incidenza variabile: in volo lento ~35 gradi a bordo d'uscita basso
  - {tipo: piano, nome: stabilizzatore, z: 9.0, spessore: 0.12, beccheggio: 35, profilo: [[{prua: 12.8}, -2.19], [{prua: 12.8}, 2.19], [{prua: 14.0}, 2.19], [{prua: 14.0}, -2.19]]}
  # albero e testa del rotore principale
  - {tipo: cilindro, nome: albero_rotore, x: {prua: 4.45}, y: 0, r: 0.25, z0: 10.1, z1: 11.2}
  - {tipo: cilindro, nome: testa_rotore, x: {prua: 4.45}, y: 0, r: 0.65, z0: 11.05, z1: 11.4, mat: scuro}
  # carrello: ruote principali sotto la cabina, ruotino doppio sotto il cono di coda (carrello esteso in volo)
  - {tipo: ruota, nome: ruota_destra, x: {prua: 3.1}, y: -1.40, z: 7.85, r: 0.33, larghezza: 0.22}
  - {tipo: ruota, nome: ruota_sinistra, x: {prua: 3.1}, y: 1.40, z: 7.85, r: 0.33, larghezza: 0.22}
  - {tipo: tubo_inclinato, nome: gamba_destra, da: [{prua: 3.1}, -1.30, 7.85], a: [{prua: 3.0}, -1.05, 8.6], r: 0.09, mat: scuro}
  - {tipo: tubo_inclinato, nome: gamba_sinistra, da: [{prua: 3.1}, 1.30, 7.85], a: [{prua: 3.0}, 1.05, 8.6], r: 0.09, mat: scuro}
  - {tipo: tubo_inclinato, nome: braccio_destro, da: [{prua: 3.1}, -1.25, 7.85], a: [{prua: 2.2}, -0.9, 8.3], r: 0.08, mat: scuro}
  - {tipo: tubo_inclinato, nome: braccio_sinistro, da: [{prua: 3.1}, 1.25, 7.85], a: [{prua: 2.2}, 0.9, 8.3], r: 0.08, mat: scuro}
  - {tipo: ruota, nome: ruotino_destro, x: {prua: 8.0}, y: -0.17, z: 7.3, r: 0.22, larghezza: 0.15}
  - {tipo: ruota, nome: ruotino_sinistro, x: {prua: 8.0}, y: 0.17, z: 7.3, r: 0.22, larghezza: 0.15}
  - {tipo: tubo_inclinato, nome: gamba_ruotino, da: [{prua: 8.0}, 0, 7.3], a: [{prua: 7.85}, 0, 8.35], r: 0.07, mat: scuro}
  # radome del radar APS-124 sotto la cabina (sporge ~0,35 m sotto il ventre)
  - {tipo: ellissoide, nome: radome_aps124, x: {prua: 2.0}, y: 0, z: 8.05, rx: 1.0, ry: 0.8, rz: 0.3}
  # piloni d'arma con due siluri Mk 46 e MAD rimorchiato (ASQ-81) sul fianco destro del cono di coda
  - {tipo: tubo_inclinato, nome: siluro_destro, da: [{prua: 4.6}, -1.45, 8.5], a: [{prua: 7.2}, -1.45, 8.5], r: 0.17}
  - {tipo: tubo_inclinato, nome: siluro_sinistro, da: [{prua: 4.6}, 1.45, 8.5], a: [{prua: 7.2}, 1.45, 8.5], r: 0.17}
  - {tipo: scatola, nome: pilone_destro, x0: {prua: 6.5}, x1: {prua: 5.3}, y0: -1.45, y1: -1.1, z0: 8.55, z1: 8.85}
  - {tipo: scatola, nome: pilone_sinistro, x0: {prua: 6.5}, x1: {prua: 5.3}, y0: 1.1, y1: 1.45, z0: 8.55, z1: 8.85}
  - {tipo: tubo_inclinato, nome: mad, da: [{prua: 7.6}, -0.95, 9.2], a: [{prua: 9.4}, -0.85, 9.2], r: 0.17, r_fine: 0.12}
  # rotori in moto: dischi puntinati (vedi elicotteri_parti.disco_rotore); albero inclinato in avanti di 3 gradi
  - {tipo: disco_rotore, nome: rotore_principale, x: {prua: 4.45}, y: 0, z: 11.25, raggio: 8.18, normale: [0.052, 0, 0.9986], conicita: 3, densita: 0.22, lato: 0.12, raggio_interno: 0.7, seme: 1, mat: traliccio, spessore: 0.25, inclinazione: 25}
  # rotore di coda sul lato destro del pilone, piano inclinato di 20 gradi (sommita' verso sinistra)
  - {tipo: disco_rotore, nome: rotore_coda, x: {prua: 14.36}, y: -0.45, z: 11.1, raggio: 1.675, normale: [0, 0.94, -0.342], conicita: 0, densita: 0.25, lato: 0.08, raggio_interno: 0.2, seme: 2, mat: traliccio}

