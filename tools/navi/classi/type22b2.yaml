  - {tipo: harpoon, nome: exocet_dritta_1, x: {prua: 33.0}, y: -3.6, z0: 9.6, verso: 1, lunghezza: 5.6, elevazione: 12}
  - {tipo: harpoon, nome: exocet_dritta_2, x: {prua: 33.0}, y: -2.2, z0: 9.6, verso: 1, lunghezza: 5.6, elevazione: 12}
  - {tipo: harpoon, nome: exocet_sinistra_1, x: {prua: 33.0}, y: 2.2, z0: 9.6, verso: 1, lunghezza: 5.6, elevazione: 12}
  - {tipo: harpoon, nome: exocet_sinistra_2, x: {prua: 33.0}, y: 3.6, z0: 9.6, verso: 1, lunghezza: 5.6, elevazione: 12}
  - {tipo: tuga, nome: basamento_sea_wolf_prodiero, x0: {prua: 44.0}, x1: {prua: 39.5}, y0: -1.8, y1: 1.8, z0: 8.9, z1: 10.0}
  - {tipo: scatola, nome: sea_wolf_prodiero, x0: {prua: 43.4}, x1: {prua: 40.0}, y0: -1.4, y1: 1.4, z0: 10.0, z1: 12.4, mat: bianco}
  # ---------------- la sovrastruttura prodiera, la plancia, il Type 910 prodiero
  - {tipo: tuga, nome: tuga_prodiera, x0: {prua: 84.0}, x1: {prua: 48.7}, y0: -6.4, y1: 6.4, z0: 7.6, z1: 14.0, rastrema: 0.98}
