  # ---------------- l'hangar col Sea Wolf poppiero, la coperta di volo un ponte piu' in basso
  - {tipo: tuga, nome: hangar, x0: {prua: 125.0}, x1: {prua: 115.0}, y0: -6.6, y1: 6.6, z0: 4.2, z1: 12.9}
  - {tipo: scatola, nome: sea_wolf_poppiero, x0: {prua: 120.7}, x1: {prua: 118.0}, y0: -1.4, y1: 1.4, z0: 12.9, z1: 15.6, mat: bianco}
