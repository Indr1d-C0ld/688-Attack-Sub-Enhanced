# Fregata Type 22 Batch 2 (classe Boxer, Royal Navy), configurazione 1989: lo scafo allungato a 146,5 m per la schiera
# Type 2031Z, con la prua alta e slanciata; come la Batch 1 niente cannone, il Sea Wolf a sestuplo sul castello e
# sull'hangar, i quattro Exocet MM38 a prua, la torre prodiera col Type 967/968, il fumaiolo largo, l'albero poppiero
# nero in cima; l'hangar piu' grande e la coperta di volo un ponte piu' in basso.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri; {prua: d} =
# punto a d metri dalla prua. Misure: 146,5 x 14,8 m (dossier docs/ricerca/32_firme_lotto2.md); posizioni e quote
# misurate sulla foto di dritta della HMS Beaver a RIMPAC '86 (DoD, quasi al traverso e in piano, ~12,4 px/m), affinate
# con gli scarti della calibrazione (STIMA dove la foto non arriva). Modello proprio approvato il 30/10/2026.
nome: Type 22 Boxer (Batch 2)
uscita: extracted/navi/type22b2

scafo:
  L: 146.5
  B: 14.8
  bordo: [[0, 12.3], [8, 11.0], [25, 10.0], [45, 9.0], [70, 8.0], [100, 7.5], [122.5, 7.4], [124.5, 4.2], [146.5, 4.0]]
  slancio: 11.5
  finezza_prua: 52
  specchio: 0.8
  svasatura: 0.07
  pienezza: [0.8, 0.45]

parti:
