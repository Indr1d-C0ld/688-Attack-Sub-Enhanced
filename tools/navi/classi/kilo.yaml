# Sottomarino diesel-elettrico Progetto 877 "Paltus" (NATO: Kilo), configurazione 1989: scafo doppio a goccia,
# coperta piatta larga sul cassero, vela lunga a fianchi verticali e cielo piatto senza timoni (i timoni
# orizzontali prodieri sono a scafo, retratti in emersione), in emersione normale (immersione 6,2 m su 9,9 m).
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri.
# {prua: d} = punto a d metri dalla prua. Quote assolute rispetto al galleggiamento in emersione normale.
# Foto della Yunes (1995, a rimorchio) scaricata ma non usata: calibrazione non affidabile (vedi RAPPORTO.md).
# Misure: lunghezza 72,6 m e diametro 9,9 m (Progetto 877); vela tra 19,5 e 35,6 m dalla prua e cielo a 8,8 m
# misurati sulle foto (extracted/navi/kilo/lavoro/triangola_kilo.yaml: triangolazione debole, foto tutte rialzate).
nome: Kilo (Progetto 877)
uscita: extracted/navi/kilo
# scafo nero: livello medio e contrasto propri (le foto si portano a questi valori, non al grigio medio 0,45)
tono: 0.22
contrasto: 0.12
moduli_parti: [sottomarini_parti.py]
# scafo di rivoluzione visto quasi di taglio dalle foto: ombreggiatura di ripiego leggera, esponente 1 sul coseno
peso_ombra: 0.03

scafo:
  generatore: scafo_sottomarino
  L: 72.6
  B: 9.9
  forma: {prua: 9.0, poppa: 28.0, esponente_prua: 3.0, esponente_poppa: 1.3, raggio_coda: 0.4}   # prua piena e alta, coda affusolata
  bordo_libero: 3.7        # immersione 6,2 m su 9,9 m di diametro
  # cassero: coperta piatta larga ~4,4 m; a poppa si restringe e scende fino al timone superiore
  cassero: [[3.0, 3.0, 1.2], [8.0, 3.7, 2.2], [48.0, 3.7, 2.2], [58.0, 3.35, 1.7], [66.0, 2.6, 1.0], [70.5, 1.7, 0.35], [72.2, 1.3, 0.25], [72.6, 0.3, 0.1]]   # ultimo tratto: timone superiore
  stazioni: 90
  punti_sezione: 48

parti:
  # vela: pianta ovale a fianchi quasi paralleli, cielo piatto
  - tipo: vela
    nome: vela
    pianta: ovale
    esponente: 4.0
    livelli:
      - [3.0, {prua: 19.5}, {prua: 35.6}, 1.35]
      - [9.0, {prua: 19.6}, {prua: 35.6}, 1.3]
      - [9.4, {prua: 19.9}, {prua: 35.4}, 1.15]

foto:
  - nome: fianco_dritta
    file: extracted/navi/kilo/foto/fianco_dritta_1987.jpg
    maschera_file: extracted/navi/kilo/foto/fianco_dritta_1987_maschera.png   # classi/kilo_maschere.yaml
    nave: Kilo sovietico non identificato, 1987
    esponente_peso: 1.0
    qualita: 1.0
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [0, -700, 200], bersaglio: [0, 0, 3], f: 15000}
    prior_fotocamera: {elevazione: 17, sigma_el: 4, distanza: 1200, sigma_logD: 0.4}   # teleobiettivo da aereo
    limiti_fotocamera: {azimut: [-115, -65], elevazione: [5, 35]}
    punti:
      - [[{prua: 71.5}, 0, 1.6], [57, 777]]        # estremita' poppiera del cassero (timone superiore)
      - [[{prua: 35.6}, 0, 9.4], [900, 680]]       # cielo della vela, spigolo poppiero
      - [[{prua: 19.6}, 0, 9.4], [1277, 723]]      # cielo della vela, fronte
      - [[{prua: 35.6}, -1.35, 3.7], [897, 810]]    # piede poppiero della vela, lato dritto
      - [[{prua: 11.5}, 0, 3.7], [1433, 866]]      # anello del portello prodiero
      - [[{prua: 61.0}, 0, 3.1], [310, 770]]       # anello del portello poppiero
      - [[{prua: 57.4}, 0, 3.3], [393, 770]]       # segno bianco e rosso a proravia del portello poppiero
  - nome: poppa_dritta
    file: extracted/navi/kilo/foto/poppa_dritta_nooh_1993.jpg
    maschera_file: extracted/navi/kilo/foto/poppa_dritta_nooh_1993_maschera.png   # classi/kilo_maschere.yaml
    nave: Nooh (902), Iran (Progetto 877EKM), 1993
    esponente_peso: 1.0
    qualita: 0.9
    specchiabile: true
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [-300, -350, 150], bersaglio: [0, 0, 3], f: 9000}
    prior_fotocamera: {elevazione: 20, sigma_el: 4, distanza: 1200, sigma_logD: 0.4}
    limiti_fotocamera: {azimut: [-170, -105], elevazione: [5, 40]}
    punti:
      - [[{prua: 71.5}, 0, 1.6], [165, 1045]]
      - [[{prua: 35.6}, 0, 9.4], [989, 617]]
      - [[{prua: 19.6}, 0, 9.4], [1343, 558]]
      - [[{prua: 35.6}, -1.35, 3.7], [978, 794]]
      - [[{prua: 19.6}, -1.35, 3.7], [1343, 707]]
      - [[{prua: 11.5}, 0, 3.7], [1482, 700]]
      - [[{prua: 61.0}, 0, 3.1], [394, 964]]
      - [[{prua: 57.4}, 0, 3.3], [478, 933]]
  - nome: prua
    file: extracted/navi/kilo/foto/prua_flotta_nord_1994.jpg
    maschera_file: extracted/navi/kilo/foto/prua_flotta_nord_1994_maschera.png   # classi/kilo_maschere.yaml
    nave: Kilo della Flotta del Nord non identificato, ~1994
    esponente_peso: 1.0
    qualita: 0.8
    specchiabile: false
    orizzonte_y: 0
    soglia_cielo: 0
    fotocamera_iniziale: {posizione: [250, 0, 70], bersaglio: [0, 0, 4], f: 9000}
    prior_fotocamera: {elevazione: 15, sigma_el: 5, distanza: 600, sigma_logD: 0.4}
    limiti_fotocamera: {azimut: [-20, 20], elevazione: [3, 40]}
    punti:
      - [[{prua: 11.5}, 0, 3.7], [1020, 1860]]     # anello del portello prodiero
      - [[{prua: 19.6}, 0, 9.4], [1000, 1160]]     # cielo della vela, fronte
      - [[{prua: 19.9}, -1.3, 9.2], [860, 1205]]  # spigolo superiore prodiero, lato dritto
      - [[{prua: 19.9}, 1.3, 9.2], [1140, 1205]]  # spigolo superiore prodiero, lato sinistro
      - [[{prua: 19.6}, -1.35, 3.7], [880, 1800]]   # piede della vela, lato dritto
      - [[{prua: 19.6}, 1.35, 3.7], [1140, 1800]]   # piede della vela, lato sinistro
