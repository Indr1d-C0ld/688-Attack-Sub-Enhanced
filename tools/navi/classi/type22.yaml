# Fregata Type 22 Batch 1 (classe Broadsword, Royal Navy), configurazione 1989: niente cannone; il Sea Wolf a sestuplo
# sul castello e il secondo sopra l'hangar, coi Type 910 a prua e a poppa; i quattro Exocet MM38 davanti alla plancia;
# la torre prodiera col Type 967/968, il fumaiolo largo col cappello nero, l'albero poppiero, i radomi del SCOT;
# l'hangar doppio e il ponte di volo.
# Coordinate del kit: x verso prua (origine a meta' lunghezza), y verso sinistra, z verso l'alto, metri; {prua: d} =
# punto a d metri dalla prua. Misure: 131,2 x 14,8 m (dossier docs/ricerca/32_firme_lotto2.md); posizioni e quote
# misurate sulla foto di dritta del 1987 (HMS Broadsword, DoD, ~16,8 px/m), affinate con gli scarti della calibrazione
# (STIMA dove la foto non arriva). Modello proprio approvato dalla principale e dall'utente il 30/10/2026.
nome: Type 22 Broadsword (Batch 1)
uscita: extracted/navi/type22

scafo:
  L: 131.2
  B: 14.8
  bordo: [[0, 8.2], [40, 7.9], [90, 7.2], [110, 6.7], [131.2, 6.1]]
  slancio: 4.0
  finezza_prua: 42
  specchio: 0.8
  svasatura: 0.05
  pienezza: [0.8, 0.5]

parti:
