      - [[{prua: 93.0}, -28.0, 31.8], [615, 670]]      # cima dell'asta prodiera
      - [[{prua: 209.0}, -20.0, 18.8], [1107, 735]]    # isola, spigolo prodiero interno alla base
  - nome: prua_sinistra_aerea
    file: extracted/navi/nimitz/foto/prua_sinistra_vinson_1982.jpg
    nave: USS Carl Vinson (CVN-70), 1982 (prove in mare, ripresa rialzata)
    qualita: 0.7
    esponente_peso: 4
