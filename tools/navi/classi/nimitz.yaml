    orizzonte_y: 582
    soglia_cielo: 172
    riquadro: [1000, 350, 1700, 582]
    soglia_schiuma: 175
    fotocamera_iniziale: {posizione: [440, 160, 35], bersaglio: [60, 0, 15], f: 3500}   # circa 300 m a proravia sinistra
    punti:
      # il bordo prodiero del ponte si vede di scorcio da sinistra-prua: va da (468, 737) a (720, 765)
