    orizzonte_y: 0            # nessun cielo: maschera dal modello e dal riconoscimento del mare
    soglia_cielo: 0
    cancella: [[1140, 690, 1185, 735]]        # numero 71 sull'isola
    soglia_schiuma: 215
    fotocamera_iniziale: {posizione: [0, 1500, 800], bersaglio: [0, 0, 10], f: 7550}
    punti:
      - [[{prua: 0}, 0, 18.8], [176, 760]]             # ponte di volo, centro del bordo prodiero
